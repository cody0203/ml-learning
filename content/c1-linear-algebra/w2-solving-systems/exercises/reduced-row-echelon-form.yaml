  explanation:
    vi: 'Các cặp nhấn mạnh phần dọn thêm của RREF: pivot bằng 1 và số 0 cả trên lẫn dưới.'
    en: 'The pairs highlight the extra RREF cleanup: unit pivots and zeros above as well as below.'
  hints: []
  pairs:
  - left:
      vi: Pivot
      en: Pivot
    right:
      vi: Phần tử khác 0 đầu tiên của hàng trong REF
      en: First non-zero entry of a REF row
  - left:
      vi: Rank
      en: Rank
    right:
      vi: Số pivot/thông tin độc lập
      en: Number of pivots/independent information
  - left:
      vi: $0=c, c\ne0$
      en: $0=c, c\ne0$
    right:
      vi: Mâu thuẫn, vô nghiệm
      en: Contradiction, no solution
  - left:
      vi: Cộng bội hàng
      en: Row replacement
    right:
      vi: Phép dòng hợp lệ
