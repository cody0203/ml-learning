exercises:
- id: c1w2-reduced-row-echelon-form-mcq-01
  topic: reduced-row-echelon-form
  type: mcq
  difficulty: 1
  tags:
  - concept
  prompt:
    en: After reducing $\left[\begin{array}{cc|c}1&2&7\\0&3&6\end{array}\right]$, which final augmented matrix is RREF?
    vi: Sau khi khử $\left[\begin{array}{cc|c}1&2&7\\0&3&6\end{array}\right]$, ma trận mở rộng cuối nào là RREF?
  explanation:
    en: RREF needs unit pivots and zeros above and below pivot positions, so the identity coefficient side with constants 3 and 2 is correct. The second option has a 2 above the second pivot, the third has pivot 3 not scaled, and the fourth has pivot columns ordered incorrectly for REF.
    vi: RREF cần pivot bằng 1 và số 0 cả trên lẫn dưới vị trí pivot, nên vế hệ số là ma trận đơn vị với hằng số 3 và 2 là đúng. Lựa chọn hai còn số 2 phía trên pivot thứ hai, lựa chọn ba chưa chuẩn hóa pivot 3, và lựa chọn bốn sắp thứ tự cột pivot sai với REF.
  hints: []
  options:
  - en: $\left[\begin{array}{cc|c}1&0&3\\0&1&2\end{array}\right]$
    vi: $\left[\begin{array}{cc|c}1&0&3\\0&1&2\end{array}\right]$
  - en: $\left[\begin{array}{cc|c}1&2&7\\0&1&2\end{array}\right]$
    vi: $\left[\begin{array}{cc|c}1&2&7\\0&1&2\end{array}\right]$
  - en: $\left[\begin{array}{cc|c}1&2&7\\0&3&6\end{array}\right]$
    vi: $\left[\begin{array}{cc|c}1&2&7\\0&3&6\end{array}\right]$
  - en: $\left[\begin{array}{cc|c}0&1&2\\1&0&3\end{array}\right]$
    vi: $\left[\begin{array}{cc|c}0&1&2\\1&0&3\end{array}\right]$
  answer:
  - 0
- id: c1w2-reduced-row-echelon-form-truefalse-02
  topic: reduced-row-echelon-form
  type: true-false
  difficulty: 1
  tags:
  - definition
  prompt:
    vi: Trong RREF, mỗi cột pivot có số 0 cả phía trên và phía dưới pivot.
    en: In RREF, each pivot column has zeros above and below its pivot.
  explanation:
    vi: Việc dọn sạch này giúp ma trận mở rộng RREF hiển thị biến đã giải trực tiếp, khác với REF chỉ tam giác trên.
    en: That cleaning is what lets an augmented RREF display solved variables directly, unlike a merely upper-triangular REF.
  hints: []
  answer: true
  reasons:
  - vi: RREF dọn toàn bộ cột pivot.
    en: RREF cleans the entire pivot column.
  - vi: RREF chỉ yêu cầu các phần tử dưới pivot bằng 0, còn phía trên có thể khác 0.
    en: RREF only requires zeros below pivots; entries above them may be non-zero.
  - vi: Chỉ cần pivot bằng 1 là đủ, dù cột pivot vẫn còn số khác 0.
    en: Unit pivots are enough even if their columns still contain other non-zero entries.
  reasonAnswer: 0
- id: c1w2-reduced-row-echelon-form-matching-03
  topic: reduced-row-echelon-form
  type: matching
  difficulty: 1
  tags:
  - connections
  prompt:
    vi: Ghép khái niệm liên quan đến dạng bậc thang rút gọn.
