- id: c1w2-reduced-row-echelon-form-parsons-06
  topic: reduced-row-echelon-form
  type: parsons
  difficulty: 2
  tags:
  - procedure
  prompt:
    vi: Sắp xếp quy trình làm việc cho dạng bậc thang rút gọn.
    en: Order the workflow for reduced row echelon form.
  explanation:
    vi: Sau các bước REF, RREF tiếp tục chuẩn hóa pivot về 1 và xóa phía trên; bỏ qua phần dọn này thì mới chỉ là REF.
    en: After the REF steps, RREF continues by scaling pivots to one and clearing above them; skipping that cleanup leaves only REF.
  hints: []
  steps:
  - vi: Chọn pivot khác 0 ở hàng/cột hiện tại.
    en: Choose a non-zero pivot in the current row/column.
  - vi: Đổi hàng nếu pivot hiện tại bằng 0.
    en: Swap rows if the current pivot is zero.
  - vi: Cộng bội hàng pivot để khử các phần tử dưới pivot.
    en: Add multiples of the pivot row to clear entries below the pivot.
  - vi: Lặp lại ở hệ con bên dưới/bên phải.
    en: Repeat on the lower/right sub-system.
  - vi: Đếm pivot hoặc thế ngược để kết luận.
    en: Count pivots or back-substitute to conclude.
- id: c1w2-reduced-row-echelon-form-finderror-07
  topic: reduced-row-echelon-form
  type: find-error
  difficulty: 2
  tags:
  - error
  prompt:
    vi: Tìm lỗi đầu tiên trong lập luận về dạng bậc thang rút gọn.
    en: Find the first error in the argument about reduced row echelon form.
  explanation:
    vi: Nếu mục tiêu là RREF thì pivot 2 có vấn đề, nhưng các bước trước chỉ kết luận REF; vì vậy bước 3 là sai đầu tiên.
    en: If the target were RREF, pivot 2 would be a problem, but the earlier steps only claimed REF; therefore step 3 is the first mismatch.
  hints: []
  steps:
  - vi: Ma trận có hàng 0 ở cuối và pivot dịch sang phải.
    en: The matrix has zero rows at the bottom and pivots move right.
  - vi: Các phần tử dưới pivot đều bằng 0 nên ma trận ở REF.
    en: Entries below pivots are zero, so the matrix is in REF.
  - vi: Vì một pivot bằng 2, ma trận không thể ở REF.
    en: Because one pivot is 2, the matrix cannot be in REF.
  - vi: Kết luận rank không thể đếm bằng số pivot.
    en: Conclude rank cannot be counted by pivots.
  answer: 2
- id: c1w2-reduced-row-echelon-form-code-08
  topic: reduced-row-echelon-form
  type: code
  difficulty: 3
  tags:
  - code
  - numpy
  prompt:
    vi: Cài đặt `forward_elimination` bằng NumPy cơ bản; không dùng `np.linalg.*` shortcuts.
    en: Implement `forward_elimination` with basic NumPy; do not use `np.linalg.*` shortcuts.
  explanation:
    vi: Mã tạo pivot, chuẩn hóa mỗi hàng pivot về 1, rồi xóa cả trên lẫn dưới để tạo RREF một cách tường minh.
    en: The code first creates pivots, scales each pivot row to one, then clears both above and below to produce RREF explicitly.
  hints: []
  starter: "import numpy as np\n\ndef forward_elimination(A):\n    return np.array(A, dtype=float)\n"
  solution: "import numpy as np\n\ndef forward_elimination(A):\n    M=np.array(A,dtype=float).copy(); m,n=M.shape; r=0\n    for c in range(n):\n        p=None\n        for i in range(r,m):\n            if abs(M[i,c])>1e-12: p=i; break\n        if p is None: continue\n        if p!=r: M[[r,p]]=M[[p,r]]\n        for i in range(r+1,m): M[i,c:]-=(M[i,c]/M[r,c])*M[r,c:]\n        r+=1\n        if r==m: break\n    M[abs(M)<1e-10]=0; return M\n"
  tests: "import numpy as np\n\ndef _rank_rows(M): return int(np.sum(np.any(np.abs(M)>1e-8, axis=1)))\ndef test_rank_one_ref():\n    R=forward_elimination(np.array([[1.,1.,1.],[2.,2.,2.],[3.,3.,3.]]))\n    assert _rank_rows(R)==1 and np.allclose(R[1:],0)\n\ndef test_full_rank_ref():\n    R=forward_elimination(np.array([[1.,1.,2.],[3.,-3.,-1.],[2.,-1.,6.]]))\n    assert _rank_rows(R)==3 and abs(R[1,0])<1e-8 and abs(R[2,0])<1e-8 and abs(R[2,1])<1e-8\n"
