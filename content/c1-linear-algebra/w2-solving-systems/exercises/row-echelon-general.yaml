- id: c1w2-row-echelon-general-parsons-06
  topic: row-echelon-general
  type: parsons
  difficulty: 2
  tags:
  - procedure
  prompt:
    vi: Sắp xếp quy trình làm việc cho dạng bậc thang tổng quát.
    en: Order the workflow for general row echelon form.
  explanation:
    vi: Trường hợp tổng quát vẫn tìm pivot như cũ nhưng cho phép cột trống, nên thứ tự hàng quan trọng hơn việc lấp mọi cột.
    en: The general case follows the same pivot search while allowing empty columns, so the row order matters more than filling every column.
  hints: []
  steps:
  - vi: Chọn pivot khác 0 ở hàng/cột hiện tại.
    en: Choose a non-zero pivot in the current row/column.
  - vi: Đổi hàng nếu pivot hiện tại bằng 0.
    en: Swap rows if the current pivot is zero.
  - vi: Cộng bội hàng pivot để khử các phần tử dưới pivot.
    en: Add multiples of the pivot row to clear entries below the pivot.
  - vi: Lặp lại ở hệ con bên dưới/bên phải.
    en: Repeat on the lower/right sub-system.
  - vi: Đếm pivot hoặc thế ngược để kết luận.
    en: Count pivots or back-substitute to conclude.
- id: c1w2-row-echelon-general-finderror-07
  topic: row-echelon-general
  type: find-error
  difficulty: 2
  tags:
  - error
  prompt:
    vi: Tìm lỗi đầu tiên trong lập luận về dạng bậc thang tổng quát.
    en: Find the first error in the argument about general row echelon form.
  explanation:
    vi: REF tổng quát cũng chấp nhận leading entry không bằng 1, nên dòng sai đầu tiên là câu pivot 2 không thể xuất hiện.
    en: General REF also accepts non-unit leading entries, so the first wrong line is the claim that pivot 2 is impossible.
  hints: []
  steps:
  - vi: Ma trận có hàng 0 ở cuối và pivot dịch sang phải.
    en: The matrix has zero rows at the bottom and pivots move right.
  - vi: Các phần tử dưới pivot đều bằng 0 nên ma trận ở REF.
    en: Entries below pivots are zero, so the matrix is in REF.
  - vi: Vì một pivot bằng 2, ma trận không thể ở REF.
    en: Because one pivot is 2, the matrix cannot be in REF.
  - vi: Kết luận rank không thể đếm bằng số pivot.
    en: Conclude rank cannot be counted by pivots.
  answer: 2
- id: c1w2-row-echelon-general-multistep-10
