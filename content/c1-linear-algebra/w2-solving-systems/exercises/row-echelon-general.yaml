exercises:
- id: c1w2-row-echelon-general-mcq-01
  topic: row-echelon-general
  type: mcq
  difficulty: 1
  tags:
  - concept
  prompt:
    en: For $\begin{bmatrix}0&2&4&1\\0&0&3&6\\0&0&0&0\end{bmatrix}$, which interpretation of the skipped first column is correct?
    vi: Với $\begin{bmatrix}0&2&4&1\\0&0&3&6\\0&0&0&0\end{bmatrix}$, cách hiểu nào đúng về cột đầu bị bỏ qua?
  explanation:
    en: General REF allows leading zero columns; the first pivot may start in column 2 and the next in column 3. Column 1 need not contain a pivot, the rank is 2 here rather than zero, and zero rows belong at the bottom.
    vi: REF tổng quát cho phép cột đầu toàn 0; pivot đầu có thể bắt đầu ở cột 2 và pivot sau ở cột 3. Cột 1 không bắt buộc có pivot, rank ở đây là 2 chứ không phải 0, và hàng 0 phải nằm dưới cùng.
  hints: []
  options:
  - en: The matrix can still be in REF; the first pivot simply starts in column 2.
    vi: Ma trận vẫn có thể ở REF; pivot đầu chỉ bắt đầu ở cột 2.
  - en: REF is impossible unless column 1 contains the first pivot.
    vi: REF là bất khả thi nếu cột 1 không chứa pivot đầu.
  - en: The skipped column forces the rank to be zero.
    vi: Cột bị bỏ qua buộc rank bằng 0.
  - en: A skipped column means the zero row should move to the top.
    vi: Cột bị bỏ qua nghĩa là hàng 0 nên chuyển lên trên cùng.
  answer:
  - 0
- id: c1w2-row-echelon-general-truefalse-02
  topic: row-echelon-general
  type: true-false
  difficulty: 1
  tags:
  - definition
  prompt:
    vi: Một cột đầu toàn 0 có thể bị bỏ qua trong dạng bậc thang dòng.
    en: A leading zero column may be skipped in row echelon form.
  explanation:
    vi: Pivot đầu tiên chỉ xuất hiện ở cột sau; cột bị bỏ qua là cột không pivot chứ không phải lỗi.
    en: The first pivot simply appears in a later column; skipped columns become non-pivot columns rather than violations.
  hints: []
  answer: true
  reasons:
  - vi: Pivot dịch sang phải; không nhất thiết bắt đầu ở cột một.
    en: Pivots move right; they need not start in column one.
  - vi: Cột đầu toàn 0 buộc toàn bộ ma trận có rank 0.
    en: A leading all-zero column forces the whole matrix to have rank 0.
  - vi: Hàng 0 phải được đưa lên trên để bù cho cột không pivot.
    en: A zero row must be moved to the top to compensate for a non-pivot column.
  reasonAnswer: 0
- id: c1w2-row-echelon-general-matching-03
  topic: row-echelon-general
  type: matching
  difficulty: 1
  tags:
  - connections
  prompt:
    vi: Ghép khái niệm liên quan đến dạng bậc thang tổng quát.
    en: Match concepts related to general row echelon form.
  explanation:
    vi: Các cặp giải thích cách cột bị bỏ qua và pivot xuất hiện muộn vẫn phù hợp cầu thang echelon tổng quát.
    en: The pairs explain how skipped columns and later pivots still fit the general echelon staircase.
  hints: []
  pairs:
  - left:
      vi: Pivot
      en: Pivot
    right:
      vi: Phần tử khác 0 đầu tiên của hàng trong REF
      en: First non-zero entry of a REF row
  - left:
      vi: Rank
      en: Rank
    right:
      vi: Số pivot/thông tin độc lập
      en: Number of pivots/independent information
  - left:
      vi: $0=c, c\ne0$
      en: $0=c, c\ne0$
    right:
      vi: Mâu thuẫn, vô nghiệm
      en: Contradiction, no solution
  - left:
      vi: Cộng bội hàng
      en: Row replacement
    right:
      vi: Phép dòng hợp lệ
      en: Valid row operation
