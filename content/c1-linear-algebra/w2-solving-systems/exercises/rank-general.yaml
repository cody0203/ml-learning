- id: c1w2-rank-general-parsons-06
  topic: rank-general
  type: parsons
  difficulty: 2
  tags:
  - procedure
  prompt:
    vi: Sắp xếp quy trình làm việc cho hạng trong trường hợp tổng quát.
    en: Order the workflow for rank in the general case.
  explanation:
    vi: Với ma trận chữ nhật, quy trình có thể bỏ qua cột, nhưng mỗi pivot được nhận vẫn tăng rank đúng một đơn vị.
    en: For rectangular matrices, the ordered process may skip columns, but every accepted pivot still increases rank by exactly one.
  hints: []
  steps:
  - vi: Chọn pivot khác 0 ở hàng/cột hiện tại.
    en: Choose a non-zero pivot in the current row/column.
  - vi: Đổi hàng nếu pivot hiện tại bằng 0.
    en: Swap rows if the current pivot is zero.
  - vi: Cộng bội hàng pivot để khử các phần tử dưới pivot.
    en: Add multiples of the pivot row to clear entries below the pivot.
  - vi: Lặp lại ở hệ con bên dưới/bên phải.
    en: Repeat on the lower/right sub-system.
  - vi: Đếm pivot hoặc thế ngược để kết luận.
    en: Count pivots or back-substitute to conclude.
- id: c1w2-rank-general-finderror-07
  topic: rank-general
  type: find-error
  difficulty: 2
  tags:
  - error
  prompt:
    vi: Tìm lỗi đầu tiên trong lập luận về hạng trong trường hợp tổng quát.
    en: Find the first error in the argument about rank in the general case.
  explanation:
    vi: Trong trường hợp tổng quát, vị trí pivot mới quan trọng, không phải pivot có bằng 1 không. Lỗi đầu tiên là bác bỏ pivot 2.
    en: In the general case, pivot positions matter, not whether the pivot is 1. The first bad step is rejecting the pivot value 2.
  hints: []
  steps:
  - vi: Ma trận có hàng 0 ở cuối và pivot dịch sang phải.
    en: The matrix has zero rows at the bottom and pivots move right.
  - vi: Các phần tử dưới pivot đều bằng 0 nên ma trận ở REF.
    en: Entries below pivots are zero, so the matrix is in REF.
  - vi: Vì một pivot bằng 2, ma trận không thể ở REF.
    en: Because one pivot is 2, the matrix cannot be in REF.
  - vi: Kết luận rank không thể đếm bằng số pivot.
    en: Conclude rank cannot be counted by pivots.
  answer: 2
- id: c1w2-rank-general-code-08
  topic: rank-general
  type: code
  difficulty: 3
  tags:
  - code
  - numpy
  prompt:
    vi: Cài đặt `rank_by_elimination` bằng NumPy cơ bản; không dùng `np.linalg.*` shortcuts.
    en: Implement `rank_by_elimination` with basic NumPy; do not use `np.linalg.*` shortcuts.
  explanation:
    vi: Lời giải đếm pivot bằng cách quét cột và khử phía dưới, hoạt động cho ma trận chữ nhật mà không dựa vào matrix_rank.
    en: The solution counts pivots by scanning columns and eliminating below them, which works for rectangular inputs without relying on matrix_rank.
  hints: []
  starter: "import numpy as np\n\ndef rank_by_elimination(A, tol=1e-9):\n    return 0\n"
  solution: "import numpy as np\n\ndef rank_by_elimination(A, tol=1e-9):\n    M=np.array(A,dtype=float).copy(); m,n=M.shape; r=0\n    for c in range(n):\n        pivot=None\n        for i in range(r,m):\n            if abs(M[i,c])>tol: pivot=i; break\n        if pivot is None: continue\n        if pivot!=r: M[[r,pivot]]=M[[pivot,r]]\n        for i in range(r+1,m): M[i,c:]-=(M[i,c]/M[r,c])*M[r,c:]\n        r+=1\n        if r==m: break\n    return r\n"
  tests: "import numpy as np\n\ndef test_rectangular():\n    assert rank_by_elimination(np.array([[1.,0.],[0.,1.],[1.,1.]])) == 2\n\ndef test_rank_one():\n    assert rank_by_elimination(np.array([[1.,2.,3.],[2.,4.,6.],[-1.,-2.,-3.]])) == 1\n\ndef test_zero():\n    assert rank_by_elimination(np.zeros((3,4))) == 0\n"
