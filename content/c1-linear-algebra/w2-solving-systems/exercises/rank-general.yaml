exercises:
- id: c1w2-rank-general-mcq-01
  topic: rank-general
  type: mcq
  difficulty: 1
  tags:
  - concept
  prompt:
    en: "A $2\times5$ matrix has three columns that look independent by eye. What is the largest rank it can actually have?"
    vi: "Một ma trận $2\\times5$ có ba cột nhìn có vẻ độc lập. Rank lớn nhất thật sự có thể là bao nhiêu?"
  explanation:
    en: "Rank is at most $\\min(m,n)$, so a $2\times5$ matrix cannot exceed rank 2. Five columns and ten entries do not create extra pivot rows; visual guesses about three columns must still respect the two-row cap."
    vi: "Rank không vượt quá $\\min(m,n)$, nên ma trận $2\\times5$ không thể vượt rank 2. Năm cột và mười entry không tạo thêm hàng pivot; phỏng đoán ba cột độc lập vẫn bị giới hạn bởi hai hàng."
  hints: []
  options:
  - en: 2, because each pivot needs its own row as well as its own column.
    vi: 2, vì mỗi pivot cần một hàng riêng cũng như một cột riêng.
  - en: 5, because there are five columns available.
    vi: 5, vì có năm cột sẵn có.
  - en: 3, because three columns looked independent at first glance.
    vi: 3, vì ban đầu nhìn thấy ba cột có vẻ độc lập.
  - en: 10, because the matrix has ten scalar entries.
    vi: 10, vì ma trận có mười phần tử vô hướng.
  answer:
  - 0
- id: c1w2-rank-general-truefalse-02
  topic: rank-general
  type: true-false
  difficulty: 1
  tags:
  - definition
  prompt:
    vi: Ma trận m by n không bao giờ có rank lớn hơn min(m,n).
    en: An m by n matrix can never have rank larger than min(m,n).
  explanation:
    vi: Mỗi pivot cần một hàng và một cột riêng, vì vậy kích thước nhỏ hơn chặn số pivot.
    en: Each pivot needs both a distinct row and a distinct column, so the smaller dimension caps the pivot count.
  hints: []
  answer: true
  reasons:
  - vi: Số pivot không thể vượt số hàng hoặc số cột.
    en: Pivots cannot outnumber rows or columns.
  - vi: Một ma trận nhiều cột luôn có rank bằng số cột, dù có ít hàng hơn.
    en: A matrix with many columns always has rank equal to its column count, even with fewer rows.
  - vi: Rank có thể vượt cả số hàng lẫn số cột nếu các entry khác 0.
    en: Rank can exceed both row and column counts when entries are non-zero.
  reasonAnswer: 0
- id: c1w2-rank-general-matching-03
  topic: rank-general
  type: matching
  difficulty: 1
  tags:
  - connections
  prompt:
    vi: Ghép khái niệm liên quan đến hạng trong trường hợp tổng quát.
    en: Match concepts related to rank in the general case.
  explanation:
    vi: Các cặp bao quát giới hạn chữ nhật, cột pivot, và biến tự do trong bối cảnh rank tổng quát.
    en: The pairs cover rectangular limits, pivot columns, and free variables for the general rank setting.
  hints: []
  pairs:
  - left:
      vi: Pivot
      en: Pivot
    right:
      vi: Phần tử khác 0 đầu tiên của hàng trong REF
      en: First non-zero entry of a REF row
  - left:
      vi: Rank
      en: Rank
    right:
      vi: Số pivot/thông tin độc lập
      en: Number of pivots/independent information
  - left:
      vi: $0=c, c\ne0$
      en: $0=c, c\ne0$
    right:
      vi: Mâu thuẫn, vô nghiệm
      en: Contradiction, no solution
  - left:
      vi: Cộng bội hàng
      en: Row replacement
    right:
      vi: Phép dòng hợp lệ
      en: Valid row operation
