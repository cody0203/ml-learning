- id: c1w2-row-operations-singularity-construct-05
  topic: row-operations-singularity
  type: construct
  difficulty: 2
  tags:
  - construct
  prompt:
    vi: Tạo ma trận 2×2 non-singular, nguyên, không chéo.
    en: Construct a non-singular integer 2×2 matrix that is not diagonal.
  explanation:
    vi: Mẫu singular vì hàng 2 gấp đôi hàng 1; phép dòng có thể làm lộ hàng 0 nhưng không biến nó thành full rank.
    en: The sample is singular because row 2 is twice row 1; row operations may expose a zero row but cannot make it full rank.
