exercises:
- id: c1w2-row-operations-singularity-mcq-01
  topic: row-operations-singularity
  type: mcq
  difficulty: 1
  tags:
  - concept
  prompt:
    en: Matrix $A=\begin{bmatrix}5&1\\4&3\end{bmatrix}$ has determinant 11. If row 2 is replaced by row 2 minus row 1, what happens to singularity?
    vi: Ma trận $A=\begin{bmatrix}5&1\\4&3\end{bmatrix}$ có định thức (determinant) 11. Nếu thay hàng 2 bằng hàng 2 trừ hàng 1, tính suy biến thay đổi thế nào?
  explanation:
    en: Adding or subtracting a multiple of one row to another preserves the determinant, so determinant 11 stays non-zero. Subtracting a row is not automatically singular; sign changes are specific to row swaps; and negative entries do not imply determinant zero.
    vi: Cộng hoặc trừ bội của một hàng vào hàng khác bảo toàn determinant, nên determinant 11 vẫn khác 0. Trừ hàng không tự động làm singular; đổi dấu là hiệu ứng của đổi hai hàng; và phần tử âm không làm determinant bằng 0.
  hints: []
  options:
  - en: It stays non-singular; row replacement leaves the determinant 11.
    vi: Ma trận vẫn non-singular; row replacement giữ determinant bằng 11.
  - en: It becomes singular because one row was subtracted.
    vi: Ma trận trở thành singular vì đã trừ một hàng.
  - en: The determinant must change sign after any row operation.
    vi: Determinant phải đổi dấu sau mọi phép dòng.
  - en: The determinant becomes zero because the new row contains a negative entry.
    vi: Determinant thành 0 vì hàng mới có phần tử âm.
  answer:
  - 0
- id: c1w2-row-operations-singularity-truefalse-02
  topic: row-operations-singularity
  type: true-false
  difficulty: 1
  tags:
  - definition
  prompt:
    vi: Cộng bội của một hàng vào hàng khác bảo toàn việc ma trận vuông có singular hay không.
    en: Adding a multiple of one row to another preserves whether a square matrix is singular.
  explanation:
    vi: Row replacement đảo được bằng cách trừ lại bội đó, và determinant không đổi, nên giá trị 0 vẫn là 0.
    en: Row replacement is reversible by subtracting the same multiple, and it leaves the determinant unchanged, so zero stays zero.
  hints: []
  answer: true
  reasons:
  - vi: Phép này đảo được và bảo toàn determinant.
    en: The operation is reversible and determinant-preserving.
  - vi: Trừ một hàng luôn làm mất một pivot nên determinant phải thành 0.
    en: Subtracting a row always removes a pivot, so the determinant must become 0.
  - vi: Row replacement đổi dấu determinant giống như đổi chỗ hai hàng.
    en: Row replacement flips the determinant sign just like swapping two rows.
  reasonAnswer: 0
- id: c1w2-row-operations-singularity-matching-03
  topic: row-operations-singularity
  type: matching
  difficulty: 1
  tags:
  - connections
  prompt:
    vi: Ghép khái niệm liên quan đến phép dòng và tính suy biến.
    en: Match concepts related to row operations and singularity.
  explanation:
    vi: Các cặp nhận diện phép nào đổi dấu, nhân hệ số, hoặc giữ determinant trong khi bảo toàn trạng thái singularity.
    en: The matches identify which operations flip, scale, or preserve determinant while keeping singularity status intact.
  hints: []
  pairs:
  - left:
      vi: Pivot
      en: Pivot
    right:
      vi: Phần tử khác 0 đầu tiên của hàng trong REF
      en: First non-zero entry of a REF row
  - left:
      vi: Rank
      en: Rank
    right:
      vi: Số pivot/thông tin độc lập
      en: Number of pivots/independent information
  - left:
      vi: $0=c, c\ne0$
      en: $0=c, c\ne0$
    right:
      vi: Mâu thuẫn, vô nghiệm
      en: Contradiction, no solution
  - left:
      vi: Cộng bội hàng
      en: Row replacement
    right:
      vi: Phép dòng hợp lệ
