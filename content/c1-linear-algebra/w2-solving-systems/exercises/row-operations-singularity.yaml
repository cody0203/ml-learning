    - 2
  - - 3
    - 1
- id: c1w2-row-operations-singularity-parsons-06
  topic: row-operations-singularity
  type: parsons
  difficulty: 2
  tags:
  - procedure
  prompt:
    vi: Sắp xếp quy trình làm việc cho phép dòng và tính suy biến.
    en: Order the workflow for row operations and singularity.
  explanation:
    vi: Các bước này chỉ dùng phép dòng đảo được, nên trạng thái determinant bằng 0 hay khác 0 được giữ cho đến khi pivot làm lộ singularity.
    en: These steps use only reversible row moves, so the zero/non-zero determinant status survives until pivots reveal singularity.
  hints: []
  steps:
  - vi: Chọn pivot khác 0 ở hàng/cột hiện tại.
    en: Choose a non-zero pivot in the current row/column.
  - vi: Đổi hàng nếu pivot hiện tại bằng 0.
    en: Swap rows if the current pivot is zero.
  - vi: Cộng bội hàng pivot để khử các phần tử dưới pivot.
    en: Add multiples of the pivot row to clear entries below the pivot.
  - vi: Lặp lại ở hệ con bên dưới/bên phải.
    en: Repeat on the lower/right sub-system.
  - vi: Đếm pivot hoặc thế ngược để kết luận.
    en: Count pivots or back-substitute to conclude.
- id: c1w2-row-operations-singularity-finderror-07
  topic: row-operations-singularity
  type: find-error
  difficulty: 2
  tags:
  - error
  prompt:
    vi: Tìm lỗi đầu tiên trong lập luận về phép dòng và tính suy biến.
    en: Find the first error in the argument about row operations and singularity.
  explanation:
    vi: Trạng thái determinant không bị đe dọa bởi pivot bằng 2; bước sai đầu tiên là bác bỏ một pivot khác 0 hợp lệ.
    en: The determinant status is not threatened by a pivot equal to 2; the first wrong step is rejecting a legal non-zero pivot.
  hints: []
  steps:
  - vi: Ma trận có hàng 0 ở cuối và pivot dịch sang phải.
    en: The matrix has zero rows at the bottom and pivots move right.
  - vi: Các phần tử dưới pivot đều bằng 0 nên ma trận ở REF.
    en: Entries below pivots are zero, so the matrix is in REF.
  - vi: Vì một pivot bằng 2, ma trận không thể ở REF.
    en: Because one pivot is 2, the matrix cannot be in REF.
  - vi: Kết luận rank không thể đếm bằng số pivot.
    en: Conclude rank cannot be counted by pivots.
  answer: 2
- id: c1w2-row-operations-singularity-code-08
  topic: row-operations-singularity
  type: code
  difficulty: 3
  tags:
  - code
  - numpy
  prompt:
    vi: Cài đặt `row_ops` bằng NumPy cơ bản; không dùng `np.linalg.*` shortcuts.
    en: Implement `row_ops` with basic NumPy; do not use `np.linalg.*` shortcuts.
  explanation:
    vi: Cài đặt dùng phép dòng đảo được và kiểm tra singularity qua mẫu pivot tạo ra thay vì gọi np.linalg.rank.
    en: The implementation applies reversible row operations and verifies singularity by the produced pivot pattern rather than by calling np.linalg.rank.
  hints: []
  starter: 'import numpy as np


    def swap_rows(M,i,j): return np.array(M,dtype=float)

    def scale_row(M,i,factor): return np.array(M,dtype=float)

    '
  solution: "import numpy as np\n\ndef swap_rows(M,i,j):\n    out=np.array(M,dtype=float).copy(); out[[i,j]]=out[[j,i]]; return out\n\ndef scale_row(M,i,factor):\n    if factor==0: raise ValueError('factor must be non-zero')\n    out=np.array(M,dtype=float).copy(); out[i]=factor*out[i]; return out\n"
  tests: "import numpy as np\n\ndef test_swap():\n    assert np.allclose(swap_rows(np.array([[1.,2.],[3.,4.]]),0,1), [[3,4],[1,2]])\n\ndef test_scale():\n    assert np.allclose(scale_row(np.array([[1.,2.],[3.,4.]]),1,-2), [[1,2],[-6,-8]])\n\ndef test_zero_rejected():\n    try: scale_row(np.eye(2),0,0)\n    except ValueError: return\n    assert False, 'factor 0 must be rejected'\n"
