- id: c1w3-matmul-multi-01
  topic: matrix-multiplication
  type: multi-step
  difficulty: 3
  tags:
  - composition
  prompt:
    vi: 'Cho $A=\begin{bmatrix}2&0\\0&3\end{bmatrix}$, $B=\begin{bmatrix}1&1\\0&1\end{bmatrix}$.'
    en: 'Given $A=\begin{bmatrix}2&0\\0&3\end{bmatrix}$, $B=\begin{bmatrix}1&1\\0&1\end{bmatrix}$.'
  explanation:
    vi: Thứ tự nhân quan trọng.
    en: Multiplication order matters.
  hints: []
  parts:
  - type: matrix
    prompt:
      vi: $AB$?
      en: $AB$?
    answer:
    - - 2
      - 2
    - - 0
      - 3
    tolerance: 0
    explanation:
      vi: Áp dụng $B$ trước rồi $A$.
      en: Apply $B$ then $A$.
  - type: matrix
    prompt:
      vi: $BA$?
      en: $BA$?
    answer:
    - - 2
      - 3
    - - 0
      - 3
    tolerance: 0
    explanation:
      vi: '$BA \neq AB$.'
      en: '$BA \neq AB$.'
