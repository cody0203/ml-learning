- id: c1w3-matmul-code-01
  topic: matrix-multiplication
  type: code
  difficulty: 3
  tags:
  - code
  prompt:
    vi: Cài `matmul_loops(A,B)` bằng vòng lặp; không dùng `np.dot`, `np.matmul`, `@`.
    en: Implement `matmul_loops(A,B)` with loops; no `np.dot`, `np.matmul`, `@`.
  explanation:
    vi: Dùng ba vòng lặp i,j,k.
    en: Use three loops i,j,k.
  hints: []
  starter: "import numpy as np\ndef matmul_loops(A,B):\n    A=np.asarray(A); B=np.asarray(B)\n    return np.zeros((A.shape[0],B.shape[1]))\n"
  solution: "import numpy as np\ndef matmul_loops(A,B):\n    A=np.asarray(A); B=np.asarray(B)\n    m,k=A.shape; k2,n=B.shape\n    if k!=k2: raise ValueError(\"shape\")\n    C=np.zeros((m,n),dtype=np.result_type(A,B))\n    for i in range(m):\n        for j in range(n):\n            s=0\n            for t in range(k): s += A[i,t]*B[t,j]\n            C[i,j]=s\n    return C\n"
  tests: "import numpy as np\ndef test_2x2():\n    A=np.array([[2,-1],[0,2]]); B=np.array([[3,1],[1,2]])\n    assert np.array_equal(matmul_loops(A,B), np.array([[5,0],[2,4]]))\ndef test_rect():\n    A=np.array([[1,2,3],[4,5,6]]); B=np.array([[1,0],[0,1],[1,1]])\n    assert np.array_equal(matmul_loops(A,B), np.array([[4,5],[10,11]]))\n"
