- id: c1w3-norms-tf-01
  topic: norms-distances
  type: true-false
  difficulty: 1
  tags:
  - misconception
  prompt:
    vi: Chuẩn $L_1$ có thể âm nếu vector có thành phần âm.
    en: $L_1$ norm can be negative if a vector has negative entries.
  explanation:
    vi: Sai vì dùng trị tuyệt đối.
    en: False because absolute values are used.
  hints: []
  answer: false
  reasons:
  - vi: $L_1$ cộng trị tuyệt đối.
    en: $L_1$ sums absolute values.
  - vi: Thành phần âm giữ dấu âm.
    en: Negative entries keep negative signs.
  reasonAnswer: 0
- id: c1w3-norms-find-error-01
  topic: norms-distances
  type: find-error
  difficulty: 2
  tags:
  - debugging
  prompt:
    vi: Tìm bước sai đầu tiên khi tính $\|(-3,4)\|_2$.
    en: Find first wrong step computing $\|(-3,4)\|_2$.
  explanation:
    vi: Bước đầu sai do $(-3)^2=9$.
    en: First step is wrong because $(-3)^2=9$.
  hints: []
  steps:
  - vi: $\sqrt{-3^2+4^2}$
    en: $\sqrt{-3^2+4^2}$
  - vi: $=\sqrt{-9+16}$
    en: $=\sqrt{-9+16}$
  - vi: $=\sqrt7$
    en: $=\sqrt7$
  answer: 0
