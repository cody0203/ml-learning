- id: c1w3-norms-code-01
  topic: norms-distances
  type: code
  difficulty: 2
  tags:
  - code
  prompt:
    vi: Cài `l1_l2(v)` trả `(L1,L2)`, không dùng `np.linalg.norm`.
    en: Implement `l1_l2(v)` returning `(L1,L2)`, without `np.linalg.norm`.
  explanation:
    vi: Dùng abs, bình phương, tổng, căn.
    en: Use abs, squares, sum, sqrt.
  hints: []
  starter: "import numpy as np\ndef l1_l2(v):\n    return (0,0)\n"
  solution: "import numpy as np\ndef l1_l2(v):\n    v=np.asarray(v,dtype=float)\n    return (float(np.sum(np.abs(v))), float(np.sqrt(np.sum(v*v))))\n"
  tests: "import numpy as np\ndef test_basic():\n    a,b=l1_l2(np.array([3,-4])); assert abs(a-7)<1e-9; assert abs(b-5)<1e-9\ndef test_3d():\n    a,b=l1_l2(np.array([1,-2,2])); assert abs(a-5)<1e-9; assert abs(b-3)<1e-9\n"
