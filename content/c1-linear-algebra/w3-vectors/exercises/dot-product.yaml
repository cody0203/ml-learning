exercises:
- id: c1w3-dot-product-numeric-01
  topic: dot-product
  type: numeric
  difficulty: 1
  tags:
  - dot
  prompt:
    vi: Tính $(2,4,1)\cdot(3,5,2)$.
    en: Compute $(2,4,1)\cdot(3,5,2)$.
  explanation:
    vi: Bằng $6+20+2=28$.
    en: Equals $6+20+2=28$.
  hints: []
  answers:
  - value: 28
  tolerance: 0
