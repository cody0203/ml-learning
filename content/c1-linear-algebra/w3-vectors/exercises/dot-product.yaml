- id: c1w3-dot-product-matching-01
  topic: dot-product
  type: matching
  difficulty: 1
  tags:
  - formula
  prompt:
    vi: Ghép biểu thức với kết quả.
    en: Match expression with result.
  explanation:
    vi: Tính dot và chuẩn qua dot.
    en: Compute dots and norm via dot.
