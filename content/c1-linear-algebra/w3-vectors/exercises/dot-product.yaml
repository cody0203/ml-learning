- id: c1w3-dot-product-code-01
  topic: dot-product
  type: code
  difficulty: 2
  tags:
  - code
  prompt:
    vi: Cài `dot_manual(u,v)` không dùng `np.dot`, `@`, `np.vdot`.
    en: Implement `dot_manual(u,v)` without `np.dot`, `@`, `np.vdot`.
  explanation:
    vi: Nhân từng thành phần rồi cộng.
    en: Multiply components and sum.
  hints: []
  starter: "def dot_manual(u,v):\n    return 0\n"
  solution: "def dot_manual(u,v):\n    total=0\n    for i in range(len(u)):\n        total += u[i]*v[i]\n    return total\n"
  tests: "def test_price():\n    assert dot_manual([2,4,1],[3,5,2])==28\ndef test_ortho():\n    assert dot_manual([6,2],[-1,3])==0\n"
- id: c1w3-dot-product-predict-01
  topic: dot-product
  type: predict-output
  difficulty: 1
  tags:
  - numpy
  prompt:
    vi: Đoán output NumPy của tích vô hướng hai vector ngắn.
    en: Predict the NumPy dot-product output for two short vectors.
  explanation:
    vi: '`u*v` nhân component, `sum` cộng.'
    en: '`u*v` multiplies components, `sum` adds.'
  hints: []
  code: 'import numpy as np

    u=np.array([2,4,1]); v=np.array([3,5,2])

    print(np.sum(u*v))'
  options:
  - '28'
  - '[ 6 20  2]'
  - Error
  answer: 0
