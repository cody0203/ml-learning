exercises:
- id: c1w3-nn-mcq-01
  topic: neural-networks-matrices
  type: mcq
  difficulty: 1
  tags:
  - perceptron
  prompt:
    vi: Với $w=(1,1)$, threshold 1.5, email $(1,0)$ là gìo
    en: With $w=(1,1)$, threshold 1.5, what is email $(1,0)$o
  explanation:
    vi: Score 1 không vượt 1.5.
    en: Score 1 does not exceed 1.5.
  hints: []
  options:
  - vi: Spam
    en: Spam
  - vi: Không spam
    en: Not spam
  - vi: Không tính được
    en: Cannot compute
  answer:
  - 1
- id: c1w3-nn-numeric-01
  topic: neural-networks-matrices
  type: numeric
  difficulty: 1
  tags:
  - perceptron
  prompt:
    vi: Tính $w\cdot x+b$ với $w=(1,1)$, $x=(2,1)$, $b=-1.5$.
    en: Compute $w\cdot x+b$ with $w=(1,1)$, $x=(2,1)$, $b=-1.5$.
  explanation:
    vi: $2+1-1.5=1.5$.
    en: $2+1-1.5=1.5$.
  hints: []
  answers:
  - value: 1.5
  tolerance: 1.0e-09
- id: c1w3-nn-matrix-01
  topic: neural-networks-matrices
  type: matrix
  difficulty: 1
  tags:
  - batch
  prompt:
    vi: Tính $Xw$ với $X=\begin{bmatrix}1&1\\2&1\\0&0\\0&2\end{bmatrix}$, $w=(1,1)$.
    en: Compute $Xw$ for $X=\begin{bmatrix}1&1\\2&1\\0&0\\0&2\end{bmatrix}$, $w=(1,1)$.
  explanation:
    vi: Mỗi hàng lấy tổng hai features.
    en: Each row sums two features.
  hints: []
  answer:
  - - 2
  - - 3
  - - 0
  - - 2
  tolerance: 0
- id: c1w3-nn-predict-01
  topic: neural-networks-matrices
  type: predict-output
  difficulty: 1
  tags:
  - numpy
  prompt:
    vi: Đoán output ma trận của mạng neural hai lớp.
    en: Predict the two-layer neural-network matrix output.
  explanation:
    vi: So sánh từng score với 1.5.
    en: Compare each score with 1.5.
  hints: []
  code: 'import numpy as np

    X=np.array([[1,1],[2,1],[0,0],[0,2]]); w=np.array([1,1])

    print((X@w)>1.5)'
  options:
  - '[ True  True False  True]'
  - '[False  True False  True]'
  - '[2 3 0 2]'
  answer: 0
- id: c1w3-nn-code-01
  topic: neural-networks-matrices
  type: code
  difficulty: 2
  tags:
  - code
  prompt:
    vi: Cài `linear_layer(X,W,b)` trả về `X @ W + b`.
    en: Implement `linear_layer(X,W,b)` returning `X @ W + b`.
  explanation:
    vi: oây là forward pass tuyến tính cho batch.
    en: This is a batch linear forward pass.
  hints: []
  starter: "import numpy as np\ndef linear_layer(X,W,b):\n    return X\n"
  solution: "import numpy as np\ndef linear_layer(X,W,b):\n    return np.asarray(X) @ np.asarray(W) + np.asarray(b)\n"
  tests: "import numpy as np\ndef test_single_output():\n    X=np.array([[1,1],[2,1],[0,0],[0,2]]); W=np.array([[1],[1]]); b=np.array([-1.5])\n    assert np.allclose(linear_layer(X,W,b).ravel(), np.array([0.5,1.5,-1.5,0.5]))\ndef test_two_outputs():\n    X=np.array([[1,2],[3,4]]); W=np.array([[1,0],[0,1]]); b=np.array([10,-10])\n    assert np.array_equal(linear_layer(X,W,b), np.array([[11,-8],[13,-6]]))\n"
- id: c1w3-nn-multi-01
  topic: neural-networks-matrices
  type: multi-step
  difficulty: 2
  tags:
  - and
  prompt:
    vi: Perceptron AND dùng $w=(1,1)$, threshold 1.5.
    en: AND perceptron uses $w=(1,1)$, threshold 1.5.
  explanation:
    vi: Chỉ $(1,1)$ có tổng >1.5.
    en: Only $(1,1)$ has sum >1.5.
  hints: []
  parts:
  - type: numeric
    prompt:
      vi: Score của $(1,0)$o
      en: Score of $(1,0)$o
    answers:
    - value: 1
    tolerance: 0
    explanation:
      vi: $1+0=1$.
      en: $1+0=1$.
  - type: mcq
    prompt:
      vi: Input nào là Yeso
      en: Which input is Yeso
    options:
    - vi: $(0,0)$
      en: $(0,0)$
    - vi: $(1,0)$
      en: $(1,0)$
    - vi: $(0,1)$
      en: $(0,1)$
    - vi: $(1,1)$
      en: $(1,1)$
    answer:
    - 3
    explanation:
      vi: Score 2 > 1.5.
      en: Score 2 > 1.5.
- id: c1w3-nn-matching-01
  topic: neural-networks-matrices
  type: matching
  difficulty: 1
  tags:
  - ml
  prompt:
    vi: Ghép thành phần perceptron.
    en: Match perceptron components.
  explanation:
    vi: Mỗi phần có vai trò tuyến tính.
    en: Each part has a linear role.
  hints: []
  pairs:
  - left:
      vi: $x$
      en: $x$
    right:
      vi: Vector đặc trưng
      en: Feature vector
  - left:
      vi: $w$
      en: $w$
    right:
      vi: Trọng số
      en: Weights
  - left:
      vi: $b$
      en: $b$
    right:
      vi: Bias
      en: Bias
  - left:
      vi: $Xw$
      en: $Xw$
    right:
      vi: Score batch
      en: Batch scores
- id: c1w3-nn-tf-01
  topic: neural-networks-matrices
  type: true-false
  difficulty: 2
  tags:
  - bias
  prompt:
    vi: Thêm cột toàn 1 cho phép biểu diễn bias như trọng số thường.
    en: Adding an all-ones column lets bias be represented as a normal weight.
  explanation:
    vi: Cột 1 nhân trọng số bias cộng cùng hằng số.
    en: The ones column times the bias weight adds a constant.
  hints: []
  answer: true
