exercises:
- id: c1w3-lintrans-mcq-01
  topic: linear-transformations
  type: mcq
  difficulty: 2
  tags:
  - figure
  - unit-square
  prompt:
    vi: Ma trận nào biến hình vuông đơn vị thành các đỉnh $(0,0),(3,1),(1,2),(4,3)$?
    en: Which matrix maps the unit square to vertices $(0,0),(3,1),(1,2),(4,3)$?
  explanation:
    vi: Cột là $Ae_1=(3,1)$ và $Ae_2=(1,2)$.
    en: Columns are $Ae_1=(3,1)$ and $Ae_2=(1,2)$.
  hints: []
  figure:
    xRange:
    - -1
    - 5
    yRange:
    - -1
    - 4
    points:
    - at:
      - 0
      - 0
      label: '0'
    - at:
      - 3
      - 1
      label: Ae1
    - at:
      - 1
      - 2
      label: Ae2
    - at:
      - 4
      - 3
      label: A(1,1)
  options:
  - vi: '$\begin{bmatrix}3&1\\1&2\end{bmatrix}$'
    en: '$\begin{bmatrix}3&1\\1&2\end{bmatrix}$'
  - vi: '$\begin{bmatrix}3&1\\2&1\end{bmatrix}$'
    en: '$\begin{bmatrix}3&1\\2&1\end{bmatrix}$'
  - vi: '$\begin{bmatrix}1&3\\2&1\end{bmatrix}$'
    en: '$\begin{bmatrix}1&3\\2&1\end{bmatrix}$'
  answer:
  - 0
- id: c1w3-lintrans-matrix-01
  topic: linear-transformations
  type: matrix
  difficulty: 1
  tags:
  - transform
  prompt:
    vi: 'Với $A=\begin{bmatrix}3&1\\1&2\end{bmatrix}$, tính $A(-2,3)$.'
    en: 'For $A=\begin{bmatrix}3&1\\1&2\end{bmatrix}$, compute $A(-2,3)$.'
  explanation:
    vi: Kết quả $(-3,4)$.
    en: Result is $(-3,4)$.
  hints: []
  answer:
  - - -3
  - - 4
  tolerance: 0
- id: c1w3-lintrans-construct-01
  topic: linear-transformations
  type: construct
  difficulty: 2
  tags:
  - construct
  prompt:
    vi: Dựng ma trận $A$ sao cho $A(1,2)=(5,4)$.
    en: Construct matrix $A$ such that $A(1,2)=(5,4)$.
  explanation:
    vi: Ví dụ $[[1,2],[2,1]]$.
    en: For example $[[1,2],[2,1]]$.
  hints: []
  rows: 2
  cols: 2
  constraints:
  - kind: mapsTo
    x:
    - 1
    - 2
    b:
    - 5
    - 4
  example:
  - - 1
    - 2
  - - 2
    - 1
- id: c1w3-lintrans-matching-01
  topic: linear-transformations
  type: matching
  difficulty: 1
  tags:
  - basis
  prompt:
    vi: Ghép ý nghĩa cột ma trận.
    en: Match meanings of matrix columns.
  explanation:
    vi: Cột là ảnh của basis vectors.
    en: Columns are images of basis vectors.
  hints: []
  pairs:
  - left:
      vi: Cột 1
      en: Column 1
    right:
      vi: $Ae_1$
      en: $Ae_1$
  - left:
      vi: Cột 2
      en: Column 2
    right:
      vi: $Ae_2$
      en: $Ae_2$
  - left:
      vi: $A(e_1+e_2)$
      en: $A(e_1+e_2)$
    right:
      vi: Tổng hai cột
      en: Sum of two columns
- id: c1w3-lintrans-tf-01
  topic: linear-transformations
  type: true-false
  difficulty: 2
  tags:
  - linearity
  prompt:
    vi: Biến đổi tuyến tính thỏa $T(u+v)=T(u)+T(v)$.
    en: A linear transformation satisfies $T(u+v)=T(u)+T(v)$.
  explanation:
    vi: Đây là tính chất tuyến tính.
    en: This is linearity.
  hints: []
  answer: true
- id: c1w3-lintrans-code-01
  topic: linear-transformations
  type: code
  difficulty: 2
  tags:
  - code
  prompt:
    vi: Cài `transform_points(A,P)`; mỗi hàng của `P` là một điểm, trả `P @ A.T`.
    en: Implement `transform_points(A,P)`; each row of `P` is a point, return `P @ A.T`.
  explanation:
    vi: Với điểm là hàng, nhân bên phải với $A^T$.
    en: With row-points, multiply on the right by $A^T$.
  hints: []
  starter: "import numpy as np\ndef transform_points(A,P):\n    return P\n"
  solution: "import numpy as np\ndef transform_points(A,P):\n    A=np.asarray(A); P=np.asarray(P)\n    return P @ A.T\n"
  tests: "import numpy as np\ndef test_square():\n    A=np.array([[3,1],[1,2]]); P=np.array([[0,0],[1,0],[0,1],[1,1]])\n    assert np.array_equal(transform_points(A,P), np.array([[0,0],[3,1],[1,2],[4,3]]))\ndef test_point():\n    A=np.array([[3,1],[1,2]]); P=np.array([[-2,3]])\n    assert np.array_equal(transform_points(A,P), np.array([[-3,4]]))\n"
- id: c1w3-lintrans-find-error-01
  topic: linear-transformations
  type: find-error
  difficulty: 2
  tags:
  - debugging
  prompt:
    vi: Tìm lỗi khi dựng ma trận từ $e_1\mapsto(3,-1)$, $e_2\mapsto(2,3)$.
    en: Find error building matrix from $e_1\mapsto(3,-1)$, $e_2\mapsto(2,3)$.
  explanation:
    vi: Ảnh basis phải là cột, không phải hàng.
    en: Basis images must be columns, not rows.
  hints: []
  steps:
  - vi: 'Đặt ảnh làm hàng: $A=\begin{bmatrix}3&-1\\2&3\end{bmatrix}$.'
    en: 'Place images as rows: $A=\begin{bmatrix}3&-1\\2&3\end{bmatrix}$.'
  - vi: Khi đó $Ae_1=(3,2)$.
    en: Then $Ae_1=(3,2)$.
  - vi: Kết luận đúng.
    en: Conclude correct.
  answer: 0
