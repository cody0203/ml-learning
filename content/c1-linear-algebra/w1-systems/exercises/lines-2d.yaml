exercises:
- id: c1w1-lines-mcq-01
  topic: lines-2d
  type: mcq
  difficulty: 1
  tags:
  - geometry
  prompt:
    vi: $a+b=10$ và $a+2b=12$ thuộc loại nào?
    en: What type are $a+b=10$ and $a+2b=12$?
  explanation:
    vi: Chúng cắt tại $(8,2)$.
    en: They intersect at $(8,2)$.
  hints: []
  options:
  - vi: Song song
    en: Parallel
  - vi: Trùng
    en: Coincident
  - vi: Cắt nhau
    en: Intersecting
  answer:
  - 2
  figure:
    lines:
    - a: 1
      b: 1
      c: 10
    - a: 1
      b: 2
      c: 12
    points:
    - at:
      - 8
      - 2
      label: (8,2)
- id: c1w1-lines-tf-02
  topic: lines-2d
  type: true-false
  difficulty: 1
  tags:
  - linear
  prompt:
    vi: $a^2+b=10$ là tuyến tính.
    en: $a^2+b=10$ is linear.
  explanation:
    vi: Sai vì có bình phương biến.
    en: False because a variable is squared.
  hints: []
  answer: false
  reasons:
  - vi: Có $a^2$.
    en: It contains $a^2$.
  - vi: Có dấu bằng.
    en: It has equals sign.
  reasonAnswer: 0
- id: c1w1-lines-num-03
  topic: lines-2d
  type: numeric
  difficulty: 1
  tags:
  - intercept
  prompt:
    vi: Tung độ gốc của $3a+2b=12$?
    en: Vertical intercept of $3a+2b=12$?
  explanation:
    vi: Đặt $a=0$, $b=6$.
    en: Set $a=0$, $b=6$.
  hints: []
  answers:
  - value: 6
- id: c1w1-lines-matrix-04
  topic: lines-2d
  type: matrix
  difficulty: 2
  tags:
  - intersection
  prompt:
    vi: Giao điểm của $3a+2b=8$, $2a-b=3$?
    en: Intersection of $3a+2b=8$, $2a-b=3$?
  explanation:
    vi: Từ $b=2a-3$, suy ra $a=2,b=1$.
    en: From $b=2a-3$, get $a=2,b=1$.
  hints: []
  answer:
  - - 2
  - - 1
  figure:
    lines:
    - a: 3
      b: 2
      c: 8
    - a: 2
      b: -1
      c: 3
    points:
    - at:
      - 2
      - 1
      label: (2,1)
- id: c1w1-lines-construct-05
  topic: lines-2d
  type: construct
  difficulty: 2
  tags:
  - construct
  prompt:
    vi: Tạo ma trận 2×2 để với $b=[5,10]^T$ hệ có vô số nghiệm.
    en: Construct a 2×2 matrix so with $b=[5,10]^T$ the system has infinitely many solutions.
  explanation:
    vi: Hàng 2 và vế phải là 2 lần hàng 1.
    en: Row 2 and right side are twice row 1.
  hints: []
  rows: 2
  cols: 2
  constraints:
  - kind: infiniteSolutionsWith
    b:
    - 5
    - 10
  - kind: integerEntries
  - kind: noZeroEntries
  example:
  - - 1
    - 4
  - - 2
    - 8
- id: c1w1-lines-error-06
  topic: lines-2d
  type: find-error
  difficulty: 2
  tags:
  - parallel
  prompt:
    vi: Tìm bước sai với $a+b=10$, $2a+2b=24$.
    en: Find the wrong step for $a+b=10$, $2a+2b=24$.
  explanation:
    vi: Hai đường có cùng độ dốc nên song song, không cắt.
    en: The lines have the same slope, so they are parallel, not intersecting.
  hints: []
  steps:
  - vi: $b=-a+10$.
    en: $b=-a+10$.
  - vi: $b=-a+12$.
    en: $b=-a+12$.
  - vi: Khác tung độ gốc nên cắt nhau.
    en: Different intercepts mean they intersect.
  answer: 2
- id: c1w1-lines-param-07
  topic: lines-2d
  type: parametric
  difficulty: 1
  tags:
  - drill
  prompt:
    vi: 'Bài luyện: phân loại hệ hai đường.'
    en: 'Drill: classify a two-line system.'
  explanation:
    vi: Dựa vào determinant/tỉ lệ hàng.
    en: Use determinant/row ratios.
  hints: []
  generator: classify-system
