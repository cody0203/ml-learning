exercises:
- id: c1w1-det2-num-01
  topic: determinant-2x2
  type: numeric
  difficulty: 1
  tags:
  - determinant
  prompt:
    vi: Tính $\det\begin{bmatrix}5&1\\-1&3\end{bmatrix}$.
    en: Compute $\det\begin{bmatrix}5&1\\-1&3\end{bmatrix}$.
  explanation:
    vi: $15-(-1)=16$.
    en: $15-(-1)=16$.
  hints: []
  answers:
  - value: 16
- id: c1w1-det2-mcq-02
  topic: determinant-2x2
  type: mcq
  difficulty: 1
  tags:
  - singular
  prompt:
    vi: $\begin{bmatrix}2&-1\\-6&3\end{bmatrix}$ là gì?
    en: What is $\begin{bmatrix}2&-1\\-6&3\end{bmatrix}$?
  explanation:
    vi: Det $=6-6=0$ nên singular.
    en: Det $=6-6=0$, so singular.
  hints: []
  options:
  - vi: Non-singular
    en: Non-singular
  - vi: Singular vì det=0
    en: Singular because det=0
  answer:
  - 1
- id: c1w1-det2-tf-03
  topic: determinant-2x2
  type: true-false
  difficulty: 2
  tags:
  - formula
  prompt:
    vi: Với $[[a,b],[c,d]]$, determinant là $ab-cd$.
    en: For $[[a,b],[c,d]]$, determinant is $ab-cd$.
  explanation:
    vi: 'Sai: đúng là $ad-bc$.'
    en: 'False: it is $ad-bc$.'
  hints: []
  answer: false
  reasons:
  - vi: Đường chéo chính trừ phụ.
    en: Main diagonal minus off diagonal.
  - vi: Nhân theo hàng.
    en: Multiply by rows.
  reasonAnswer: 0
- id: c1w1-det2-construct-04
  topic: determinant-2x2
  type: construct
  difficulty: 2
  tags:
  - construct
  prompt:
    vi: Tạo ma trận 2×2 nguyên, không số 0, det=5.
    en: Construct a 2×2 integer matrix with no zeros and det=5.
  explanation:
    vi: $[[1,1],[1,6]]$ có det 5.
    en: $[[1,1],[1,6]]$ has det 5.
  hints: []
  rows: 2
  cols: 2
  constraints:
  - kind: det
    value: 5
  - kind: integerEntries
  - kind: noZeroEntries
  example:
  - - 1
    - 1
  - - 1
    - 6
- id: c1w1-det2-error-05
  topic: determinant-2x2
  type: find-error
  difficulty: 2
  tags:
  - signs
  prompt:
    vi: Tìm bước sai khi tính det $[[2,-1],[-6,3]]$.
    en: Find the wrong step computing det $[[2,-1],[-6,3]]$.
  explanation:
    vi: $(-1)(-6)=+6$, nên $6-6=0$.
    en: $(-1)(-6)=+6$, so $6-6=0$.
  hints: []
  steps:
  - vi: Dùng $ad-bc$.
    en: Use $ad-bc$.
  - vi: $2\cdot3-(-1)(-6)=6-(-6)$.
    en: $2\cdot3-(-1)(-6)=6-(-6)$.
  - vi: Det = 12.
    en: Det = 12.
  answer: 1
- id: c1w1-det2-code-06
  topic: determinant-2x2
  type: code
  difficulty: 2
  tags:
  - code
  prompt:
    vi: Cài `det2(A)` bằng tay, không dùng `np.linalg.det`.
    en: Implement `det2(A)` by hand, no `np.linalg.det`.
  explanation:
    vi: Dùng $A00*A11-A01*A10$.
    en: Use $A00*A11-A01*A10$.
  hints: []
  starter: "def det2(A):\n    return 0"
  solution: "def det2(A):\n    return A[0][0]*A[1][1]-A[0][1]*A[1][0]"
  tests: "def test_det2():\n    assert det2([[5,1],[-1,3]])==16\n    assert det2([[2,-1],[-6,3]])==0\n    assert det2([[4,7],[2,6]])==10"
- id: c1w1-det2-param-07
  topic: determinant-2x2
  type: parametric
  difficulty: 1
  tags:
  - drill
  prompt:
    vi: 'Bài luyện: determinant 2×2.'
    en: 'Drill: 2×2 determinant.'
  explanation:
    vi: Dùng $ad-bc$.
    en: Use $ad-bc$.
  hints: []
  generator: determinant
  params:
    size: 2
