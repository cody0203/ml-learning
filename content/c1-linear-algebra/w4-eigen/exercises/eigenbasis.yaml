- id: c1w4-08-find-error
  topic: eigenbasis
  type: find-error
  difficulty: 2
  tags:
  - misconception
  prompt:
    vi: 'Cơ sở riêng: tìm bước sai đầu tiên trong lời giải.'
    en: Find the first error in the solution about Eigenbasis.
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: The flawed determinant line would not justify an eigenbasis; diagonalization requires independent eigenvectors.
