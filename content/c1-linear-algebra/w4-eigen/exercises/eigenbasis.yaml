- id: c1w4-08-mcq-fig
  topic: eigenbasis
  type: mcq
  difficulty: 1
  tags:
  - figure
  - concept
  prompt:
    vi: 'Cơ sở riêng: chọn đáp án đúng dựa trên dữ kiện, hình vẽ hoặc tính chất đã học.'
    en: 'Eigenbasis: what is the area of the parallelogram from columns $(3,1)$ and $(1,2)$?'
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: The nonzero area tells us these two candidate eigen-directions could form a basis if each is truly an eigenvector.
  hints: []
  figure:
    xRange:
    - -1
    - 5
    yRange:
    - -1
    - 4
    vectors:
    - to:
      - 3
      - 1
      label: Ae1
      color: '#2563eb'
    - to:
      - 1
      - 2
      label: Ae2
      color: '#16a34a'
    - from:
      - 3
      - 1
      to:
      - 4
      - 3
      color: '#16a34a'
    - from:
      - 1
      - 2
      to:
      - 4
      - 3
      color: '#2563eb'
  options:
  - vi: '5'
    en: '5'
  - vi: '0'
    en: '0'
  - vi: -5 as geometric area
    en: -5 as geometric area
  answer:
  - 0
- id: c1w4-08-tf
  topic: eigenbasis
  type: true-false
  difficulty: 1
  tags:
  - concept
  prompt:
    vi: 'Cơ sở riêng: quyết định mệnh đề đúng hay sai và chọn lý do phù hợp nếu có.'
    en: 'Eigenbasis: determinant zero always signals loss of at least one independent direction for a square matrix.'
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: A zero determinant would prevent a full 2D eigenbasis because the column directions would be dependent.
  hints: []
  answer: true
  reasons:
  - vi: Các hướng ứng viên không đủ độc lập để làm trục eigenbasis đầy đủ.
    en: The candidate directions are not independent enough for a full eigenbasis.
  - vi: Eigenbasis luôn tồn tại dù các vector riêng song song.
    en: An eigenbasis always exists even when the eigenvectors are parallel.
  reasonAnswer: 0
