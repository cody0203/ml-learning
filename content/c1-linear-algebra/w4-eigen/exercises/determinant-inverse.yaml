- id: c1w4-05-mcq-fig
  topic: determinant-inverse
  type: mcq
  difficulty: 1
  tags:
  - figure
  - concept
  prompt:
    vi: 'Định thức của ma trận nghịch đảo: chọn đáp án đúng dựa trên dữ kiện, hình vẽ hoặc tính chất đã học.'
    en: 'Determinant of the inverse: what is the area of the parallelogram from columns $(3,1)$ and $(1,2)$?'
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: A determinant of 5 means the inverse, if built, must later shrink area by a factor of one fifth.
  hints: []
  figure:
    xRange:
    - -1
    - 5
    yRange:
    - -1
    - 4
    vectors:
    - to:
      - 3
      - 1
      label: Ae1
      color: '#2563eb'
    - to:
      - 1
      - 2
      label: Ae2
      color: '#16a34a'
    - from:
      - 3
      - 1
      to:
      - 4
      - 3
      color: '#16a34a'
    - from:
      - 1
      - 2
      to:
      - 4
      - 3
      color: '#2563eb'
  options:
  - vi: '5'
    en: '5'
  - vi: '0'
    en: '0'
  - vi: -5 as geometric area
    en: -5 as geometric area
  answer:
  - 0
- id: c1w4-05-tf
  topic: determinant-inverse
  type: true-false
  difficulty: 1
  tags:
  - concept
  prompt:
    vi: 'Định thức của ma trận nghịch đảo: quyết định mệnh đề đúng hay sai và chọn lý do phù hợp nếu có.'
    en: 'Determinant of the inverse: determinant zero always signals loss of at least one independent direction for a square matrix.'
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: A determinant of zero blocks the inverse because the lost area cannot be expanded back to a plane.
  hints: []
  answer: true
  reasons:
  - vi: Không thể lấy reciprocal của determinant bằng 0 để tạo inverse.
    en: You cannot take the reciprocal of a zero determinant to form an inverse.
  - vi: Determinant bằng 0 làm inverse có determinant bằng 1.
    en: A zero determinant makes the inverse determinant equal to 1.
  reasonAnswer: 0
