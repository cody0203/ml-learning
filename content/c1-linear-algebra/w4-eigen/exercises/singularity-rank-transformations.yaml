- id: c1w4-02-find-error
  topic: singularity-rank-transformations
  type: find-error
  difficulty: 2
  tags:
  - misconception
  prompt:
    vi: 'Suy biến và hạng của phép biến đổi tuyến tính: tìm bước sai đầu tiên trong lời giải.'
    en: Find the first error in the solution about Singularity and rank of linear transformations.
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: The faulty step would misclassify rank because determinant has no general addition law for $A+B$.
  hints:
  - vi: 'Bắt đầu từ định nghĩa: determinant, rank, span hoặc phương trình eigenvector phù hợp với bài.'
    en: Start from the relevant definition.
  steps:
  - vi: Know $\det(A)=1$ and $\det(B)=1$.
    en: Know $\det(A)=1$ and $\det(B)=1$.
  - vi: Suy ra $\det(A+B)=2$.
    en: Infer $\det(A+B)=2$.
  - vi: Conclude $A+B$ is non-singular.
    en: Conclude $A+B$ is non-singular.
