- id: c1w4-02-tf
  topic: singularity-rank-transformations
  type: true-false
  difficulty: 1
  tags:
  - concept
  prompt:
    vi: 'Suy biến và hạng của phép biến đổi tuyến tính: quyết định mệnh đề đúng hay sai và chọn lý do phù hợp nếu có.'
    en: 'Singularity and rank of linear transformations: determinant zero always signals loss of at least one independent direction for a square matrix.'
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: For a square linear map, determinant zero means the image has smaller dimension than the input space.
  hints: []
  answer: true
  reasons:
  - vi: Ảnh của phép biến đổi có dimension nhỏ hơn 2.
    en: The transformation image has dimension less than 2.
  - vi: Hình vuông đơn vị chắc chắn giữ nguyên diện tích.
    en: The unit square must keep exactly the same area.
  reasonAnswer: 0
