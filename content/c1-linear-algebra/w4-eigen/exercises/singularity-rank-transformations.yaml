    en: 'Singularity and rank of linear transformations: what is the area of the parallelogram from columns $(3,1)$ and $(1,2)$?'
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: A nonzero area of 5 shows the transformation keeps two independent output directions, so the rank is 2.
