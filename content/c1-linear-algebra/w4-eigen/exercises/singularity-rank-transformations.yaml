- id: c1w4-02-multi
  topic: singularity-rank-transformations
  type: multi-step
  difficulty: 2
  tags:
  - worked
  prompt:
    vi: 'Suy biến và hạng của phép biến đổi tuyến tính: giải từng phần theo thứ tự; kết quả trước giúp kiểm tra phần sau.'
    en: 'Multi-step task for Singularity and rank of linear transformations: $A=[[2,1],[0,3]]$.'
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: The matrix sends two independent axes to nonzero directions because the triangular determinant is 6, so it is rank 2.
  hints:
  - vi: 'Bắt đầu từ định nghĩa: determinant, rank, span hoặc phương trình eigenvector phù hợp với bài.'
    en: Start from the relevant definition.
  parts:
  - type: numeric
    prompt:
      vi: Compute determinant.
      en: Compute determinant.
    answers:
    - value: 6
    tolerance: 0
    explanation:
      vi: $2\cdot3-1\cdot0=6$.
      en: $2\cdot3-1\cdot0=6$.
  - type: mcq
    prompt:
      vi: What are the eigenvalues?
      en: What are the eigenvalues?
    options:
    - vi: $2,3$
      en: $2,3$
    - vi: $1,0$
      en: $1,0$
    - vi: $6,0$
      en: $6,0$
    answer:
    - 0
    explanation:
      vi: 'Triangular matrix: eigenvalues are diagonal entries.'
      en: 'Triangular matrix: eigenvalues are diagonal entries.'
- id: c1w4-parsons-01
  topic: singularity-rank-transformations
  type: parsons
  difficulty: 2
  tags:
  - procedure
  prompt:
    vi: 'Suy biến và hạng của phép biến đổi tuyến tính: sắp xếp các bước theo đúng quy trình.'
    en: Order the steps that connect rank loss to eigenvector computation.
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: For this rank topic, the ordered steps show that eigenvectors come from the null space after each eigenvalue is found.
  hints:
  - vi: 'Bắt đầu từ định nghĩa: determinant, rank, span hoặc phương trình eigenvector phù hợp với bài.'
    en: Start from the relevant definition.
  steps:
  - vi: Compute $A-\lambda I$.
    en: Compute $A-\lambda I$.
  - vi: Solve $\det(A-\lambda I)=0$.
    en: Solve $\det(A-\lambda I)=0$.
  - vi: For each $\lambda$, solve $(A-\lambda I)v=0$.
    en: For each $\lambda$, solve $(A-\lambda I)v=0$.
  - vi: Choose a nonzero vector.
    en: Choose a nonzero vector.
