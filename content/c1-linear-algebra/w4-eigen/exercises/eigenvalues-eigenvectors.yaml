    - to:
      - 3
      - 1
      label: Ae1
      color: '#2563eb'
    - to:
      - 1
      - 2
      label: Ae2
      color: '#16a34a'
    - from:
      - 3
      - 1
      to:
      - 4
      - 3
      color: '#16a34a'
    - from:
      - 1
      - 2
      to:
      - 4
      - 3
      color: '#2563eb'
