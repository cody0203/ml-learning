  - 0
- id: c1w4-09-tf
  topic: eigenvalues-eigenvectors
  type: true-false
  difficulty: 1
  tags:
  - concept
  prompt:
    vi: 'Trị riêng và vector riêng: quyết định mệnh đề đúng hay sai và chọn lý do phù hợp nếu có.'
    en: 'Eigenvalues and eigenvectors: determinant zero always signals loss of at least one independent direction for a square matrix.'
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: A determinant of zero would make 0 an eigenvalue for a square matrix, signaling a collapsed direction.
  hints: []
  answer: true
  reasons:
  - vi: Số 0 là một eigenvalue nên có hướng bị gửi về gốc.
    en: Zero is an eigenvalue, so some direction is sent to the origin.
  - vi: Không có eigenvalue nào có thể bằng 0.
    en: No eigenvalue can be zero.
  reasonAnswer: 0
