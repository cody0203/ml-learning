- id: c1w4-09-find-error
  topic: eigenvalues-eigenvectors
  type: find-error
  difficulty: 2
  tags:
  - misconception
  prompt:
    vi: 'Trị riêng và vector riêng: tìm bước sai đầu tiên trong lời giải.'
    en: Find the first error in the solution about Eigenvalues and eigenvectors.
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: The wrong determinant rule would lead to false eigenvalues; eigenvalues come from $\det(A-\lambda I)$.
  hints:
  - vi: 'Bắt đầu từ định nghĩa: determinant, rank, span hoặc phương trình eigenvector phù hợp với bài.'
    en: Start from the relevant definition.
  steps:
  - vi: Know $\det(A)=1$ and $\det(B)=1$.
    en: Know $\det(A)=1$ and $\det(B)=1$.
  - vi: Suy ra $\det(A+B)=2$.
    en: Infer $\det(A+B)=2$.
  - vi: Conclude $A+B$ is non-singular.
    en: Conclude $A+B$ is non-singular.
  answer: 1
- id: c1w4-09-multi
  topic: eigenvalues-eigenvectors
  type: multi-step
  difficulty: 2
  tags:
  - worked
  prompt:
    vi: 'Trị riêng và vector riêng: giải từng phần theo thứ tự; kết quả trước giúp kiểm tra phần sau.'
    en: 'Multi-step task for Eigenvalues and eigenvectors: $A=[[2,1],[0,3]]$.'
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: For $[[2,1],[0,3]]$, the eigenvalues are 2 and 3 and their product matches the determinant 6.
  hints:
  - vi: 'Bắt đầu từ định nghĩa: determinant, rank, span hoặc phương trình eigenvector phù hợp với bài.'
    en: Start from the relevant definition.
  parts:
  - type: numeric
    prompt:
      vi: Compute determinant.
      en: Compute determinant.
    answers:
    - value: 6
    tolerance: 0
    explanation:
      vi: $2\cdot3-1\cdot0=6$.
      en: $2\cdot3-1\cdot0=6$.
  - type: mcq
    prompt:
      vi: What are the eigenvalues?
      en: What are the eigenvalues?
    options:
    - vi: $2,3$
      en: $2,3$
    - vi: $1,0$
      en: $1,0$
    - vi: $6,0$
      en: $6,0$
    answer:
    - 0
    explanation:
      vi: 'Triangular matrix: eigenvalues are diagonal entries.'
      en: 'Triangular matrix: eigenvalues are diagonal entries.'
- id: c1w4-eig-code-charpoly-01
  topic: eigenvalues-eigenvectors
  type: code
  difficulty: 2
  tags:
  - code
  - characteristic-polynomial
  prompt:
    vi: 'Trị riêng và vector riêng: hoàn thành hàm Python/NumPy theo yêu cầu và tránh shortcut bị cấm.'
    en: Implement `charpoly2(A)` returning `(trace, det)` for $\lambda^2-trace\lambda+det$; do not use eig.
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: For 2×2, trace and determinant determine the characteristic polynomial.
  hints:
  - vi: 'Bắt đầu từ định nghĩa: determinant, rank, span hoặc phương trình eigenvector phù hợp với bài.'
    en: Start from the relevant definition.
  starter: "def charpoly2(A):\n    return (0,0)\n"
  solution: "def charpoly2(A):\n    tr=A[0][0]+A[1][1]\n    det=A[0][0]*A[1][1]-A[0][1]*A[1][0]\n    return (tr,det)\n"
  tests: "def test_triangular():\n    assert charpoly2([[2,1],[0,3]]) == (5,6)\ndef test_quiz():\n    assert charpoly2([[9,4],[4,3]]) == (12,11)\n"
- id: c1w4-parsons-04
  topic: eigenvalues-eigenvectors
  type: parsons
  difficulty: 2
  tags:
  - procedure
  prompt:
    vi: 'Trị riêng và vector riêng: sắp xếp các bước theo đúng quy trình.'
    en: Order the standard workflow for extracting eigenvalues and eigenvectors.
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: 'This is the standard eigenvector workflow: roots first, then a nonzero vector in each null space.'
  hints:
  - vi: 'Bắt đầu từ định nghĩa: determinant, rank, span hoặc phương trình eigenvector phù hợp với bài.'
    en: Start from the relevant definition.
  steps:
  - vi: Compute $A-\lambda I$.
    en: Compute $A-\lambda I$.
  - vi: Solve $\det(A-\lambda I)=0$.
    en: Solve $\det(A-\lambda I)=0$.
  - vi: For each $\lambda$, solve $(A-\lambda I)v=0$.
    en: For each $\lambda$, solve $(A-\lambda I)v=0$.
  - vi: Choose a nonzero vector.
    en: Choose a nonzero vector.
