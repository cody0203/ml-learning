    en: 'Eigenvalues and eigenvectors: what is the area of the parallelogram from columns $(3,1)$ and $(1,2)$?'
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: This nonzero determinant means the column directions are not eigenvalue-zero collapse directions.
  hints: []
