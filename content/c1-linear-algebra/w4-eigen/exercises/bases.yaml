- id: c1w4-06-find-error
  topic: bases
  type: find-error
  difficulty: 2
  tags:
  - misconception
  prompt:
    vi: 'Cơ sở: tìm bước sai đầu tiên trong lời giải.'
    en: Find the first error in the solution about Bases.
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: The determinant mistake would make a false basis test; a column set must be checked as one matrix.
  hints:
  - vi: 'Bắt đầu từ định nghĩa: determinant, rank, span hoặc phương trình eigenvector phù hợp với bài.'
    en: Start from the relevant definition.
  steps:
  - vi: Know $\det(A)=1$ and $\det(B)=1$.
    en: Know $\det(A)=1$ and $\det(B)=1$.
  - vi: Suy ra $\det(A+B)=2$.
    en: Infer $\det(A+B)=2$.
  - vi: Conclude $A+B$ is non-singular.
    en: Conclude $A+B$ is non-singular.
  answer: 1
- id: c1w4-06-multi
  topic: bases
  type: multi-step
  difficulty: 2
  tags:
  - worked
  prompt:
    vi: 'Cơ sở: giải từng phần theo thứ tự; kết quả trước giúp kiểm tra phần sau.'
    en: 'Multi-step task for Bases: $A=[[2,1],[0,3]]$.'
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: The determinant 6 is nonzero, so the columns of this triangular matrix form a basis of $\mathbb R^2$.
  hints:
  - vi: 'Bắt đầu từ định nghĩa: determinant, rank, span hoặc phương trình eigenvector phù hợp với bài.'
    en: Start from the relevant definition.
  parts:
  - type: numeric
    prompt:
      vi: Compute determinant.
      en: Compute determinant.
    answers:
    - value: 6
    tolerance: 0
    explanation:
      vi: $2\cdot3-1\cdot0=6$.
      en: $2\cdot3-1\cdot0=6$.
  - type: mcq
    prompt:
      vi: What are the eigenvalues?
      en: What are the eigenvalues?
    options:
    - vi: $2,3$
      en: $2,3$
    - vi: $1,0$
      en: $1,0$
    - vi: $6,0$
      en: $6,0$
    answer:
    - 0
    explanation:
      vi: 'Triangular matrix: eigenvalues are diagonal entries.'
      en: 'Triangular matrix: eigenvalues are diagonal entries.'
