exercises:
- id: c1w4-06-mcq-fig
  topic: bases
  type: mcq
  difficulty: 1
  tags:
  - figure
  - concept
  prompt:
    vi: 'Cơ sở: chọn đáp án đúng dựa trên dữ kiện, hình vẽ hoặc tính chất đã học.'
    en: 'Bases: what is the area of the parallelogram from columns $(3,1)$ and $(1,2)$?'
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: The nonzero determinant 5 shows the two displayed column vectors can serve as a coordinate basis for the plane.
  hints: []
  figure:
    xRange:
    - -1
    - 5
    yRange:
    - -1
    - 4
    vectors:
    - to:
      - 3
      - 1
      label: Ae1
      color: '#2563eb'
    - to:
      - 1
      - 2
      label: Ae2
      color: '#16a34a'
    - from:
      - 3
      - 1
      to:
      - 4
      - 3
      color: '#16a34a'
    - from:
      - 1
      - 2
      to:
      - 4
      - 3
      color: '#2563eb'
  options:
  - vi: '5'
    en: '5'
  - vi: '0'
    en: '0'
  - vi: -5 as geometric area
    en: -5 as geometric area
  answer:
  - 0
- id: c1w4-06-tf
  topic: bases
  type: true-false
  difficulty: 1
  tags:
  - concept
  prompt:
    vi: 'Cơ sở: quyết định mệnh đề đúng hay sai và chọn lý do phù hợp nếu có.'
    en: 'Bases: determinant zero always signals loss of at least one independent direction for a square matrix.'
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: In a basis test, determinant zero means the proposed columns fail to be independent.
  hints: []
  answer: true
  reasons:
  - vi: Hai cột phụ thuộc tuyến tính nên không tạo basis của mặt phẳng.
    en: The two columns are linearly dependent, so they do not form a basis of the plane.
  - vi: Chỉ cần có hai vector là tự động thành basis.
    en: Having two vectors automatically makes a basis.
  reasonAnswer: 0
- id: c1w4-06-numeric
  topic: bases
  type: numeric
  difficulty: 1
