  prompt:
    vi: 'Cơ sở: tính giá trị số được yêu cầu; chú ý determinant, rank hoặc eigenvalue.'
    en: 'Bases: compute $det([[1,3],[2,1]])$.'
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: The determinant is $-5$, so these two columns would still form a basis despite reversing orientation.
  hints: []
  answers:
  - value: -5
  tolerance: 0
