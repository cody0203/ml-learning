exercises:
- id: c1w4-07-mcq-fig
  topic: span
  type: mcq
  difficulty: 1
  tags:
  - figure
  - concept
  prompt:
    vi: 'Bao tuyến tính: chọn đáp án đúng dựa trên dữ kiện, hình vẽ hoặc tính chất đã học.'
    en: 'Span: what is the area of the parallelogram from columns $(3,1)$ and $(1,2)$?'
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: Because the two column vectors enclose area 5, their span is the whole plane rather than a single line.
  hints: []
  figure:
    xRange:
    - -1
    - 5
    yRange:
    - -1
    - 4
    vectors:
    - to:
      - 3
      - 1
      label: Ae1
      color: '#2563eb'
    - to:
      - 1
      - 2
      label: Ae2
      color: '#16a34a'
    - from:
      - 3
      - 1
      to:
      - 4
      - 3
      color: '#16a34a'
    - from:
      - 1
      - 2
      to:
      - 4
      - 3
      color: '#2563eb'
  options:
  - vi: '5'
    en: '5'
  - vi: '0'
    en: '0'
  - vi: -5 as geometric area
    en: -5 as geometric area
  answer:
  - 0
- id: c1w4-07-tf
  topic: span
  type: true-false
  difficulty: 1
  tags:
  - concept
  prompt:
    vi: 'Bao tuyến tính: quyết định mệnh đề đúng hay sai và chọn lý do phù hợp nếu có.'
    en: 'Span: determinant zero always signals loss of at least one independent direction for a square matrix.'
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: When determinant is zero, the column span has lower dimension, so at least one direction is missing.
  hints: []
  answer: true
  reasons:
  - vi: Column span bị thu xuống một đường hoặc một điểm.
    en: The column span shrinks to a line or a point.
  - vi: Span của các cột vẫn chắc chắn là toàn bộ mặt phẳng.
    en: The column span is still guaranteed to be the whole plane.
  reasonAnswer: 0
