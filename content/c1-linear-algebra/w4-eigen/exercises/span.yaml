- id: c1w4-07-find-error
  topic: span
  type: find-error
  difficulty: 2
  tags:
  - misconception
  prompt:
    vi: 'Bao tuyến tính: tìm bước sai đầu tiên trong lời giải.'
    en: Find the first error in the solution about Span.
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: Adding determinants says nothing about the actual span of the columns in $A+B$.
  hints:
  - vi: 'Bắt đầu từ định nghĩa: determinant, rank, span hoặc phương trình eigenvector phù hợp với bài.'
    en: Start from the relevant definition.
  steps:
  - vi: Know $\det(A)=1$ and $\det(B)=1$.
    en: Know $\det(A)=1$ and $\det(B)=1$.
  - vi: Suy ra $\det(A+B)=2$.
    en: Infer $\det(A+B)=2$.
  - vi: Conclude $A+B$ is non-singular.
    en: Conclude $A+B$ is non-singular.
  answer: 1
- id: c1w4-07-multi
  topic: span
  type: multi-step
  difficulty: 2
  tags:
  - worked
  prompt:
    vi: 'Bao tuyến tính: giải từng phần theo thứ tự; kết quả trước giúp kiểm tra phần sau.'
    en: 'Multi-step task for Span: $A=[[2,1],[0,3]]$.'
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: Since the determinant is 6, the columns span the full plane and the eigenvalues are the diagonal entries.
  hints:
  - vi: 'Bắt đầu từ định nghĩa: determinant, rank, span hoặc phương trình eigenvector phù hợp với bài.'
    en: Start from the relevant definition.
  parts:
  - type: numeric
    prompt:
      vi: Compute determinant.
      en: Compute determinant.
    answers:
    - value: 6
    tolerance: 0
    explanation:
      vi: $2\cdot3-1\cdot0=6$.
      en: $2\cdot3-1\cdot0=6$.
  - type: mcq
    prompt:
      vi: What are the eigenvalues?
      en: What are the eigenvalues?
    options:
    - vi: $2,3$
      en: $2,3$
    - vi: $1,0$
      en: $1,0$
    - vi: $6,0$
      en: $6,0$
    answer:
    - 0
    explanation:
      vi: 'Triangular matrix: eigenvalues are diagonal entries.'
      en: 'Triangular matrix: eigenvalues are diagonal entries.'
- id: c1w4-span-code-01
  topic: span
  type: code
  difficulty: 2
  tags:
  - code
  - span
  prompt:
    vi: 'Bao tuyến tính: hoàn thành hàm Python/NumPy theo yêu cầu và tránh shortcut bị cấm.'
    en: Implement `in_span_one(v,w)` returning True if `w` lies in the span of nonzero 2D vector `v`.
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: Two 2D vectors are in the same one-vector span when their determinant is 0.
  hints:
  - vi: 'Bắt đầu từ định nghĩa: determinant, rank, span hoặc phương trình eigenvector phù hợp với bài.'
    en: Start from the relevant definition.
  starter: "def in_span_one(v,w):\n    return True\n"
  solution: "def in_span_one(v,w):\n    return abs(v[0]*w[1]-v[1]*w[0]) < 1e-9\n"
  tests: "def test_yes():\n    assert in_span_one([1,2],[3,6])\ndef test_no():\n    assert not in_span_one([1,2],[2,3])\n"
