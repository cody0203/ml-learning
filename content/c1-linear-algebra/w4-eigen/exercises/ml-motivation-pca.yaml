- id: c1w4-01-mcq-fig
  topic: ml-motivation-pca
  type: mcq
  difficulty: 1
  tags:
  - figure
  - concept
  prompt:
    vi: 'Động lực ML: PCA: chọn đáp án đúng dựa trên dữ kiện, hình vẽ hoặc tính chất đã học.'
    en: 'ML motivation: PCA: what is the area of the parallelogram from columns $(3,1)$ and $(1,2)$?'
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: The two slide columns would preserve a 5-unit area, which is why PCA can treat them as two independent directions rather than a collapsed axis.
  hints: []
  figure:
    xRange:
    - -1
    - 5
    yRange:
    - -1
    - 4
    vectors:
    - to:
      - 3
      - 1
      label: Ae1
      color: '#2563eb'
    - to:
      - 1
      - 2
      label: Ae2
      color: '#16a34a'
    - from:
      - 3
      - 1
      to:
      - 4
      - 3
      color: '#16a34a'
    - from:
      - 1
      - 2
      to:
      - 4
      - 3
      color: '#2563eb'
  options:
  - vi: '5'
    en: '5'
  - vi: '0'
    en: '0'
  - vi: -5 as geometric area
    en: -5 as geometric area
  answer:
  - 0
- id: c1w4-01-tf
  topic: ml-motivation-pca
  type: true-false
  difficulty: 1
  tags:
  - concept
  prompt:
    vi: 'Động lực ML: PCA: quyết định mệnh đề đúng hay sai và chọn lý do phù hợp nếu có.'
    en: 'ML motivation: PCA: determinant zero always signals loss of at least one independent direction for a square matrix.'
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: In this PCA context, determinant zero would mean one feature direction is redundant, so the square matrix cannot represent two independent axes.
  hints: []
  answer: true
  reasons:
  - vi: Covariance có một hướng variance bằng 0.
    en: A covariance matrix has one direction with zero variance.
  - vi: PCA vẫn giữ được đủ hai principal components mạnh.
    en: PCA can still keep two strong principal components.
  reasonAnswer: 0
