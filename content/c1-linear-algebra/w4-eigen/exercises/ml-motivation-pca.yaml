- id: c1w4-01-find-error
  topic: ml-motivation-pca
  type: find-error
  difficulty: 2
  tags:
  - misconception
  prompt:
    vi: 'Động lực ML: PCA: tìm bước sai đầu tiên trong lời giải.'
    en: 'Find the first error in the solution about ML motivation: PCA.'
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: The second step invents an additive determinant rule; PCA covariance matrices must be analyzed by eigenvalues, not by adding determinants.
  hints:
  - vi: 'Bắt đầu từ định nghĩa: determinant, rank, span hoặc phương trình eigenvector phù hợp với bài.'
    en: Start from the relevant definition.
  steps:
  - vi: Know $\det(A)=1$ and $\det(B)=1$.
    en: Know $\det(A)=1$ and $\det(B)=1$.
  - vi: Suy ra $\det(A+B)=2$.
    en: Infer $\det(A+B)=2$.
  - vi: Conclude $A+B$ is non-singular.
    en: Conclude $A+B$ is non-singular.
  answer: 1
- id: c1w4-01-multi
  topic: ml-motivation-pca
  type: multi-step
  difficulty: 2
  tags:
  - worked
  prompt:
    vi: 'Động lực ML: PCA: giải từng phần theo thứ tự; kết quả trước giúp kiểm tra phần sau.'
    en: 'Multi-step task for ML motivation: PCA: $A=[[2,1],[0,3]]$.'
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: For the triangular example, the determinant is $2\cdot3=6$ and the diagonal entries already reveal the eigenvalues used for projection.
  hints:
  - vi: 'Bắt đầu từ định nghĩa: determinant, rank, span hoặc phương trình eigenvector phù hợp với bài.'
    en: Start from the relevant definition.
  parts:
  - type: numeric
    prompt:
      vi: Compute determinant.
      en: Compute determinant.
    answers:
    - value: 6
    tolerance: 0
    explanation:
      vi: $2\cdot3-1\cdot0=6$.
      en: $2\cdot3-1\cdot0=6$.
  - type: mcq
    prompt:
      vi: What are the eigenvalues?
      en: What are the eigenvalues?
    options:
    - vi: $2,3$
      en: $2,3$
    - vi: $1,0$
      en: $1,0$
    - vi: $6,0$
      en: $6,0$
    answer:
    - 0
    explanation:
      vi: 'Triangular matrix: eigenvalues are diagonal entries.'
      en: 'Triangular matrix: eigenvalues are diagonal entries.'
- id: c1w4-pca-code-01
  topic: ml-motivation-pca
  type: code
  difficulty: 2
  tags:
  - code
  - pca
  prompt:
    vi: 'Động lực ML: PCA: hoàn thành hàm Python/NumPy theo yêu cầu và tránh shortcut bị cấm.'
    en: 'Implement `project_onto_pc(X, pc)`: center data then project onto unit vector `pc`.'
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: After subtracting the mean, 1D coordinates are `Xc @ pc`.
  hints:
  - vi: 'Bắt đầu từ định nghĩa: determinant, rank, span hoặc phương trình eigenvector phù hợp với bài.'
    en: Start from the relevant definition.
  starter: "import numpy as np\ndef project_onto_pc(X, pc):\n    return np.asarray(X) @ np.asarray(pc)\n"
  solution: "import numpy as np\ndef project_onto_pc(X, pc):\n    X=np.asarray(X,dtype=float); pc=np.asarray(pc,dtype=float)\n    return (X-X.mean(axis=0)) @ pc\n"
  tests: "import numpy as np\ndef test_horizontal():\n    X=np.array([[1.,1.],[3.,1.],[5.,1.]])\n    assert np.allclose(project_onto_pc(X,[1.,0.]), [-2.,0.,2.])\ndef test_vertical():\n    X=np.array([[0.,2.],[0.,4.]])\n    assert np.allclose(project_onto_pc(X,[0.,1.]), [-1.,1.])\n"
- id: c1w4-predict-01
  topic: ml-motivation-pca
  type: predict-output
  difficulty: 1
  tags:
  - numpy
  prompt:
    vi: 'Động lực ML: PCA: đọc code NumPy và dự đoán output.'
    en: Predict the rounded determinant output for the PCA slide matrix.
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: Rounding `np.linalg.det` gives 5 for the slide matrix, matching the non-collapsed PCA motivation example.
  hints: []
  code: 'import numpy as np

    A=np.array([[3.,1.],[1.,2.]])

    print(round(np.linalg.det(A)))

    '
  options:
  - '5'
  - '0'
  - '-5'
  answer: 0
