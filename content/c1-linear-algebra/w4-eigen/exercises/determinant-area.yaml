exercises:
- id: c1w4-03-mcq-fig
  topic: determinant-area
  type: mcq
  difficulty: 1
  tags:
  - figure
  - concept
  prompt:
    vi: 'Định thức như diện tích có hướng: chọn đáp án đúng dựa trên dữ kiện, hình vẽ hoặc tính chất đã học.'
    en: 'Determinant as oriented area: what is the area of the parallelogram from columns $(3,1)$ and $(1,2)$?'
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: 'The parallelogram area is the absolute determinant: $|3\cdot2-1\cdot1|=5$.'
  hints: []
  figure:
    xRange:
    - -1
    - 5
    yRange:
    - -1
    - 4
    vectors:
    - to:
      - 3
      - 1
      label: Ae1
      color: '#2563eb'
    - to:
      - 1
      - 2
      label: Ae2
      color: '#16a34a'
    - from:
      - 3
      - 1
      to:
      - 4
      - 3
      color: '#16a34a'
    - from:
      - 1
      - 2
      to:
      - 4
      - 3
      color: '#2563eb'
  options:
  - vi: '5'
    en: '5'
  - vi: '0'
    en: '0'
  - vi: -5 as geometric area
    en: -5 as geometric area
  answer:
  - 0
- id: c1w4-03-tf
  topic: determinant-area
  type: true-false
  difficulty: 1
  tags:
  - concept
  prompt:
    vi: 'Định thức như diện tích có hướng: quyết định mệnh đề đúng hay sai và chọn lý do phù hợp nếu có.'
    en: 'Determinant as oriented area: determinant zero always signals loss of at least one independent direction for a square matrix.'
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: A zero determinant would make the transformed unit square have zero area, so the two column directions are dependent.
  hints: []
  answer: true
  reasons:
  - vi: Hình bình hành ảnh có diện tích bằng 0.
    en: The image parallelogram has zero area.
  - vi: Diện tích bằng 0 chỉ có nghĩa là orientation âm.
    en: Zero area only means the orientation is negative.
  reasonAnswer: 0
- id: c1w4-03-numeric
  topic: determinant-area
  type: numeric
  difficulty: 1
  tags:
