  prompt:
    vi: 'Định thức như diện tích có hướng: tính giá trị số được yêu cầu; chú ý determinant, rank hoặc eigenvalue.'
    en: 'Determinant as oriented area: compute $det([[1,3],[2,1]])$.'
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: Multiplying the diagonals gives $1-6=-5$, so the oriented area is negative with magnitude 5.
  hints: []
  answers:
  - value: -5
  tolerance: 0
