    - 0
    explanation:
      vi: 'Triangular matrix: eigenvalues are diagonal entries.'
      en: 'Triangular matrix: eigenvalues are diagonal entries.'
- id: c1w4-area-code-det2-01
  topic: determinant-area
  type: code
  difficulty: 2
  tags:
  - code
  - determinant
  prompt:
    vi: 'Định thức như diện tích có hướng: hoàn thành hàm Python/NumPy theo yêu cầu và tránh shortcut bị cấm.'
    en: Implement `det2(A)` for a 2×2 matrix; do not use `np.linalg.det`.
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: $ad-bc$ is the direct formula.
  hints:
  - vi: 'Bắt đầu từ định nghĩa: determinant, rank, span hoặc phương trình eigenvector phù hợp với bài.'
    en: Start from the relevant definition.
  starter: "def det2(A):\n    return 0\n"
  solution: "def det2(A):\n    return A[0][0]*A[1][1]-A[0][1]*A[1][0]\n"
  tests: "def test_positive():\n    assert det2([[3,1],[1,2]]) == 5\ndef test_negative():\n    assert det2([[1,3],[2,1]]) == -5\n"
