- id: c1w4-10-tf
  topic: characteristic-polynomial-pca
  type: true-false
  difficulty: 1
  tags:
  - concept
  prompt:
    vi: 'Đa thức đặc trưng và PCA: quyết định mệnh đề đúng hay sai và chọn lý do phù hợp nếu có.'
    en: 'Characteristic polynomial and PCA: determinant zero always signals loss of at least one independent direction for a square matrix.'
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: A zero determinant makes the characteristic polynomial have zero as a root, matching an ideal collapsed PCA direction.
  hints: []
  answer: true
  reasons:
  - vi: Characteristic polynomial có nghiệm 0, tương ứng một hướng mất variance.
    en: The characteristic polynomial has root 0, matching a direction with lost variance.
  - vi: Hằng số determinant bằng 0 chứng minh mọi eigenvalue đều khác 0.
    en: A zero determinant constant proves every eigenvalue is nonzero.
  reasonAnswer: 0
