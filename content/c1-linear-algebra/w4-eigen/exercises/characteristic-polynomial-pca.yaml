  prompt:
    vi: 'Đa thức đặc trưng và PCA: tìm bước sai đầu tiên trong lời giải.'
    en: Find the first error in the solution about Characteristic polynomial and PCA.
  explanation:
    vi: 'Lời giải dùng công thức cốt lõi của tuần 4: determinant đo diện tích, rank đo số chiều còn lại, và eigenvectors thỏa $Av=\lambda v$. Kiểm tra lại bằng phép tính nhỏ để tránh nhầm dấu hoặc nhầm hàng/cột.'
    en: The second step would corrupt the characteristic polynomial because determinants must be computed after forming the exact matrix.
