      "id": "c3w1-continuous-pdf-truefalse-02",
      "topic": "continuous-pdf",
      "type": "true-false",
      "difficulty": 2,
      "tags": [
        "misconception"
      ],
      "hints": [
        {
          "vi": "Hãy hỏi: mẫu số là gì?",
          "en": "Ask: what is the denominator?"
        }
      ],
      "prompt": {
        "vi": "Trong biến liên tục và pdf, chiều cao hoặc phép cộng thô luôn trực tiếp bằng xác suất cần tìm.",
        "en": "In continuous variables and pdfs, raw height or raw addition is always directly the desired probability."
      },
      "explanation": {
        "vi": "Luôn kiểm tra mẫu số, phần giao, hoặc diện tích trước khi tính.",
        "en": "For a continuous variable, an interval area matters; a single PDF height is not a probability."
      },
      "answer": false,
      "reasons": [
        {
          "vi": "Đúng: với thời gian chờ liên tục, công thức tích phân chỉ áp dụng cho khoảng có độ rộng.",
          "en": "True: for continuous waiting time, the integral formula applies to an interval with positive width."
        },
        {
          "vi": "Sai: dùng PMF $P(X=x)$ như chiều cao cột sẽ nhầm mật độ với xác suất điểm.",
          "en": "False: using a PMF-style $P(X=x)$ as a bar height confuses density with point probability."
        },
        {
          "vi": "Sai: PDF hợp lệ không âm; xác suất khoảng là diện tích dưới đường cong.",
          "en": "False: a valid PDF is nonnegative; interval probability is area under the curve."
        }
      ],
      "reasonAnswer": 1
    },
