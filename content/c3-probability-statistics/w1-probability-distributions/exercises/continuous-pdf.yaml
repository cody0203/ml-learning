      "prompt": {
        "vi": "Phát biểu nào mô tả đúng nhất chủ đề biến liên tục và pdf?",
        "en": "Which statement best describes continuous variables and pdfs?"
      },
      "explanation": {
        "vi": "Đáp án đúng nhấn mạnh diện tích dưới PDF. Các đáp án sai đọc chiều cao tại 2 phút là xác suất điểm, cộng các chiều cao rời rạc, hoặc yêu cầu biến liên tục chỉ nhận số nguyên.",
        "en": "The correct answer emphasizes area under the PDF. The wrong choices read height at 2 minutes as point probability, add isolated heights, or require a continuous variable to take only integers."
      },
      "options": [
        {
          "vi": "Trọng tâm là probability as area, not point height.",
          "en": "The focus is probability as area, not point height."
        },
        {
          "vi": "Nếu $f(2)=0.2$ thì $P(X=2)=0.2$.",
          "en": "If $f(2)=0.2$, then $P(X=2)=0.2$."
        },
        {
          "vi": "Xác suất từ 2 đến 3 phút được tính bằng $f(2)+f(3)$.",
          "en": "The probability from 2 to 3 minutes is computed as $f(2)+f(3)$."
        },
        {
          "vi": "Thời gian chờ liên tục chỉ có thể nhận 0, 1, 2, 3, 4, 5 phút.",
          "en": "A continuous waiting time can only be 0, 1, 2, 3, 4, or 5 minutes."
        }
