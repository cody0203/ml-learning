      },
      "explanation": {
        "vi": "Đáp án đúng bắt đầu từ không gian mẫu và biến cố. Cộng xác suất là quy tắc cho hợp, PDF thuộc biến liên tục, còn prior/posterior là ngôn ngữ Bayes nên không trả lời câu hỏi đếm 3 trên 10.",
        "en": "The correct answer starts with the sample space and event. Adding probabilities is a union rule, PDF height belongs to continuous variables, and prior/posterior language is Bayes rather than the 3-out-of-10 counting question."
      },
      "options": [
        {
          "vi": "Trọng tâm là sample space, event, relative frequency.",
          "en": "The focus is sample space, event, relative frequency."
        },
        {
          "vi": "Vì có 3 trẻ chơi bóng đá nên xác suất phải là 3, không phải 0.3.",
          "en": "Because 3 children play soccer, the probability must be 3 rather than 0.3."
        },
        {
          "vi": "Không gian mẫu chỉ gồm 3 trẻ chơi bóng đá.",
          "en": "The sample space contains only the 3 children who play soccer."
        },
        {
          "vi": "Không cần xác định thí nghiệm trước khi tính xác suất.",
          "en": "There is no need to identify the experiment before computing probability."
        }
      ],
      "answer": [
        0
      ]
