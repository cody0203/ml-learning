      "prompt": {
        "vi": "Phát biểu nào mô tả đúng nhất chủ đề độc lập và quy tắc nhân?",
        "en": "Which statement best describes independence and product rule?"
      },
      "explanation": {
        "vi": "Đáp án đúng kiểm tra việc biết một biến cố có đổi xác suất biến cố kia không. Các đáp án sai nhầm độc lập với rời nhau, với quan hệ nhân quả, hoặc với việc hai biến cố có cùng xác suất.",
        "en": "The correct answer checks whether knowing one event changes the probability of the other. The distractors confuse independence with disjointness, causality, or having equal probabilities."
      },
      "options": [
        {
          "vi": "Trọng tâm là whether knowing one event changes another.",
          "en": "The focus is whether knowing one event changes another."
        },
        {
          "vi": "Hai biến cố độc lập thì không bao giờ cùng xảy ra.",
          "en": "Independent events can never happen together."
        },
        {
          "vi": "Độc lập có nghĩa là $A$ gây ra $B$.",
          "en": "Independence means $A$ causes $B$."
        },
        {
          "vi": "Nếu $P(A)=P(B)$ thì chắc chắn độc lập.",
          "en": "If $P(A)=P(B)$, the events must be independent."
        }
      ],
      "answer": [
        0
      ]
