      "prompt": {
        "vi": "Cài đặt Naive Bayes toy cho spam/ham.",
        "en": "Implement a toy Naive Bayes spam/ham posterior."
      },
      "explanation": {
        "vi": "Hàm đúng chuyển công thức xác suất thành mã trực tiếp.",
        "en": "The code multiplies the lottery and winning likelihoods inside each class before normalizing scores."
      },
      "starter": "def spam_posterior(prior_spam, spam_liks, ham_liks):\n    return prior_spam\n",
      "solution": "def spam_posterior(prior_spam, spam_liks, ham_liks):\n    ps = prior_spam\n    ph = 1 - prior_spam\n    for v in spam_liks:\n        ps *= v\n    for v in ham_liks:\n        ph *= v\n    return ps / (ps + ph)\n",
      "tests": "def test_two_words():\n    ans = spam_posterior(0.2, [0.7, 0.75], [0.125, 0.1])\n    assert abs(ans - 0.9130434782608695) < 1e-9\n\ndef test_one_word():\n    ans = spam_posterior(0.2, [0.7], [0.125])\n    assert abs(ans - 0.5833333333333334) < 1e-9\n"
    },
