      "hints": [],
      "prompt": {
        "vi": "Phát biểu nào mô tả đúng nhất chủ đề phân phối đều?",
        "en": "Which statement best describes uniform distribution?"
      },
      "explanation": {
        "vi": "Đáp án đúng nói mật độ hằng trên khoảng. Các đáp án sai làm đầu mút có xác suất điểm, làm khoảng dài hơn không tăng xác suất, hoặc đặt mật độ bằng $b-a$ thay vì nghịch đảo.",
        "en": "The correct answer says the density is constant over the interval. The wrong choices give endpoints point mass, deny that longer intervals have more probability, or set density to $b-a$ instead of its reciprocal."
      },
      "options": [
        {
          "vi": "Trọng tâm là equal density over an interval.",
          "en": "The focus is equal density over an interval."
        },
        {
          "vi": "Trong $Uniform(0,15)$, $P(T=6)=1/15$ vì mật độ là $1/15$.",
          "en": "For $Uniform(0,15)$, $P(T=6)=1/15$ because the density is $1/15$."
        },
        {
          "vi": "Khoảng dài 3 phút và khoảng dài 6 phút có cùng xác suất trong phân phối đều.",
          "en": "A 3-minute interval and a 6-minute interval have the same probability in a uniform distribution."
        },
        {
          "vi": "Mật độ đều trên $(a,b)$ là $b-a$ để diện tích bằng 1.",
          "en": "The uniform density on $(a,b)$ is $b-a$ so that the area equals 1."
        }
      ],
      "answer": [
        0
      ],
