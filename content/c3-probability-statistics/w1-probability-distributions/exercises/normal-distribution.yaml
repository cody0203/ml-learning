      "starter": "def normal_pdf(x, mu, sigma):\n    return 0.0\n",
      "solution": "def normal_pdf(x, mu, sigma):\n    import math\n    z = (x - mu) / sigma\n    return (1 / (sigma * math.sqrt(2 * math.pi))) * math.exp(-0.5 * z * z)\n",
      "tests": "def test_standard_center():\n    import math\n    assert abs(normal_pdf(0, 0, 1) - 1/math.sqrt(2*math.pi)) < 1e-9\n\ndef test_shift_scale():\n    assert abs(normal_pdf(2, 2, 0.5) - 0.7978845608028654) < 1e-9\n"
