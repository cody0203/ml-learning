        "vi": "Đáp án đúng nêu vấn đề đếm trùng trong hợp. Các lựa chọn sai lần lượt bỏ phần giao, trừ cả hai xác suất, hoặc dùng phép nhân độc lập cho một câu hỏi 'or'.",
