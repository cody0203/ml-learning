      "prompt": {
        "vi": "Phát biểu nào mô tả đúng nhất chủ đề hàm phân phối tích lũy cdf?",
        "en": "Which statement best describes cumulative distribution functions?"
      },
      "explanation": {
        "vi": "Đáp án đúng đọc CDF là xác suất tích lũy đến $x$. Các lựa chọn sai nhầm CDF với PDF, cho phép đồ thị giảm, hoặc dùng $F(b)+F(a)$ cho xác suất khoảng.",
        "en": "The correct answer reads a CDF as accumulated probability up to $x$. The distractors confuse CDF with PDF, allow the graph to decrease, or use $F(b)+F(a)$ for an interval probability."
      },
      "options": [
        {
          "vi": "Trọng tâm là accumulated probability up to a point.",
          "en": "The focus is accumulated probability up to a point."
        },
        {
          "vi": "$F_X(x)$ là chiều cao mật độ tại đúng điểm $x$.",
          "en": "$F_X(x)$ is the density height exactly at $x$."
        },
        {
          "vi": "Một CDF hợp lệ có thể giảm từ 0.8 xuống 0.6.",
          "en": "A valid CDF may decrease from 0.8 to 0.6."
        },
        {
          "vi": "$P(a<X\\le b)$ được tính bằng $F(b)+F(a)$.",
          "en": "$P(a<X\\le b)$ is computed as $F(b)+F(a)$."
        }
      ],
      "answer": [
        0
      ]
    },
    {
      "id": "c3w1-cdf-truefalse-02",
      "topic": "cdf",
      "type": "true-false",
      "difficulty": 2,
      "tags": [
        "misconception"
      ],
      "hints": [
        {
          "vi": "Hãy hỏi: mẫu số là gì?",
          "en": "Ask: what is the denominator?"
        }
      ],
      "prompt": {
        "vi": "Trong hàm phân phối tích lũy cdf, chiều cao hoặc phép cộng thô luôn trực tiếp bằng xác suất cần tìm.",
        "en": "In cumulative distribution functions, raw height or raw addition is always directly the desired probability."
      },
      "explanation": {
        "vi": "Luôn kiểm tra mẫu số, phần giao, hoặc diện tích trước khi tính.",
        "en": "A CDF value is accumulated probability up to x, so interval probabilities use differences of CDF values."
      },
      "answer": false,
      "reasons": [
        {
          "vi": "Đúng: $F_X(x)$ là xác suất tích lũy đến ngưỡng $x$, nên phải biết ngưỡng đang xét.",
          "en": "True: $F_X(x)$ is accumulated probability up to cutoff $x$, so the cutoff must be identified."
        },
        {
          "vi": "Sai: với xác suất khoảng, CDF dùng hiệu $F(b)-F(a)$ chứ không dùng một công thức tùy ý.",
          "en": "False: for interval probability, a CDF uses the difference $F(b)-F(a)$ rather than an arbitrary formula."
        },
        {
          "vi": "Sai: CDF không giảm và nằm trong $[0,1]$; nó không mô tả PDF âm.",
          "en": "False: a CDF is nondecreasing and lies in $[0,1]$; it is not describing a negative PDF."
        }
      ],
      "reasonAnswer": 1
    },
