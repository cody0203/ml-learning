      "prompt": {
        "vi": "Lấy mẫu theo khoảng xác suất tích lũy.",
        "en": "Sample by cumulative probability intervals."
      },
      "explanation": {
        "vi": "Hàm đúng chuyển công thức xác suất thành mã trực tiếp.",
        "en": "The sampler walks through cumulative cutoffs, so 0.5 lands in the second interval for the test case."
      },
      "starter": "def sample_category(u, probs):\n    return -1\n",
      "solution": "def sample_category(u, probs):\n    total = 0.0\n    for i, p in enumerate(probs):\n        total += p\n        if u < total or (i == len(probs)-1 and u <= total):\n            return i\n    return len(probs) - 1\n",
      "tests": "def test_intervals():\n    assert sample_category(0.1, [0.3, 0.5, 0.2]) == 0\n    assert sample_category(0.5, [0.3, 0.5, 0.2]) == 1\n    assert sample_category(0.9, [0.3, 0.5, 0.2]) == 2\n"
    },
