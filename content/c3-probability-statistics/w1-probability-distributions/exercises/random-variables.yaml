      "prompt": {
        "vi": "Trong biến ngẫu nhiên, công thức $X:S\\to\\mathbb R$ chỉ có ý nghĩa sau khi xác định đúng biến cố và giả định.",
        "en": "In random variables, the formula $X:S\\to\\mathbb R$ is meaningful only after identifying the event and assumptions."
      },
      "explanation": {
        "vi": "Luôn kiểm tra mẫu số, phần giao, hoặc diện tích trước khi tính.",
        "en": "A random variable is a numeric mapping; here the assumption is about what number the outcome becomes."
      },
      "answer": true,
      "reasons": [
        {
          "vi": "Đúng: trước khi viết $P(X=1)$ phải biết $X$ mã hóa mặt ngửa là 1 hay một đại lượng khác.",
          "en": "True: before writing $P(X=1)$, you must know whether $X$ encodes heads as 1 or some other quantity."
        },
        {
          "vi": "Sai: cùng chuỗi tung đồng xu có thể được ánh xạ thành số mặt ngửa, số sấp, hoặc biến 0/1.",
          "en": "False: the same coin-toss sequence can map to heads count, tails count, or a 0/1 indicator."
        },
        {
          "vi": "Sai: biến ngẫu nhiên rời rạc không cần PDF; các xác suất khối vẫn không âm.",
          "en": "False: a discrete random variable does not need a PDF; its probability masses are still nonnegative."
        }
      ],
      "reasonAnswer": 0
    },
