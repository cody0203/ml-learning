      "prompt": {
        "vi": "Phát biểu nào mô tả đúng nhất chủ đề biến ngẫu nhiên?",
        "en": "Which statement best describes random variables?"
      },
      "explanation": {
        "vi": "Đáp án đúng xem biến ngẫu nhiên là ánh xạ từ kết quả sang số. Các lựa chọn sai đồng nhất nó với chuỗi tung thô, bắt nó phải liên tục, hoặc bắt nó có phân phối đều.",
        "en": "The correct answer treats a random variable as a map from outcomes to numbers. The wrong choices identify it with the raw toss sequence, require it to be continuous, or force it to be uniform."
      },
      "options": [
        {
          "vi": "Trọng tâm là mapping outcomes to numbers.",
          "en": "The focus is mapping outcomes to numbers."
        },
        {
          "vi": "Biến ngẫu nhiên số mặt ngửa chính là chuỗi HHT, không phải con số 2.",
          "en": "The random variable 'number of heads' is the sequence HHT itself, not the number 2."
        },
        {
          "vi": "Mọi biến ngẫu nhiên đều phải nhận mọi giá trị trong một khoảng.",
          "en": "Every random variable must take every value in an interval."
        },
        {
          "vi": "Nếu $X$ đếm số mặt ngửa thì các giá trị 0 đến 10 phải đồng xác suất.",
          "en": "If $X$ counts heads, the values 0 through 10 must be equally likely."
        }
      ],
      "answer": [
        0
      ]
