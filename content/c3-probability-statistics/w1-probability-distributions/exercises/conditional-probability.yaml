      "prompt": {
        "vi": "Phát biểu nào mô tả đúng nhất chủ đề xác suất có điều kiện?",
        "en": "Which statement best describes conditional probability?"
      },
      "explanation": {
        "vi": "Đáp án đúng thu hẹp mẫu số theo điều kiện. Các đáp án sai giữ nguyên 36 kết quả xúc xắc, đảo chiều điều kiện, hoặc xem điều kiện như một biến cố cần cộng thêm.",
        "en": "The correct answer restricts the denominator according to the condition. The wrong choices keep all 36 dice outcomes, reverse the condition, or treat the condition as an event to add."
      },
      "options": [
        {
          "vi": "Trọng tâm là restricting the sample space after evidence arrives.",
          "en": "The focus is restricting the sample space after evidence arrives."
        },
        {
          "vi": "Biết xúc xắc đầu là 6 nhưng mẫu số vẫn là 36.",
          "en": "Even after knowing the first die is 6, the denominator remains 36."
        },
        {
          "vi": "$P(\\text{sum}=10\\mid \\text{first}=6)$ giống $P(\\text{first}=6\\mid \\text{sum}=10)$.",
          "en": "$P(\\text{sum}=10\\mid \\text{first}=6)$ is the same as $P(\\text{first}=6\\mid \\text{sum}=10)$."
        },
        {
          "vi": "Điều kiện được xử lý bằng cách cộng thêm $P(A)$ vào tử số.",
          "en": "A condition is handled by adding $P(A)$ to the numerator."
        }
      ],
      "answer": [
        0
      ]
