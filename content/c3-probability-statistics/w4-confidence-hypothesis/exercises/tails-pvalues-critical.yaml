- id: c3w4-tails-pvalues-critical-code-01
  topic: tails-pvalues-critical
  type: code
  difficulty: 2
  tags:
  - python
  - p-value
  prompt:
    vi: Viết hàm p-value z-test cho tails `'right'`, `'left'`, `'two'` dùng `math.erf`.
    en: Write a z-test p-value function for tails `'right'`, `'left'`, `'two'` using `math.erf`.
  explanation:
    vi: CDF chuẩn là $\Phi(z)=0.5(1+erf(z/\sqrt2))$. Right tail là $1-\Phi(z)$, left là $\Phi(z)$, two là $2\min(\Phi(z),1-\Phi(z))$.
    en: The normal CDF is $\Phi(z)=0.5(1+erf(z/\sqrt2))$. Right tail is $1-\Phi(z)$, left is $\Phi(z)$, two is $2\min(\Phi(z),1-\Phi(z))$.
  hints: []
  starter: "import math\n\ndef z_pvalue(z, tail):\n    return None\n"
  solution: "import math\n\ndef z_pvalue(z, tail):\n    phi = 0.5 * (1 + math.erf(z / math.sqrt(2)))\n    if tail == 'right':\n\
    \        return 1 - phi\n    if tail == 'left':\n        return phi\n    if tail == 'two':\n        return 2 * min(phi,\
    \ 1 - phi)\n    raise ValueError('tail must be right, left, or two')\n"
  tests: "def test_right():\n    assert abs(z_pvalue(1.837, 'right') - 0.03315) < 0.002\n\ndef test_two_symmetry():\n    assert\
    \ abs(z_pvalue(-2, 'two') - z_pvalue(2, 'two')) < 1e-12\n\ndef test_left():\n    assert z_pvalue(-1, 'left') < 0.16\n"
- id: c3w4-tails-pvalues-critical-find-error-01
  topic: tails-pvalues-critical
  type: find-error
  difficulty: 2
  tags:
  - tail
  prompt:
    vi: Tìm lỗi đầu tiên trong kiểm định tail.
    en: Find the first tail-choice error.
  explanation:
    vi: 'Sai ở bước 3: $H_1:\mu<\mu_0$ là left-tail, nên p-value dùng $P(Z\le z_{obs})$.'
    en: 'Step 3 is wrong: $H_1:\mu<\mu_0$ is left-tailed, so the p-value uses $P(Z\le z_{obs})$.'
  hints: []
  steps:
  - vi: Đặt $H_0:\mu=100$, $H_1:\mu<100$.
    en: Set $H_0:\mu=100$, $H_1:\mu<100$.
  - vi: Tính được $z_{obs}=-1.9$.
    en: Compute $z_{obs}=-1.9$.
  - vi: Vì statistic là z, p-value = $P(Z\ge -1.9)$.
    en: Because the statistic is z, p-value = $P(Z\ge -1.9)$.
  - vi: So sánh p-value với $\alpha$.
    en: Compare p-value with $\alpha$.
  answer: 2
