exercises:
- id: c3w4-tails-pvalues-critical-mcq-06
  topic: tails-pvalues-critical
  type: mcq
  difficulty: 1
  tags:
  - concept
  prompt:
    vi: Với $H_1:\mu>66.7$, p-value lấy vùng nào?
    en: With $H_1:\mu>66.7$, which region gives the p-value?
  explanation:
    vi: Alternative dấu lớn hơn làm test right-tailed; p-value là xác suất statistic lớn ít nhất như quan sát.
    en: A greater-than alternative makes the test right-tailed; the p-value is the probability of a statistic at least as large as observed.
  hints: []
  options:
  - vi: Đuôi phải từ $z_{obs}$ trở lên.
    en: The right tail from $z_{obs}$ upward.
  - vi: Luôn là vùng giữa $-z_{obs}$ và $z_{obs}$.
    en: Always the region between $-z_{obs}$ and $z_{obs}$.
  - vi: Đuôi trái bất kể dấu của $H_1$.
    en: The left tail regardless of the sign in $H_1$.
  answer:
  - 0
- id: c3w4-tails-pvalues-critical-tf-06
  topic: tails-pvalues-critical
  type: true-false
  difficulty: 1
  tags:
  - misconception
  prompt:
    vi: Với two-tailed test đối xứng, p-value thường gấp đôi tail một phía tương ứng với $|z_{obs}|$.
    en: For a symmetric two-tailed test, the p-value is usually twice the one-tail area beyond $|z_{obs}|$.
  explanation:
    vi: Đúng. Hai phía nghĩa là cả độ lệch dương và âm đều extreme, nên cộng hai tail đối xứng.
    en: True. Two-sided means both positive and negative deviations are extreme, so the two symmetric tails are added.
  hints: []
  answer: true
  reasons:
  - vi: Cả hai hướng lệch khỏi $\mu_0$ đều tính là extreme.
    en: Deviations in both directions from $\mu_0$ count as extreme.
  - vi: Two-tailed test chỉ nhìn đuôi phải.
    en: A two-tailed test only looks at the right tail.
  reasonAnswer: 0
- id: c3w4-tails-pvalues-critical-match-06
  topic: tails-pvalues-critical
  type: matching
  difficulty: 1
  tags:
  - vocabulary
  prompt:
    vi: Ghép alternative với vùng rejection chuẩn hóa.
    en: Match each alternative with its standardized rejection region.
  explanation:
    vi: Dấu trong $H_1$ quyết định dùng đuôi phải, đuôi trái hay hai đuôi.
    en: The sign in $H_1$ determines whether to use the right tail, left tail, or both tails.
  hints: []
  pairs:
  - left:
      vi: $H_1:\mu>\mu_0$
      en: $H_1:\mu>\mu_0$
    right:
      vi: reject nếu $z$ rất lớn
      en: reject for very large $z$
  - left:
      vi: $H_1:\mu<\mu_0$
      en: $H_1:\mu<\mu_0$
    right:
      vi: reject nếu $z$ rất nhỏ
      en: reject for very small $z$
  - left:
      vi: standard error
      en: standard error
    right:
      vi: độ lệch chuẩn của estimator
      en: standard deviation of an estimator
- id: c3w4-tails-pvalues-critical-parsons-06
  topic: tails-pvalues-critical
  type: parsons
  difficulty: 2
  tags:
  - procedure
  prompt:
    vi: Sắp xếp bước p-value cho z-test right-tailed.
    en: Order the p-value steps for a right-tailed z-test.
  explanation:
    vi: Right-tailed z-test chuẩn hóa mean, lấy survival probability, rồi so với $\alpha$.
    en: A right-tailed z-test standardizes the mean, takes a survival probability, then compares it with $\alpha$.
  hints:
  - vi: Dùng survival function cho đuôi phải.
    en: Use the survival function for the right tail.
  steps:
  - vi: Viết $H_0:\mu=\mu_0$ và $H_1:\mu>\mu_0$.
    en: Write $H_0:\mu=\mu_0$ and $H_1:\mu>\mu_0$.
  - vi: Tính $z=(\bar x-\mu_0)/(\sigma/\sqrt n)$.
    en: Compute $z=(\bar x-\mu_0)/(\sigma/\sqrt n)$.
  - vi: Tính $p=P(Z\ge z_{obs})$.
    en: Compute $p=P(Z\ge z_{obs})$.
  - vi: Reject nếu $p\le\alpha$.
    en: Reject if $p\le\alpha$.
- id: c3w4-tails-pvalues-critical-numeric-01
  topic: tails-pvalues-critical
  type: numeric
  difficulty: 2
  tags:
  - z-test
  prompt:
    vi: Với $\bar x=68.442$, $\mu_0=66.7$, $\sigma=3$, $n=10$, tính z statistic.
    en: With $\bar x=68.442$, $\mu_0=66.7$, $\sigma=3$, $n=10$, compute the z statistic.
  explanation:
    vi: $z=(68.442-66.7)/(3/\sqrt{10})=1.837$.
    en: $z=(68.442-66.7)/(3/\sqrt{10})=1.837$.
  hints: []
  answers:
  - value: 1.837
  tolerance: 0.001
