    en: Generator confidence interval known sigma.
  explanation:
    vi: Dùng để luyện z interval, đối chiếu với t/proportion khi không phù hợp.
    en: Use it to practice z intervals and compare with cases needing t/proportion.
  hints: []
  generator: confidence-interval
  params: {}
