- id: c3w4-power-results-find-error-01
  topic: power-results
  type: find-error
  difficulty: 2
  tags:
  - interpretation
  prompt:
    vi: Tìm lỗi diễn giải đầu tiên.
    en: Find the first interpretation error.
  explanation:
    vi: 'Sai ở bước 2: p-value lớn không chứng minh không có hiệu ứng; cần xem power và effect size.'
    en: 'Step 2 is wrong: a large p-value does not prove no effect; consider power and effect size.'
  hints: []
  steps:
  - vi: A/B test cho p-value 0.18.
    en: An A/B test returns p-value 0.18.
  - vi: Do đó chắc chắn hai phiên bản giống hệt nhau.
    en: Therefore the two versions are certainly identical.
  - vi: Một diễn giải tốt hơn là chưa đủ bằng chứng khác biệt ở mức đã chọn.
    en: A better interpretation is insufficient evidence of a difference at the chosen level.
  - vi: Có thể cần kiểm tra power để biết test có đủ nhạy không.
    en: We may need a power check to know whether the test is sensitive enough.
  answer: 1
- id: c3w4-power-results-code-01
  topic: power-results
  type: code
  difficulty: 3
  tags:
  - python
  - power
  prompt:
    vi: Viết hàm tính power cho right-tail z-test của mean known $\sigma$.
    en: Write a function computing power for a right-tail z-test of a mean with known $\sigma$.
  explanation:
    vi: Critical mean là $\mu_0+z_{1-\alpha}\sigma/\sqrt n$. Power tại $\mu_1$ là $P_{\mu_1}(\bar X>crit)$.
    en: The critical mean is $\mu_0+z_{1-\alpha}\sigma/\sqrt n$. Power at $\mu_1$ is $P_{\mu_1}(\bar X>crit)$.
  hints: []
  starter: "import math\nfrom scipy import stats\n\ndef right_tail_power(mu0, mu1, sigma, n, alpha):\n    return None\n"
  solution: "import math\nfrom scipy import stats\n\ndef right_tail_power(mu0, mu1, sigma, n, alpha):\n    se = sigma / math.sqrt(n)\n\
    \    crit = mu0 + stats.norm.ppf(1 - alpha) * se\n    return stats.norm.sf((crit - mu1) / se)\n"
  tests: "def test_power_large_effect():\n    p = right_tail_power(66.7, 70, 3, 10, 0.05)\n    assert 0.95 < p < 0.98, f'expected\
    \ about 0.967, got {p}'\n\ndef test_power_near_alpha_at_null():\n    p = right_tail_power(0, 0, 1, 25, 0.05)\n    assert\
    \ abs(p - 0.05) < 1e-10\n"
