exercises:
- id: c3w4-power-results-mcq-07
  topic: power-results
  type: mcq
  difficulty: 1
  tags:
  - concept
  prompt:
    vi: Power của test tại một alternative cụ thể là gì?
    en: What is the power of a test at a specific alternative?
  explanation:
    vi: Power là xác suất rơi vào rejection region khi alternative thật; nó bằng $1-\beta$.
    en: Power is the probability of landing in the rejection region when the alternative is true; it equals $1-\beta$.
  hints: []
  options:
  - vi: $P(\text{reject }H_0\mid H_1\text{ true})$.
    en: $P(\text{reject }H_0\mid H_1\text{ true})$.
  - vi: $P(H_0\text{ true}\mid data)$.
    en: $P(H_0\text{ true}\mid data)$.
  - vi: Độ rộng của confidence interval.
    en: The width of a confidence interval.
  answer:
  - 0
- id: c3w4-power-results-tf-07
  topic: power-results
  type: true-false
  difficulty: 1
  tags:
  - misconception
  prompt:
    vi: Với $n$ cố định, giảm $\alpha$ thường làm rejection region nhỏ hơn.
    en: With fixed $n$, lowering $\alpha$ usually makes the rejection region smaller.
  explanation:
    vi: Đúng. Critical value đi xa hơn vào tail, nên Type I error giảm nhưng power cũng thường giảm.
    en: True. The critical value moves farther into the tail, reducing Type I error but usually also reducing power.
  hints: []
  answer: true
  reasons:
  - vi: Rejection region nhỏ hơn khó lọt vào hơn.
    en: A smaller rejection region is harder to hit.
  - vi: Giảm $\alpha$ luôn tăng power.
    en: Lowering $\alpha$ always increases power.
  reasonAnswer: 0
- id: c3w4-power-results-match-07
  topic: power-results
  type: matching
  difficulty: 1
  tags:
  - vocabulary
  prompt:
    vi: Ghép đại lượng power với ý nghĩa trong rule $\bar X>68.26$.
    en: Match each power quantity with its meaning for the rule $\bar X>68.26$.
  explanation:
    vi: Với true mean 70, $\beta$ là diện tích bên trái 68.26; power là phần bên phải.
    en: With true mean 70, $\beta$ is the area left of 68.26; power is the area to the right.
  hints: []
  pairs:
  - left:
      vi: $\beta(70)$
      en: $\beta(70)$
    right:
      vi: không reject khi $\mu=70$
      en: do not reject when $\mu=70$
  - left:
      vi: power tại $\mu=70$
      en: power at $\mu=70$
    right:
      vi: reject khi $\mu=70$
      en: reject when $\mu=70$
  - left:
      vi: standard error
      en: standard error
    right:
      vi: độ lệch chuẩn của estimator
      en: standard deviation of an estimator
- id: c3w4-power-results-parsons-07
  topic: power-results
  type: parsons
  difficulty: 2
  tags:
  - procedure
  prompt:
    vi: Sắp xếp cách tính power cho rule $\bar X>k$.
    en: Order the computation of power for the rule $\bar X>k$.
  explanation:
    vi: Power được tính dưới phân phối alternative, không dưới null, vì ta giả sử hiệu ứng thật tồn tại.
    en: Power is computed under the alternative distribution, not under the null, because we assume the effect is real.
  hints:
  - vi: Critical boundary $k$ đến từ rule đã thiết kế.
    en: The critical boundary $k$ comes from the designed rule.
  steps:
  - vi: Ghi decision rule, ví dụ reject nếu $\bar X>k$.
    en: Write the decision rule, e.g. reject if $\bar X>k$.
  - vi: Chọn true mean trong alternative, ví dụ $\mu=70$.
    en: Choose the true mean under the alternative, e.g. $\mu=70$.
  - vi: Chuẩn hóa $k$ dưới phân phối có mean 70.
    en: Standardize $k$ under the distribution with mean 70.
  - vi: Lấy tail probability nằm trong rejection region.
    en: Take the tail probability inside the rejection region.
- id: c3w4-power-results-numeric-01
  topic: power-results
  type: numeric
  difficulty: 2
  tags:
  - power
  prompt:
    vi: Right-tail rule reject nếu $\bar X>68.26$, $\sigma=3$, $n=10$. Nếu true $\mu=70$, tính $\beta=P(\bar X\le68.26)$;
      dùng z=-1.834 và $\Phi(-1.834)=0.0333$.
    en: Right-tail rule rejects if $\bar X>68.26$, $\sigma=3$, $n=10$. If true $\mu=70$, compute $\beta=P(\bar X\le68.26)$;
      use z=-1.834 and $\Phi(-1.834)=0.0333$.
  explanation:
    vi: Type II error là không reject khi alternative true, nên $\beta=0.0333$.
    en: Type II error is failing to reject when the alternative is true, so $\beta=0.0333$.
  hints: []
  answers:
  - label: beta
    value: 0.0333
  - label: power
    value: 0.9667
  tolerance: 0.0005
- id: c3w4-power-results-mcq-figure-01
