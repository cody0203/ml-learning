    - f: 0.420*exp(-0.5*((x-70)/0.949)^2)
      label: true mean 70
      color: '#2563eb'
    areas:
    - f: 0.420*exp(-0.5*((x-70)/0.949)^2)
      from: 68.26
      to: 73
      color: '#bfdbfe'
    xLabel: sample mean
    yLabel: density
  options:
  - vi: Power
    en: Power
  - vi: Type I error
    en: Type I error
  - vi: Confidence level
    en: Confidence level
  answer:
  - 0
