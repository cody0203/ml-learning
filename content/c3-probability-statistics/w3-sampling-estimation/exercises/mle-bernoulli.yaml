- 'id': 'c3w3-bern-parsons-01'
  'topic': 'mle-bernoulli'
  'type': 'parsons'
  'difficulty': 2
  'tags':
  - 'derivation'
  'prompt':
    'vi': 'Sắp xếp derivation MLE Bernoulli.'
    'en': 'Order the Bernoulli MLE derivation.'
  'explanation':
    'vi': 'Log rồi đạo hàm để tìm maximum.'
    'en': 'Take logs then derivative to find maximum.'
  'hints': []
  'steps':
  - 'vi': 'Viết $L(p)=p^k(1-p)^{n-k}$.'
    'en': 'Write $L(p)=p^k(1-p)^{n-k}$.'
  - 'vi': 'Lấy log: $\ell(p)=k\log p+(n-k)\log(1-p)$.'
    'en': 'Take log: $\ell(p)=k\log p+(n-k)\log(1-p)$.'
  - 'vi': 'Giải $k/p-(n-k)/(1-p)=0$.'
    'en': 'Solve $k/p-(n-k)/(1-p)=0$.'
  - 'vi': 'Kết luận $\hat p=k/n$.'
    'en': 'Conclude $\hat p=k/n$.'
- 'id': 'c3w3-bern-code-ll-01'
  'topic': 'mle-bernoulli'
  'type': 'code'
  'difficulty': 2
  'tags':
  - 'code'
  - 'log-likelihood'
  'prompt':
    'vi': 'Cài `bernoulli_loglik(x,p)` trả log-likelihood, dùng log và kiểm tra $0<p<1$.'
    'en': 'Implement `bernoulli_loglik(x,p)` returning log-likelihood, using logs and checking $0<p<1$.'
  'explanation':
    'vi': 'Cộng log tránh underflow.'
    'en': 'Sum logs to avoid underflow.'
  'hints': []
  'starter': "import numpy as np\ndef bernoulli_loglik(x,p):\n    return 0.0\n"
  'solution': "import numpy as np\ndef bernoulli_loglik(x,p):\n    if not (0 < p < 1):\n        return -np.inf\n    x=np.asarray(x,dtype=float)\n    return float(np.sum(x*np.log(p)+(1-x)*np.log(1-p)))\n"
  'tests': "import numpy as np\ndef test_loglik_value():\n    x=np.array([1,1,0])\n    expected=2*np.log(0.7)+np.log(0.3)\n    assert abs(bernoulli_loglik(x,0.7)-expected)<1e-12\ndef test_bad_p():\n    assert bernoulli_loglik([1,0],1.0)==-np.inf\n"
