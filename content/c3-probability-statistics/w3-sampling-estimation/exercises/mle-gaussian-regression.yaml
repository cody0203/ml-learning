'exercises':
- 'id': 'c3w3-gauss-numeric-01'
  'topic': 'mle-gaussian-regression'
  'type': 'numeric'
  'difficulty': 1
  'tags':
  - 'gaussian-mle'
  'prompt':
    'vi': 'Với data $-1,1$, Gaussian MLE mean và variance là gì?'
    'en': 'For data $-1,1$, what are Gaussian MLE mean and variance?'
  'explanation':
    'vi': 'Mean $0$, MLE variance $((1)^2+(-1)^2)/2=1$.'
    'en': 'Mean $0$, MLE variance $((1)^2+(-1)^2)/2=1$.'
  'hints': []
  'answers':
  - 'label': 'mu'
    'value': 0
  - 'label': 'sigma2'
    'value': 1
  'tolerance': 1.0e-09
- 'id': 'c3w3-gauss-code-01'
  'topic': 'mle-gaussian-regression'
  'type': 'code'
  'difficulty': 2
  'tags':
  - 'code'
  - 'gaussian-mle'
  'prompt':
    'vi': 'Cài `gaussian_mle(x)` trả `(mu, sigma2_mle)` với variance chia $n$.'
    'en': 'Implement `gaussian_mle(x)` returning `(mu, sigma2_mle)` with variance divided by $n`.'
  'explanation':
    'vi': 'Gaussian MLE variance khác sample variance không chệch.'
    'en': 'Gaussian MLE variance differs from unbiased sample variance.'
  'hints': []
  'starter': "import numpy as np\ndef gaussian_mle(x):\n    return (0.0,0.0)\n"
  'solution': "import numpy as np\ndef gaussian_mle(x):\n    x=np.asarray(x,dtype=float)\n    mu=float(x.mean())\n    sig2=float(np.mean((x-mu)**2))\n    return (mu,sig2)\n"
  'tests': "def test_two_points():\n    mu,s2=gaussian_mle([-1,1]); assert abs(mu)<1e-12 and abs(s2-1)<1e-12\ndef test_three_points():\n    mu,s2=gaussian_mle([1,2,3]); assert abs(mu-2)<1e-12 and abs(s2-(2/3))<1e-12\n"
- 'id': 'c3w3-gauss-mcq-figure-01'
  'topic': 'mle-gaussian-regression'
  'type': 'mcq'
  'difficulty': 2
  'tags':
  - 'figure'
  - 'likelihood'
  'prompt':
    'vi': 'Quan sát ở $-1$ và $1$. Gaussian mean nào hợp lý nhất nếu variance cố định?'
    'en': 'Observations at $-1$ and $1$. Which Gaussian mean is most plausible if variance is fixed?'
  'explanation':
    'vi': 'Mean sample là 0, nên Gaussian tâm 0 cho likelihood cao nhất.'
    'en': 'The sample mean is 0, so center 0 gives highest likelihood.'
  'hints': []
  'figure':
    'xRange':
    - -4
    - 4
    'yRange':
    - 0
    - 0.45
    'functions':
    - 'f': '0.399*exp(-0.5*(x+1)^2)'
      'label': 'mu=-1'
      'color': '#94a3b8'
    - 'f': '0.399*exp(-0.5*x^2)'
      'label': 'mu=0'
      'color': '#2563eb'
    - 'f': '0.399*exp(-0.5*(x-1)^2)'
      'label': 'mu=1'
      'color': '#94a3b8'
    'points':
    - 'at':
      - -1
      - 0
      'label': 'x1'
    - 'at':
      - 1
      - 0
      'label': 'x2'
  'options':
  - 'vi': '$\mu=0$'
    'en': '$\mu=0$'
  - 'vi': '$\mu=-1$'
    'en': '$\mu=-1$'
  - 'vi': '$\mu=1$'
    'en': '$\mu=1$'
  'answer':
  - 0
