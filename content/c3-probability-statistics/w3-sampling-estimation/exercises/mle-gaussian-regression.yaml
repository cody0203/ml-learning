- 'id': 'c3w3-regression-parsons-01'
  'topic': 'mle-gaussian-regression'
  'type': 'parsons'
  'difficulty': 2
  'tags':
  - 'procedure'
  'prompt':
    'vi': 'Sắp xếp đường nối likelihood → least squares.'
    'en': 'Order the path from likelihood to least squares.'
  'explanation':
    'vi': 'Log biến tích thành tổng, dấu âm biến maximum thành minimum.'
    'en': 'Log turns products into sums, negative sign turns maximum into minimum.'
  'hints': []
  'steps':
  - 'vi': 'Giả định residuals Gaussian độc lập.'
    'en': 'Assume independent Gaussian residuals.'
  - 'vi': 'Viết likelihood là tích các densities.'
    'en': 'Write likelihood as product of densities.'
  - 'vi': 'Lấy log-likelihood.'
    'en': 'Take log-likelihood.'
  - 'vi': 'Bỏ constants và maximize $-\frac12\sum d_i^2$.'
    'en': 'Drop constants and maximize $-\frac12\sum d_i^2$.'
  - 'vi': 'Tương đương minimize $\sum d_i^2$.'
    'en': 'Equivalent to minimizing $\sum d_i^2$.'
- 'id': 'c3w3-gauss-tf-01'
  'topic': 'mle-gaussian-regression'
  'type': 'true-false'
  'difficulty': 1
  'tags':
  - 'variance'
  'prompt':
    'vi': 'Phương sai MLE của Gaussian chia cho $n$, còn phương sai mẫu không chệch chia cho $n-1$.'
    'en': 'Gaussian MLE variance divides by $n$, while unbiased sample variance divides by $n-1$.'
  'explanation':
    'vi': 'Đúng: hai mục tiêu khác nhau.'
    'en': 'True: the objectives differ.'
  'hints': []
  'answer': true
