- 'id': 'c3w3-regression-finderror-01'
  'topic': 'mle-gaussian-regression'
  'type': 'find-error'
  'difficulty': 2
  'tags':
  - 'common-mistake'
  'prompt':
    'vi': 'Tìm lỗi đầu tiên khi nối MLE với least squares.'
    'en': 'Find the first error connecting MLE to least squares.'
  'explanation':
    'vi': 'Với Gaussian residual, maximize likelihood tương đương minimize SSE, không maximize SSE.'
    'en': 'With Gaussian residuals, maximize likelihood equals minimize SSE, not maximize SSE.'
  'hints': []
  'steps':
  - 'vi': 'Residuals $d_i=y_i-(mx_i+b)$.'
    'en': 'Residuals $d_i=y_i-(mx_i+b)$.'
  - 'vi': 'Likelihood chứa $\exp(-\frac12\sum d_i^2)$.'
    'en': 'Likelihood contains $\exp(-\frac12\sum d_i^2)$.'
  - 'vi': 'Vì exponential tăng khi $\sum d_i^2$ tăng, ta maximize SSE.'
    'en': 'Because exponential increases as $\sum d_i^2$ increases, maximize SSE.'
  'answer': 2
- 'id': 'c3w3-regression-matching-01'
