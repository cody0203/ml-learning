    'en': 'A model has coefficients $4,-9,-2,3,-6,-10$. What is the $L_2$ penalty (without $\lambda$)?'
  'explanation':
    'vi': 'Tổng bình phương: $16+81+4+9+36+100=246$.'
    'en': 'Sum of squares: $16+81+4+9+36+100=246$.'
  'hints': []
  'answers':
  - 'value': 246
  'tolerance': 0
