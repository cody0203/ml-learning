  'type': 'mcq'
  'difficulty': 1
  'tags':
  - 'concept'
  'prompt':
    'vi': 'Bayesian posterior tỉ lệ với gì?'
    'en': 'Bayesian posterior is proportional to what?'
  'explanation':
    'vi': 'Posterior $\propto$ likelihood $\times$ prior.'
    'en': 'Posterior $\propto$ likelihood $\times$ prior.'
  'hints': []
  'options':
  - 'vi': 'Likelihood $\times$ prior'
    'en': 'Likelihood $\times$ prior'
  - 'vi': 'Likelihood $+$ sample mean'
    'en': 'Likelihood $+$ sample mean'
  - 'vi': 'Prior / likelihood'
    'en': 'Prior / likelihood'
  'answer':
  - 0
- 'id': 'c3w3-bayes-figure-01'
  'topic': 'bayesian-regularization'
  'type': 'mcq'
  'difficulty': 2
  'tags':
  - 'figure'
  - 'prior-posterior'
  'prompt':
    'vi': 'Hình nào hợp lý cho prior uniform và posterior sau 8 heads/2 tails?'
    'en': 'Which plot is plausible for a uniform prior and posterior after 8 heads/2 tails?'
  'explanation':
    'vi': 'Posterior tập trung gần $p=0.8$ hơn prior phẳng.'
    'en': 'Posterior concentrates near $p=0.8$ more than the flat prior.'
  'hints': []
  'figure':
    'xRange':
    - 0
    - 1
    'yRange':
    - 0
    - 4
    'functions':
    - 'f': '1'
      'label': 'prior'
      'color': '#94a3b8'
      'dashed': true
    - 'f': '3.5*x^8*(1-x)^2/0.006'
      'label': 'posterior shape'
      'color': '#2563eb'
    'xLabel': 'p'
    'yLabel': 'density (scaled)'
  'options':
  - 'vi': 'Posterior peaked near high $p$'
    'en': 'Posterior peaked near high $p$'
  - 'vi': 'Posterior flat exactly like prior'
    'en': 'Posterior flat exactly like prior'
  'answer':
  - 0
- 'id': 'c3w3-map-numeric-01'
  'topic': 'bayesian-regularization'
  'type': 'numeric'
  'difficulty': 2
  'tags':
  - 'map'
  'prompt':
    'vi': 'Beta$(2,2)$ prior, 8 heads/2 tails. MAP nội điểm là bao nhiêu?'
    'en': 'Beta$(2,2)$ prior, 8 heads/2 tails. What is the interior MAP?'
  'explanation':
    'vi': 'Posterior Beta$(10,4)$; MAP $(10-1)/(10+4-2)=9/12=0.75$.'
    'en': 'Posterior Beta$(10,4)$; MAP $(10-1)/(10+4-2)=9/12=0.75$.'
  'hints': []
  'answers':
  - 'value': 0.75
  'tolerance': 1.0e-09
- 'id': 'c3w3-map-code-01'
  'topic': 'bayesian-regularization'
  'type': 'code'
  'difficulty': 2
  'tags':
  - 'code'
  - 'map'
  'prompt':
    'vi': 'Cài `beta_bernoulli_map(alpha,beta,k,n)` cho interior MAP.'
    'en': 'Implement `beta_bernoulli_map(alpha,beta,k,n)` for the interior MAP.'
  'explanation':
    'vi': 'Công thức $(alpha+k-1)/(alpha+beta+n-2)$.'
    'en': 'Formula $(alpha+k-1)/(alpha+beta+n-2)$.'
  'hints': []
  'starter': "def beta_bernoulli_map(alpha,beta,k,n):\n    return 0.0\n"
  'solution': "def beta_bernoulli_map(alpha,beta,k,n):\n    return (alpha+k-1)/(alpha+beta+n-2)\n"
  'tests': "def test_beta_22():\n    assert abs(beta_bernoulli_map(2,2,8,10)-0.75)<1e-12\ndef test_uniform_matches_mle():\n    assert abs(beta_bernoulli_map(1,1,8,10)-0.8)<1e-12\n"
- 'id': 'c3w3-bayes-finderror-01'
  'topic': 'bayesian-regularization'
  'type': 'find-error'
  'difficulty': 2
  'tags':
  - 'common-mistake'
  'prompt':
    'vi': 'Tìm lỗi đầu tiên trong Bayesian update.'
    'en': 'Find first error in the Bayesian update.'
  'explanation':
    'vi': 'MAP bằng MLE chỉ khi prior constant/non-informative phù hợp.'
    'en': 'MAP equals MLE only when the prior is suitably constant/non-informative.'
  'hints': []
  'steps':
  - 'vi': 'Posterior tỉ lệ likelihood nhân prior.'
    'en': 'Posterior is proportional to likelihood times prior.'
  - 'vi': 'MAP maximize posterior.'
    'en': 'MAP maximizes posterior.'
  - 'vi': 'Vì vậy MAP luôn bằng MLE với mọi prior.'
    'en': 'Therefore MAP always equals MLE for every prior.'
  'answer': 2
- 'id': 'c3w3-reg-numeric-01'
