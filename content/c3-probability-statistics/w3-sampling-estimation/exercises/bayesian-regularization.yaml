- 'id': 'c3w3-bayes-parsons-01'
  'topic': 'bayesian-regularization'
  'type': 'parsons'
  'difficulty': 2
  'tags':
  - 'procedure'
  'prompt':
    'vi': 'Sắp xếp Bayesian update.'
    'en': 'Order the Bayesian update.'
  'explanation':
    'vi': 'Prior kết hợp likelihood rồi chuẩn hóa.'
    'en': 'Prior combines with likelihood then normalizes.'
  'hints': []
  'steps':
  - 'vi': 'Chọn prior $p(\theta)$.'
    'en': 'Choose prior $p(\theta)$.'
  - 'vi': 'Viết likelihood $p(x\mid\theta)$.'
    'en': 'Write likelihood $p(x\mid\theta)$.'
  - 'vi': 'Nhân likelihood với prior.'
    'en': 'Multiply likelihood by prior.'
  - 'vi': 'Chia normalizing constant nếu cần posterior chuẩn hóa.'
    'en': 'Divide by normalizing constant if a normalized posterior is needed.'
  - 'vi': 'MAP lấy argmax posterior.'
    'en': 'MAP takes the posterior argmax.'
- 'id': 'c3w3-bayes-multi-01'
  'topic': 'bayesian-regularization'
  'type': 'multi-step'
  'difficulty': 3
  'tags':
  - 'regularization'
  'prompt':
    'vi': 'Polynomial models có data loss: model1=10, model2=2, model3=0.1; L2 penalties: 16,20,246; $\lambda=1$.'
    'en': 'Polynomial models have data losses: model1=10, model2=2, model3=0.1; L2 penalties: 16,20,246; $\lambda=1$.'
  'explanation':
    'vi': 'Regularized loss = data loss + penalty.'
    'en': 'Regularized loss = data loss + penalty.'
  'hints': []
  'parts':
  - 'type': 'numeric'
    'prompt':
      'vi': 'Regularized loss của model2?'
      'en': 'Regularized loss of model2?'
    'answers':
    - 'value': 22
    'tolerance': 0
    'explanation':
      'vi': '$2+20=22$.'
      'en': '$2+20=22$.'
  - 'type': 'mcq'
    'prompt':
      'vi': 'Model nào có regularized loss nhỏ nhất?'
      'en': 'Which model has smallest regularized loss?'
    'options':
    - 'vi': 'Model1: 26'
      'en': 'Model1: 26'
    - 'vi': 'Model2: 22'
      'en': 'Model2: 22'
    - 'vi': 'Model3: 246.1'
      'en': 'Model3: 246.1'
    'answer':
    - 1
    'explanation':
      'vi': 'Model2 cân bằng fit và complexity tốt nhất.'
      'en': 'Model2 best balances fit and complexity.'
- 'id': 'c3w3-bayes-tf-01'
  'topic': 'bayesian-regularization'
  'type': 'true-false'
  'difficulty': 1
  'tags':
  - 'regularization'
  'prompt':
    'vi': 'Gaussian prior tâm 0 trên coefficients dẫn đến penalty tổng bình phương coefficients trong negative log posterior.'
    'en': 'A zero-centered Gaussian prior on coefficients leads to a sum-of-squares coefficient penalty in the negative log posterior.'
  'explanation':
    'vi': 'Log của Gaussian prior chứa $-a_j^2/2$, nên khi minimize negative log posterior sẽ có $+a_j^2$ penalty.'
    'en': 'The log Gaussian prior contains $-a_j^2/2$, so minimizing negative log posterior adds a $+a_j^2$ penalty.'
  'hints': []
  'answer': true
