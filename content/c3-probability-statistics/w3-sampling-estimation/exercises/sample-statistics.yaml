- 'id': 'c3w3-stats-finderror-01'
  'topic': 'sample-statistics'
  'type': 'find-error'
  'difficulty': 2
  'tags':
  - 'common-mistake'
  'prompt':
    'vi': 'Tìm lỗi đầu tiên khi ước lượng variance population từ sample $2,3,4,5,6$.'
    'en': 'Find the first error estimating population variance from sample $2,3,4,5,6$.'
  'explanation':
    'vi': 'Khi dùng sample variance để estimate population variance, chia $n-1$, không chia $n$.'
    'en': 'For sample variance estimating population variance, divide by $n-1$, not $n$.'
  'hints': []
  'steps':
  - 'vi': '$\bar x=4$.'
    'en': '$\bar x=4$.'
  - 'vi': '$\sum(x_i-\bar x)^2=10$.'
    'en': '$\sum(x_i-\bar x)^2=10$.'
  - 'vi': '$s^2=10/5=2$.'
    'en': '$s^2=10/5=2$.'
  'answer': 2
- 'id': 'c3w3-stats-code-01'
  'topic': 'sample-statistics'
  'type': 'code'
  'difficulty': 2
  'tags':
  - 'code'
  - 'variance'
  'prompt':
    'vi': 'Cài `sample_variance(x)` chia cho $n-1$, không dùng `np.var`.'
    'en': 'Implement `sample_variance(x)` dividing by $n-1$, without `np.var`.'
  'explanation':
    'vi': 'Tính mean, bình phương độ lệch, rồi chia $n-1$.'
    'en': 'Compute mean, squared deviations, then divide by $n-1$.'
  'hints': []
  'starter': "import numpy as np\ndef sample_variance(x):\n    return 0.0\n"
  'solution': "import numpy as np\ndef sample_variance(x):\n    x=np.asarray(x,dtype=float)\n    m=x.mean()\n    return float(np.sum((x-m)**2)/(len(x)-1))\n"
  'tests': "import numpy as np\ndef test_five_values():\n    assert abs(sample_variance(np.array([2,3,4,5,6]))-2.5)<1e-9\ndef test_two_values():\n    assert abs(sample_variance([1,3])-2.0)<1e-9\n"
- 'id': 'c3w3-stats-mcq-01'
  'topic': 'sample-statistics'
  'type': 'mcq'
  'difficulty': 1
  'tags':
  - 'proportion'
  'prompt':
    'vi': 'Trong sample 6 người có 2 người sở hữu xe đạp. $\hat p$ là gì?'
    'en': 'In a sample of 6 people, 2 own a bicycle. What is $\hat p$?'
  'explanation':
    'vi': '$\hat p=2/6=0.333$.'
    'en': '$\hat p=2/6=0.333$.'
  'hints': []
  'options':
  - 'vi': '$2/6$'
    'en': '$2/6$'
  - 'vi': '$6/2$'
    'en': '$6/2$'
  - 'vi': '$2/10$'
    'en': '$2/10$'
  'answer':
  - 0
- 'id': 'c3w3-stats-tf-01'
