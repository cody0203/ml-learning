- 'id': 'c3w3-clt-parsons-01'
  'topic': 'clt'
  'type': 'parsons'
  'difficulty': 2
  'tags':
  - 'procedure'
  'prompt':
    'vi': 'Sắp xếp cách dùng CLT cho sample mean.'
    'en': 'Order how to use CLT for a sample mean.'
  'explanation':
    'vi': 'Cần mean, variance, standard error rồi chuẩn hóa.'
    'en': 'Need mean, variance, standard error, then standardize.'
  'hints': []
  'steps':
  - 'vi': 'Xác định $\mu$ và $\sigma^2$ của một quan sát.'
    'en': 'Identify $\mu$ and $\sigma^2$ of one observation.'
  - 'vi': 'Tính $\mathrm{Var}(\bar X)=\sigma^2/n$.'
    'en': 'Compute $\mathrm{Var}(\bar X)=\sigma^2/n$.'
  - 'vi': 'Chuẩn hóa bằng $(\bar X-\mu)/(\sigma/\sqrt n)$.'
    'en': 'Standardize with $(\bar X-\mu)/(\sigma/\sqrt n)$.'
