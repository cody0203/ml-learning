exercises:
- id: c3w2-joint-continuous-mcq-01
  topic: joint-continuous
  type: mcq
  difficulty: 1
  tags:
  - concept
  prompt:
    vi: Chọn phát biểu đúng nhất về joint-continuous.
    en: Choose the best statement about joint-continuous.
  explanation:
    vi: Đáp án đúng dùng đúng định nghĩa trong bối cảnh của chủ đề.
    en: For continuous pairs, probability is volume under a density surface over a region, not the density at one point.
  hints: []
  options:
  - vi: Xác suất cho biến liên tục hai chiều là thể tích dưới density trên một vùng.
    en: Probability for two continuous variables is volume under the density over a region.
  - vi: Density tại một điểm chính là xác suất đúng tại điểm đó.
    en: The density at a point is the probability of landing exactly at that point.
  - vi: Joint PDF không cần không âm miễn tích phân bằng 1.
    en: A joint PDF need not be nonnegative as long as it integrates to 1.
  - vi: Tích phân theo hình chữ nhật luôn bằng chiều rộng cộng chiều cao.
    en: An integral over a rectangle always equals width plus height.
  answer:
  - 0
  figure:
    xRange:
    - -4
    - 4
    yRange:
    - 0
    - 0.45
    functions:
    - f: 0.3989*exp(-x^2/2)
      label: standard normal
    areas:
    - f: 0.3989*exp(-x^2/2)
      from: -1
      to: 1
      color: '#bfdbfe'
    xLabel: z
    yLabel: density
- id: c3w2-joint-continuous-tf-02
  topic: joint-continuous
  type: true-false
  difficulty: 1
  tags:
  - misconception
  prompt:
    vi: 'Phát biểu: phải kiểm tra điều kiện trước khi dùng công thức xác suất/thống kê.'
    en: 'Statement: for continuous random variables, $P(X=x,Y=y)$ is usually zero at a single exact point.'
  explanation:
    vi: 'Đúng: cùng ký hiệu có thể có công thức rời rạc, liên tục, dữ liệu mẫu hoặc tổng thể.'
    en: 'True: probabilities come from integrating over an area; a point has no area under an ordinary density.'
  hints: []
  answer: true
  reasons:
  - vi: Với biến liên tục, vùng có diện tích 0 thường có xác suất 0.
    en: For continuous variables, a zero-area region usually has probability 0.
  - vi: Density tại điểm luôn bằng xác suất tại điểm đó.
    en: Density at a point always equals probability at that point.
  - vi: Tích phân PDF trên toàn mặt phẳng có thể bằng 2.
    en: The integral of a PDF over the whole plane may equal 2.
  reasonAnswer: 0
- id: c3w2-joint-continuous-matching-03
  topic: joint-continuous
  type: matching
  difficulty: 1
  tags:
  - matching
  prompt:
    vi: Ghép khái niệm cho joint-continuous.
    en: Match concepts for joint-continuous.
  explanation:
    vi: Các cặp phân biệt định nghĩa, công thức và diễn giải.
    en: The matching distinguishes density height, rectangular probability, and the unit-volume requirement.
  hints: []
  pairs:
  - left:
      vi: Mean / kỳ vọng
      en: Mean / expectation
    right:
      vi: Trung bình có trọng số
      en: Weighted average
  - left:
      vi: Variance
      en: Variance
    right:
      vi: Độ phân tán bình phương quanh mean
      en: Squared spread around mean
  - left:
      vi: Conditional
      en: Conditional
    right:
      vi: Chuẩn hóa một lát cắt
      en: Renormalized slice
  - left:
      vi: Correlation
      en: Correlation
    right:
      vi: Covariance đã chuẩn hóa
      en: Standardized covariance
- id: c3w2-joint-continuous-parsons-04
  topic: joint-continuous
  type: parsons
  difficulty: 2
  tags:
  - procedure
  prompt:
    vi: Sắp xếp quy trình giải cho joint-continuous.
    en: Order the solution workflow for joint-continuous.
  explanation:
    vi: Thứ tự đúng bắt đầu bằng xác định dữ liệu, rồi công thức, rồi tính và diễn giải.
    en: A continuous joint problem starts by identifying the region of the plane before setting up the double integral.
  hints:
  - vi: Đừng tính trước khi biết đang cần đại lượng nào.
    en: Do not compute before knowing the target quantity.
  steps:
  - vi: Xác định biến, dữ liệu và loại phân phối.
    en: Identify variables, data, and distribution type.
  - vi: Chọn công thức phù hợp với rời rạc/liên tục/mẫu.
    en: Choose the formula matching discrete/continuous/sample setting.
  - vi: Thay số cẩn thận và tính toán.
    en: Substitute values carefully and compute.
  - vi: Kiểm tra đơn vị, dấu và ý nghĩa.
    en: Check units, sign, and meaning.
- id: c3w2-joint-continuous-numeric-05
  topic: joint-continuous
  type: numeric
  difficulty: 1
  tags:
  - calculation
  prompt:
    vi: Uniform density on rectangle [0,2]×[0,3]. What is the density height?
    en: Uniform density on rectangle [0,2]×[0,3]. What is the density height?
  explanation:
    vi: Total volume must be 1, area is 6, so density is 1/6.
    en: Total volume must be 1, area is 6, so density is 1/6.
  hints: []
  answers:
  - value: 0.16666666666666666
  tolerance: 0.001
- id: c3w2-joint-continuous-find-error-06
  topic: joint-continuous
  type: find-error
  difficulty: 2
  tags:
  - error
  prompt:
    vi: Tìm lỗi đầu tiên trong lời giải về joint-continuous.
    en: Find the first error in this joint-continuous solution.
  explanation:
    vi: Bước sai áp dụng một điều kiện không được đảm bảo.
    en: The wrong step treats a density value like a probability mass; for continuous variables the region matters.
  hints:
  - vi: Độc lập phải được cho hoặc chứng minh.
    en: Independence must be stated or proven.
  steps:
  - vi: Gọi dữ liệu/PMF đã cho là đối tượng cần phân tích.
    en: Let the given data/PMF be the object to analyze.
  - vi: Viết công thức tổng quát trước khi thay số.
    en: Write the general formula before substituting.
  - vi: Giả sử các biến độc lập chỉ vì chúng có hai tên khác nhau.
    en: Assume the variables are independent just because they have two different names.
  - vi: Tiếp tục dùng công thức tích để ra kết quả.
    en: Continue using the product formula to get the result.
  answer: 2
- id: c3w2-joint-continuous-multi-07
  topic: joint-continuous
  type: multi-step
  difficulty: 2
  tags:
  - word-problem
  prompt:
    vi: Bài nhiều bước về joint-continuous.
    en: Multi-step problem about joint-continuous.
  explanation:
    vi: Giải từng phần giúp tách tâm, độ phân tán và diễn giải.
    en: The parts contrast an easy mean calculation with a spread calculation so the role of a density is not blurred.
  hints:
  - vi: Tính mean trước, rồi khoảng cách tới mean.
    en: Compute mean first, then deviations from it.
  parts:
  - type: numeric
    prompt:
      vi: Dữ liệu 2, 4, 6. Mean là bao nhiêu?
      en: Data 2, 4, 6. What is the mean?
    answers:
    - value: 4
  - type: numeric
    prompt:
      vi: Phương sai tổng thể của 2, 4, 6 là bao nhiêu?
      en: What is the population variance of 2, 4, 6?
    answers:
    - value: 2.6666666666666665
    tolerance: 0.001
  - type: mcq
    prompt:
      vi: Dữ liệu có lệch phải mạnh không?
      en: Is the data strongly right-skewed?
    options:
    - vi: Không, nó đối xứng quanh 4.
      en: No; in this toy list the distances below and above 4 match.
    - vi: Có, vì mean lớn.
      en: Yes; a larger center automatically implies a long right tail.
    answer:
    - 0
