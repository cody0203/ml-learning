- id: c3w2-covariance-code-07
  topic: covariance
  type: code
  difficulty: 3
  tags:
  - code
  prompt:
    vi: Cài đặt `cov_corr` từ đầu; không dùng shortcut một dòng của thư viện.
    en: Implement `cov_corr` from scratch; avoid one-line library shortcuts.
  explanation:
    vi: Lời giải duyệt dữ liệu rõ ràng và kiểm tra edge cases.
    en: The code computes population covariance from centered pairs and then divides by the two population standard deviations.
  hints:
  - vi: Viết công thức trước rồi chuyển thành vòng lặp/NumPy cơ bản.
    en: Write the formula first, then turn it into loops/basic NumPy.
  starter: "def cov_corr(x,y):\n    return None\n"
  solution: "def cov_corr(x,y):\n    n=len(x); mx=sum(x)/n; my=sum(y)/n\n    cov=sum((x[i]-mx)*(y[i]-my) for i in range(n))/n\n\
    \    vx=sum((a-mx)**2 for a in x)/n; vy=sum((b-my)**2 for b in y)/n\n    return cov, cov/(vx**0.5*vy**0.5)\n"
  tests: "def test_positive():\n    c,r=cov_corr([1,2,3],[2,4,6])\n    assert abs(c-4/3)<1e-9 and abs(r-1)<1e-9\ndef test_negative():\n\
    \    c,r=cov_corr([1,2,3],[3,2,1])\n    assert c < 0 and abs(r+1)<1e-9\n"
