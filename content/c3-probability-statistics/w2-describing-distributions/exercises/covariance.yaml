exercises:
- id: c3w2-covariance-mcq-01
  topic: covariance
  type: mcq
  difficulty: 1
  tags:
  - concept
  prompt:
    vi: Chọn phát biểu đúng nhất về covariance.
    en: Choose the best statement about covariance.
  explanation:
    vi: Đáp án đúng dùng đúng định nghĩa trong bối cảnh của chủ đề.
    en: Covariance is positive when centered variables tend to share signs and negative when their signs tend to differ.
  hints: []
  options:
  - vi: Các điểm cùng tăng so với mean tạo covariance dương.
    en: Paired points that rise together above their means create positive covariance.
  - vi: Covariance gần 0 chứng minh hai biến độc lập tuyệt đối.
    en: Near-zero covariance proves the two variables are fully independent.
  - vi: Correlation giữ nguyên đơn vị như covariance.
    en: Correlation keeps the same units as covariance.
  - vi: Ma trận covariance có covariance trên đường chéo chính.
    en: A covariance matrix puts covariances on the main diagonal.
  answer:
  - 0
  figure:
    xRange:
    - 0
    - 5
    yRange:
    - 0
    - 5
    points:
    - at:
      - 1
      - 1
    - at:
      - 2
      - 2
    - at:
      - 3
      - 3
    - at:
      - 4
      - 4
    xLabel: X
    yLabel: Y
- id: c3w2-covariance-tf-02
  topic: covariance
  type: true-false
  difficulty: 1
  tags:
  - misconception
  prompt:
    vi: 'Phát biểu: phải kiểm tra điều kiện trước khi dùng công thức xác suất/thống kê.'
    en: 'Statement: covariance depends on measurement units, but correlation rescales it to a unitless value.'
  explanation:
    vi: 'Đúng: cùng ký hiệu có thể có công thức rời rạc, liên tục, dữ liệu mẫu hoặc tổng thể.'
    en: 'True: dividing by $\sigma_X\sigma_Y$ removes the units and bounds the result between $-1$ and $1$.'
  hints: []
  answer: true
  reasons:
  - vi: Correlation chia covariance cho tích hai độ lệch chuẩn.
    en: Correlation divides covariance by the product of the two standard deviations.
  - vi: Correlation vẫn đo bằng inch-năm nếu covariance dùng inch và năm.
    en: Correlation is still measured in inch-years if covariance uses inches and years.
  - vi: Covariance và correlation luôn bằng nhau về số trị.
    en: Covariance and correlation are always numerically identical.
  reasonAnswer: 0
