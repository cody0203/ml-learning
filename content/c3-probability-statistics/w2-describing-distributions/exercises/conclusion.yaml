- id: c3w2-conclusion-code-07
  topic: conclusion
  type: code
  difficulty: 3
  tags:
  - code
  prompt:
    vi: Cài đặt `standardize` từ đầu; không dùng shortcut một dòng của thư viện.
    en: Implement `standardize` from scratch; avoid one-line library shortcuts.
  explanation:
    vi: Lời giải duyệt dữ liệu rõ ràng và kiểm tra edge cases.
    en: Standardization is checked by requiring zero mean and unit population variance on a concrete three-value list.
  hints:
  - vi: Viết công thức trước rồi chuyển thành vòng lặp/NumPy cơ bản.
    en: Write the formula first, then turn it into loops/basic NumPy.
  starter: "def standardize(x):\n    return x\n"
  solution: "def standardize(x):\n    n=len(x); m=sum(x)/n; var=sum((a-m)**2 for a in x)/n; s=var**0.5\n    return [(a-m)/s\
    \ for a in x]\n"
  tests: "def test_standardize():\n    z=standardize([2,4,6])\n    assert abs(sum(z)) < 1e-9\n    assert abs(sum(v*v for v\
    \ in z)/len(z)-1) < 1e-9\n"
