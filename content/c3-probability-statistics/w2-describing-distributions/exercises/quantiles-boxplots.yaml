exercises:
- id: c3w2-quantiles-boxplots-mcq-01
  topic: quantiles-boxplots
  type: mcq
  difficulty: 1
  tags:
  - concept
  prompt:
    vi: Chọn phát biểu đúng nhất về quantiles-boxplots.
    en: Choose the best statement about quantiles-boxplots.
  explanation:
    vi: Đáp án đúng dùng đúng định nghĩa trong bối cảnh của chủ đề.
    en: Quantiles are order-based cut points, while box plots turn the quartiles into a compact shape summary.
  hints: []
  options:
  - vi: Box plot dùng $Q_1$, median, $Q_3$ và whisker để tóm tắt hình dạng.
    en: A box plot uses $Q_1$, the median, $Q_3$, and whiskers to summarize shape.
  - vi: $Q_1$ luôn bằng giá trị nhỏ nhất của dữ liệu đã sắp xếp.
    en: $Q_1$ is always the smallest value in the sorted data.
  - vi: IQR bằng mean trừ median.
    en: The IQR equals the mean minus the median.
  - vi: QQ plot so sánh dữ liệu với histogram, không dùng phân vị.
    en: A QQ plot compares data with a histogram and does not use quantiles.
  answer:
  - 0
- id: c3w2-quantiles-boxplots-tf-02
  topic: quantiles-boxplots
  type: true-false
  difficulty: 1
  tags:
  - misconception
  prompt:
    vi: 'Phát biểu: phải kiểm tra điều kiện trước khi dùng công thức xác suất/thống kê.'
    en: 'Statement: the interquartile range is $Q_3-Q_1$, not max minus min.'
  explanation:
    vi: 'Đúng: cùng ký hiệu có thể có công thức rời rạc, liên tục, dữ liệu mẫu hoặc tổng thể.'
    en: 'True: IQR measures the middle half of the data, whereas max minus min measures the full range.'
  hints: []
  answer: true
  reasons:
  - vi: IQR chỉ đo nửa giữa nên bỏ qua min và max trực tiếp.
    en: IQR measures the middle half and does not directly use min and max.
  - vi: IQR là khoảng cách từ min đến max.
    en: IQR is the distance from the minimum to the maximum.
  - vi: Median luôn bằng $Q_3-Q_1$.
    en: The median always equals $Q_3-Q_1$.
  reasonAnswer: 0
- id: c3w2-quantiles-boxplots-matching-03
  topic: quantiles-boxplots
  type: matching
  difficulty: 1
  tags:
  - matching
  prompt:
    vi: Ghép khái niệm cho quantiles-boxplots.
    en: Match concepts for quantiles-boxplots.
  explanation:
    vi: Các cặp phân biệt định nghĩa, công thức và diễn giải.
    en: The pairs link median, quartiles, whiskers, and outlier fences to the visible parts of a box plot.
  hints: []
  pairs:
  - left:
      vi: Mean / kỳ vọng
      en: Mean / expectation
    right:
      vi: Trung bình có trọng số
      en: Weighted average
  - left:
      vi: Variance
      en: Variance
    right:
      vi: Độ phân tán bình phương quanh mean
      en: Squared spread around mean
  - left:
      vi: Conditional
      en: Conditional
    right:
      vi: Chuẩn hóa một lát cắt
      en: Renormalized slice
  - left:
      vi: Correlation
      en: Correlation
    right:
      vi: Covariance đã chuẩn hóa
      en: Standardized covariance
- id: c3w2-quantiles-boxplots-parsons-04
  topic: quantiles-boxplots
  type: parsons
  difficulty: 2
  tags:
  - procedure
  prompt:
    vi: Sắp xếp quy trình giải cho quantiles-boxplots.
    en: Order the solution workflow for quantiles-boxplots.
  explanation:
    vi: Thứ tự đúng bắt đầu bằng xác định dữ liệu, rồi công thức, rồi tính và diễn giải.
    en: For the slide's newspaper data, the sorted order is essential before reading $Q_1$, $Q_2$, and $Q_3$.
  hints:
  - vi: Đừng tính trước khi biết đang cần đại lượng nào.
    en: Do not compute before knowing the target quantity.
  steps:
  - vi: Xác định biến, dữ liệu và loại phân phối.
    en: Identify variables, data, and distribution type.
  - vi: Chọn công thức phù hợp với rời rạc/liên tục/mẫu.
    en: Choose the formula matching discrete/continuous/sample setting.
  - vi: Thay số cẩn thận và tính toán.
    en: Substitute values carefully and compute.
  - vi: Kiểm tra đơn vị, dấu và ý nghĩa.
    en: Check units, sign, and meaning.
- id: c3w2-quantiles-boxplots-numeric-05
  topic: quantiles-boxplots
  type: numeric
  difficulty: 1
  tags:
  - calculation
  prompt:
    vi: 'Sorted data 1,3,5,7,9: what is the 50% quantile/median?'
    en: 'Sorted data 1,3,5,7,9: what is the 50% quantile/median?'
  explanation:
    vi: The middle value is 5.
    en: The middle value is 5.
  hints: []
  answers:
  - value: 5
  tolerance: 0.001
- id: c3w2-quantiles-boxplots-construct-06
  topic: quantiles-boxplots
  type: construct
  difficulty: 2
  tags:
  - construct
  prompt:
    vi: Tạo 5 giá trị khác nhau có median 5 và range 10.
    en: Build 5 distinct values with median 5 and range 10.
  explanation:
    vi: Ví dụ mẫu thỏa tất cả ràng buộc; nhiều đáp án khác cũng đúng.
    en: The example ranges from 0 to 10, has middle value 5, and all five entries are distinct.
  hints:
  - vi: Kiểm tra từng constraint từ trái sang phải.
    en: Check constraints one by one.
  rows: 1
  cols: 5
  constraints:
  - kind: range
    value: 10
  - kind: median
    value: 5
  - kind: distinctValues
    min: 5
  example:
  - - 0
    - 3
    - 5
    - 7
    - 10
- id: c3w2-quantiles-boxplots-predict-07
  topic: quantiles-boxplots
  type: predict-output
  difficulty: 2
  tags:
  - numpy
  prompt:
    vi: Đoán output NumPy cho quantiles-boxplots.
    en: Predict the NumPy output for quantiles-boxplots.
  explanation:
    vi: Theo dõi axis, ddof và phép chuẩn hóa.
    en: '`np.quantile` sorts the five numbers and returns the middle entry for the 0.5 quantile.'
  hints: []
  code: 'import numpy as np

    x=np.array([1,3,5,7,9])

    print(np.quantile(x,0.5))'
  options:
  - '5.0'
  - '4.0'
  - '9.0'
  answer: 0
- id: c3w2-quantiles-boxplots-code-08
  topic: quantiles-boxplots
  type: code
  difficulty: 3
  tags:
  - code
  prompt:
    vi: Cài đặt `nearest_quantile` từ đầu; không dùng shortcut một dòng của thư viện.
    en: Implement `nearest_quantile` from scratch; avoid one-line library shortcuts.
  explanation:
    vi: Lời giải duyệt dữ liệu rõ ràng và kiểm tra edge cases.
    en: The nearest-rank helper sorts data and converts a percentile into an index, which is checked at the median and first quartile.
  hints:
  - vi: Viết công thức trước rồi chuyển thành vòng lặp/NumPy cơ bản.
    en: Write the formula first, then turn it into loops/basic NumPy.
  starter: "def nearest_quantile(x,p):\n    return None\n"
  solution: "def nearest_quantile(x,p):\n    xs=sorted(x); idx=round(p*(len(xs)-1)); return xs[idx]\n"
  tests: "def test_median():\n    assert nearest_quantile([9,1,5,3,7],0.5)==5\ndef test_q1():\n    assert nearest_quantile([0,10,20,30,40],0.25)==10\n"
