- id: c2w1-scalar-multiple-rule-mcq-04
  topic: derivative-rules
  type: mcq
  difficulty: 2
  tags:
  - figure
  prompt:
    vi: Chọn đồ thị phù hợp với đạo hàm của $f(x)=x^2$.
    en: Choose the graph after applying the scalar-multiple rule.
  explanation:
    vi: Đạo hàm là $2x$, một đường thẳng qua gốc tọa độ.
    en: The graph answer reflects that scaling a base curve also scales its derivative curve.
  hints:
  - vi: Hãy xác định đại lượng thay đổi trước, rồi chọn quy tắc đạo hàm phù hợp.
    en: Identify the changing quantity first, then choose the matching derivative rule.
  options:
  - vi: $f'(x)=2x$
    en: $f'(x)=2x$
    figure:
      xRange:
      - -3
      - 3
      yRange:
      - -6
      - 6
      functions:
      - f: 2*x
        label: 2*x
  - vi: $f'(x)=x^2$
    en: $f'(x)=x^2$
    figure:
      xRange:
      - -3
      - 3
      yRange:
      - -1
      - 9
      functions:
      - f: x^2
        label: x^2
  - vi: $f'(x)=2$
    en: $f'(x)=2$
    figure:
      xRange:
      - -3
      - 3
      yRange:
      - -1
      - 4
      functions:
      - f: '2'
        label: '2'
  answer:
  - 0
