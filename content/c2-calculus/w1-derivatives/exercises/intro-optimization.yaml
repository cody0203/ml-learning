exercises:
- id: c2w1-intro-optimization-mcq-01
  topic: optimization-losses
  type: mcq
  difficulty: 1
  tags:
  - concept
  prompt:
    vi: Ý nào mô tả đúng nhất phần 'Nhập môn tối ưu hóa'?
    en: Starting at a hot location on the temperature curve, what does a negative slope tell a minimization step?
  explanation:
    vi: 'Ý đúng: tối ưu hóa tìm điểm làm cost nhỏ nhất hoặc reward lớn nhất.'
    en: 'Correct: optimization searches for the point with minimum cost or maximum reward.'
  hints: []
  options:
  - vi: tối ưu hóa tìm điểm làm cost nhỏ nhất hoặc reward lớn nhất
    en: optimization searches for the point with minimum cost or maximum reward
  - vi: Đạo hàm luôn bằng giá trị của hàm.
    en: Move further in the negative direction because the curve value is positive.
  - vi: Nếu đạo hàm bằng 0 thì hàm không xác định.
    en: Stop immediately because any nonzero slope means the objective has no minimum.
  - vi: Có thể bỏ qua miền xác định khi lấy đạo hàm.
    en: Choose the largest step possible; learning rate cannot overshoot in one dimension.
  answer:
  - 0
- id: c2w1-intro-optimization-truefalse-02
  topic: optimization-losses
  type: true-false
  difficulty: 1
  tags:
  - misconception
  prompt:
    vi: Trong 'Nhập môn tối ưu hóa', công thức $x_{new}=x-\alpha f'(x)$ có thể được dùng sau khi kiểm tra điều kiện áp dụng.
    en: The update $x_{\text{new}}=x-\alpha f'(x)$ moves opposite the slope when minimizing a differentiable objective.
  explanation:
    vi: Điểm mấu chốt là luôn kiểm tra giả thiết trước khi dùng công thức.
    en: In optimization, the derivative must be tied to the objective being minimized.
  hints: []
  answer: true
  reasons:
  - vi: Khi tối thiểu hóa, ta đi ngược dấu đạo hàm với bước do $\alpha$ điều khiển.
    en: When minimizing, move opposite the derivative sign with step size controlled by $\alpha$.
  - vi: Luôn đi cùng chiều đạo hàm vì đó là hướng giảm nhanh nhất.
    en: Always move with the derivative because that is the fastest decreasing direction.
  - vi: Learning rate không ảnh hưởng đến bước cập nhật.
    en: The learning rate has no effect on the update step.
  reasonAnswer: 0
- id: c2w1-intro-optimization-parametric-03
  topic: optimization-losses
  type: parametric
  difficulty: 1
  tags:
  - parametric
  prompt:
    vi: 'Bài luyện động: trình sinh tạo số liệu mới mỗi lần.'
    en: 'Dynamic drill: the generator creates fresh numbers each time.'
  explanation:
    vi: Áp dụng quy tắc đạo hàm hoặc bước tối ưu hóa, không ghi nhớ đáp án cụ thể.
    en: Apply the derivative rule or optimization step rather than memorizing one answer.
  hints: []
  generator: gradient-step
  params: {}
- id: c2w1-intro-optimization-finderror-04
  topic: optimization-losses
  type: find-error
  difficulty: 2
  tags:
  - debugging
  prompt:
    vi: Tìm bước sai đầu tiên trong lời giải đạo hàm.
    en: Find the first incorrect step in the gradient-descent solution.
  explanation:
    vi: Bước sai bỏ sót đóng góp của quy tắc tích hoặc quy tắc dây chuyền.
    en: The first wrong optimization step moves uphill instead of subtracting the derivative direction.
  hints:
  - vi: Hãy xác định đại lượng thay đổi trước, rồi chọn quy tắc đạo hàm phù hợp.
    en: Identify the changing quantity first, then choose the matching derivative rule.
  steps:
  - vi: Đặt $f(x)=x^2\sin x$.
    en: Let $f(x)=x^2\sin x$.
  - vi: Vì đây là tích, dùng $(gh)'=g'h+gh'$.
    en: Because this is a product, use $(gh)'=g'h+gh'$.
  - vi: Suy ra $f'(x)=2x\cos x$.
    en: Therefore $f'(x)=2x\cos x$.
  - vi: Kết luận tại $x=0$, $f'(0)=0$.
    en: Conclude at $x=0$, $f'(0)=0$.
  answer: 2
- id: c2w1-intro-optimization-parsons-05
  topic: optimization-losses
  type: parsons
  difficulty: 2
  tags:
  - procedure
  prompt:
    vi: Sắp xếp quy trình tối ưu hóa bằng đạo hàm.
    en: Order the slide-style optimization search workflow.
  explanation:
    vi: Ta lập loss, lấy đạo hàm, tìm điểm tới hạn, rồi kiểm tra cực trị.
    en: 'The optimization ordering follows the slide story: choose a point, read slope, step, and reassess.'
  hints:
  - vi: Hãy xác định đại lượng thay đổi trước, rồi chọn quy tắc đạo hàm phù hợp.
    en: Identify the changing quantity first, then choose the matching derivative rule.
  steps:
  - vi: Viết hàm mục tiêu hoặc loss theo biến cần tối ưu.
    en: Write the objective or loss in terms of the variable to optimize.
  - vi: Tính đạo hàm của hàm mục tiêu.
    en: Compute the derivative of the objective.
  - vi: Giải phương trình đạo hàm bằng 0 hoặc xét dấu đạo hàm.
    en: Solve derivative equals zero or inspect derivative signs.
  - vi: Kiểm tra miền xác định, biên và ý nghĩa của nghiệm.
    en: Check the domain, boundaries, and meaning of the candidate.
