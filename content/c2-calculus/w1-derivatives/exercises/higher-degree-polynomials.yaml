exercises:
- id: c2w1-higher-degree-polynomials-mcq-01
  topic: common-derivatives
  type: mcq
  difficulty: 1
  tags:
  - concept
  prompt:
    vi: Ý nào mô tả đúng nhất phần 'Đạo hàm đa thức bậc cao'?
    en: 'A slide derives the slope of $x^3$ by shrinking $\Delta x$. What pattern does it reveal?'
  explanation:
    vi: 'Ý đúng: quy tắc lũy thừa biến đa thức thành đa thức bậc thấp hơn.'
    en: 'Correct: the power rule turns a polynomial into a lower-degree polynomial.'
  hints: []
  options:
  - vi: quy tắc lũy thừa biến đa thức thành đa thức bậc thấp hơn
    en: the power rule turns a polynomial into a lower-degree polynomial
  - vi: Đạo hàm luôn bằng giá trị của hàm.
    en: Cubic functions have constant slope because the exponent is fixed.
  - vi: Nếu đạo hàm bằng 0 thì hàm không xác định.
    en: The derivative of $x^3$ is $x^2$ because only the exponent drops.
  - vi: Có thể bỏ qua miền xác định khi lấy đạo hàm.
    en: The derivative of a sum of polynomial terms must be found by multiplying all terms together.
  answer:
  - 0
- id: c2w1-higher-degree-polynomials-truefalse-02
  topic: common-derivatives
  type: true-false
  difficulty: 1
  tags:
  - misconception
  prompt:
    vi: Trong 'Đạo hàm đa thức bậc cao', công thức $\frac{d}{dx}x^n=nx^{n-1}$ có thể được dùng sau khi kiểm tra điều kiện áp dụng.
    en: 'The power rule for $x^n$ multiplies by the old exponent and then lowers that exponent by one.'
  explanation:
    vi: Điểm mấu chốt là luôn kiểm tra giả thiết trước khi dùng công thức.
    en: Each polynomial term is checked separately, then the derivative terms are added.
  hints: []
  answer: true
  reasons:
  - vi: Quy tắc lũy thừa nhân với số mũ cũ rồi giảm số mũ đi 1.
    en: The power rule multiplies by the old exponent and lowers the exponent by 1.
  - vi: Chỉ cần giảm số mũ, không cần nhân hệ số nào.
    en: You only lower the exponent and never multiply by any coefficient.
  - vi: Đa thức bậc cao không thể lấy đạo hàm bằng quy tắc từng hạng.
    en: Higher-degree polynomials cannot be differentiated term by term.
  reasonAnswer: 0
