exercises:
- id: c2w1-squared-loss-two-powerlines-mcq-01
  topic: optimization-losses
  type: mcq
  difficulty: 1
  tags:
  - concept
  prompt:
    vi: 'Ý nào mô tả đúng nhất phần ''Tối ưu squared loss: hai đường điện''?'
    en: 'Powerlines are at $a=2$ and $b=10$. Which location balances the two squared costs?'
  explanation:
    vi: 'Ý đúng: tổng bình phương khoảng cách tới hai điểm được tối thiểu tại trung điểm.'
    en: 'Correct: the sum of squared distances to two points is minimized at the midpoint.'
  hints: []
  options:
  - vi: tổng bình phương khoảng cách tới hai điểm được tối thiểu tại trung điểm
    en: the sum of squared distances to two points is minimized at the midpoint
  - vi: Đạo hàm luôn bằng giá trị của hàm.
    en: $x=2$, because standing on one line makes one of the two costs zero.
  - vi: Nếu đạo hàm bằng 0 thì hàm không xác định.
    en: $x=10$, because the farther-right line contributes the larger coordinate.
  - vi: Có thể bỏ qua miền xác định khi lấy đạo hàm.
    en: $x=12$, because adding the two line positions gives the minimum.
  answer:
  - 0
- id: c2w1-squared-loss-two-powerlines-truefalse-02
  topic: optimization-losses
  type: true-false
  difficulty: 1
  tags:
  - misconception
  prompt:
    vi: 'Trong ''Tối ưu squared loss: hai đường điện'', công thức $J(x)=(x-a)^2+(x-b)^2$ có thể được dùng sau khi kiểm tra điều kiện áp dụng.'
    en: 'The two-powerline objective adds the squared distances to both line positions before differentiating.'
  explanation:
    vi: Điểm mấu chốt là luôn kiểm tra giả thiết trước khi dùng công thức.
    en: With two powerlines, the derivative balances the pull from both squared distances.
  hints: []
  answer: true
  reasons:
  - vi: Đạo hàm cộng lực kéo từ hai bình phương và cân bằng tại trung điểm.
    en: The derivative adds the pull from two squares and balances at the midpoint.
  - vi: Nên đặt nhà ngay trên một đường để một chi phí bằng 0.
    en: The house should sit on one line so that one cost is 0.
  - vi: Cộng hai vị trí đường điện trực tiếp cho nghiệm tối ưu.
    en: Directly adding the two powerline locations gives the optimum.
  reasonAnswer: 0
