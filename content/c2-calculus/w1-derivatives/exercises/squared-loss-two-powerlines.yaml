- id: c2w1-squared-loss-two-powerlines-multistep-04
  topic: optimization-losses
  type: multi-step
  difficulty: 3
  tags:
  - application
  prompt:
    vi: 'Bài toán nhiều bước: tối ưu vị trí theo squared loss.'
    en: 'Multi-step problem: optimize the midpoint for two squared powerline distances.'
  explanation:
    vi: Đạo hàm của tổng bình phương cho nghiệm là trung bình các vị trí.
    en: For two powerlines, differentiating the two squared distances gives a midpoint condition.
  hints:
  - vi: Hãy xác định đại lượng thay đổi trước, rồi chọn quy tắc đạo hàm phù hợp.
    en: Identify the changing quantity first, then choose the matching derivative rule.
  parts:
  - type: numeric
    prompt:
      vi: Với $J(x)=(x-2)^2+(x-8)^2$, tính $J'(x)$ tại $x=3$.
      en: For $J(x)=(x-2)^2+(x-8)^2$, compute $J'(x)$ at $x=3$.
    answers:
    - value: -8
    explanation:
      vi: $J'(x)=2(x-2)+2(x-8)=4x-20$, tại $3$ là $-8$.
      en: $J'(x)=2(x-2)+2(x-8)=4x-20$, at $3$ it is $-8$.
  - type: numeric
    prompt:
      vi: Giải $J'(x)=0$ để tìm $x$ tối ưu.
      en: Solve $J'(x)=0$ for the optimal $x$.
    answers:
    - value: 5
    explanation:
      vi: $4x-20=0$ nên $x=5$.
      en: $4x-20=0$, so $x=5$.
  - type: mcq
    prompt:
      vi: Tại $x=3$, đạo hàm âm gợi ý di chuyển hướng nào để giảm loss?
      en: At $x=3$, a negative derivative suggests moving which way to reduce loss?
    options:
    - vi: Tăng $x$
      en: Increase $x$
    - vi: Giảm $x$
      en: Decrease $x$
    - vi: Không đổi
      en: Do not move
    answer:
    - 0
    explanation:
      vi: Gradient descent dùng $x-\alpha J'(x)$; đạo hàm âm làm bước cập nhật tăng $x$.
      en: Gradient descent uses $x-\alpha J'(x)$; a negative derivative increases $x$.
