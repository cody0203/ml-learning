exercises:
- id: c2w1-log-loss-part-1-mcq-01
  topic: optimization-losses
  type: mcq
  difficulty: 1
  tags:
  - concept
  prompt:
    vi: 'Ý nào mô tả đúng nhất phần ''Tối ưu log-loss: phần 1''?'
    en: A coin sequence has 7 heads and 3 tails. Which model idea is used to compare coins with $p=0.7$, $0.5$, and $0.3$?
  explanation:
    vi: 'Ý đúng: likelihood nhân xác suất của các quan sát, nên xác suất rất nhỏ làm mô hình bị phạt.'
    en: 'Correct: likelihood multiplies probabilities of observations, so tiny probabilities are heavily penalized.'
  hints: []
  options:
  - vi: likelihood nhân xác suất của các quan sát, nên xác suất rất nhỏ làm mô hình bị phạt
    en: likelihood multiplies probabilities of observations, so tiny probabilities are heavily penalized
  - vi: Đạo hàm luôn bằng giá trị của hàm.
    en: Choose the coin with the largest tail probability because tails are rarer in the data.
  - vi: Nếu đạo hàm bằng 0 thì hàm không xác định.
    en: Add the head probabilities and tail probabilities instead of multiplying observation probabilities.
  - vi: Có thể bỏ qua miền xác định khi lấy đạo hàm.
    en: Ignore the order and counts; any coin with both outcomes possible is equally good.
  answer:
  - 0
- id: c2w1-log-loss-part-1-truefalse-02
  topic: optimization-losses
  type: true-false
  difficulty: 1
  tags:
  - misconception
  prompt:
    vi: 'Trong ''Tối ưu log-loss: phần 1'', công thức $L(p)=p^H(1-p)^T$ có thể được dùng sau khi kiểm tra điều kiện áp dụng.'
    en: For $H$ observed heads and $T$ observed tails, likelihood multiplies $p$ for heads and $1-p$ for tails.
  explanation:
    vi: Điểm mấu chốt là luôn kiểm tra giả thiết trước khi dùng công thức.
    en: For likelihood, the probability of every observed toss contributes to the product.
  hints: []
  answer: true
  reasons:
  - vi: Likelihood nhân xác suất của từng kết quả đã quan sát trong chuỗi tung.
    en: Likelihood multiplies the probabilities of the outcomes actually observed in the toss sequence.
  - vi: Chỉ cần chọn đồng xu có xác suất sấp lớn nhất.
    en: You only choose the coin with the largest tail probability.
  - vi: Các xác suất quan sát phải được cộng thay vì nhân.
    en: The observation probabilities should be added rather than multiplied.
  reasonAnswer: 0
