exercises:
- id: c2w1-squared-loss-three-powerlines-mcq-01
  topic: optimization-losses
  type: mcq
  difficulty: 1
  tags:
  - concept
  prompt:
    vi: 'Ý nào mô tả đúng nhất phần ''Tối ưu squared loss: ba đường điện''?'
    en: 'For powerlines at $1$, $4$, and $10$, which statistic minimizes total squared distance?'
  explanation:
    vi: 'Ý đúng: tổng bình phương khoảng cách tới nhiều điểm được tối thiểu tại trung bình.'
    en: 'Correct: the sum of squared distances to many points is minimized at their mean.'
  hints: []
  options:
  - vi: tổng bình phương khoảng cách tới nhiều điểm được tối thiểu tại trung bình
    en: the sum of squared distances to many points is minimized at their mean
  - vi: Đạo hàm luôn bằng giá trị của hàm.
    en: The minimum is the smallest position, because that makes one squared distance zero.
  - vi: Nếu đạo hàm bằng 0 thì hàm không xác định.
    en: The minimum is the median only because there are three lines.
  - vi: Có thể bỏ qua miền xác định khi lấy đạo hàm.
    en: The minimum is found by multiplying all three positions.
  answer:
  - 0
- id: c2w1-squared-loss-three-powerlines-truefalse-02
  topic: optimization-losses
  type: true-false
  difficulty: 1
  tags:
  - misconception
  prompt:
    vi: 'Trong ''Tối ưu squared loss: ba đường điện'', công thức $J(x)=\sum_i(x-a_i)^2$ có thể được dùng sau khi kiểm tra điều kiện áp dụng.'
    en: 'Summing three squared distances and setting the derivative to zero gives the mean of the three locations.'
  explanation:
    vi: Điểm mấu chốt là luôn kiểm tra giả thiết trước khi dùng công thức.
    en: With three powerlines, setting the derivative to zero produces their average position.
  hints: []
  answer: true
  reasons:
  - vi: Tổng bình phương khoảng cách được tối thiểu tại trung bình các vị trí.
    en: The sum of squared distances is minimized at the mean of the positions.
  - vi: Với ba vị trí, squared loss luôn chọn median.
    en: With three positions, squared loss always chooses the median.
  - vi: Nghiệm tối ưu là tích của các vị trí đường điện.
    en: The optimum is the product of the powerline locations.
  reasonAnswer: 0
