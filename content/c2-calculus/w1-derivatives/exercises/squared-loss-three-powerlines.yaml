- id: c2w1-squared-loss-three-powerlines-matrix-04
  topic: optimization-losses
  type: matrix
  difficulty: 2
  tags:
  - gradient
  prompt:
    vi: Nhập vector cột gồm $f'(1)$ và $f'(2)$ cho $f(x)=x^2+1$.
    en: Enter the column vector for two checks of the three-powerline gradient.
  explanation:
    vi: Vì $f'(x)=2x$, vector là $(2,4)^T$.
    en: The vector answer summarizes two components of the three-powerline squared-loss derivative.
  hints:
  - vi: Hãy xác định đại lượng thay đổi trước, rồi chọn quy tắc đạo hàm phù hợp.
    en: Identify the changing quantity first, then choose the matching derivative rule.
  answer:
  - - 2
  - - 4
