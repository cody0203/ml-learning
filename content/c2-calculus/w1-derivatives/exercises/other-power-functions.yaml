- id: c2w1-other-power-functions-matching-04
  topic: common-derivatives
  type: matching
  difficulty: 1
  tags:
  - formula
  prompt:
    vi: Ghép hàm với đạo hàm tương ứng.
    en: Match reciprocal and negative-power functions with their derivatives.
  explanation:
    vi: Các cặp dùng bảng đạo hàm cơ bản và quy tắc lũy thừa.
    en: The matching choices emphasize negative exponents, reciprocal notation, and the sign of the derivative.
  hints: []
  pairs:
  - left:
      vi: $x^2$
      en: $x^2$
    right:
      vi: $2x$
      en: $2x$
  - left:
      vi: $e^x$
      en: $e^x$
    right:
      vi: $e^x$
      en: $e^x$
  - left:
      vi: $\log x$
      en: $\log x$
    right:
      vi: $1/x$
      en: $1/x$
  - left:
      vi: $\sin x$
      en: $\sin x$
    right:
      vi: $\cos x$
      en: $\cos x$
