exercises:
- id: c2w1-conclusion-mcq-01
  topic: optimization-losses
  type: mcq
  difficulty: 1
  tags:
  - concept
  prompt:
    vi: Ý nào mô tả đúng nhất phần 'Kết luận'?
    en: Which chain of ideas best summarizes why Week 1 matters for later neural-network training?
  explanation:
    vi: 'Ý đúng: tuần này nối độ dốc, quy tắc đạo hàm và tối ưu hóa loss.'
    en: 'Correct: this week links slopes, derivative rules, and loss optimization.'
  hints: []
  options:
  - vi: tuần này nối độ dốc, quy tắc đạo hàm và tối ưu hóa loss
    en: this week links slopes, derivative rules, and loss optimization
  - vi: Đạo hàm luôn bằng giá trị của hàm.
    en: Tables of values replace optimization, so derivative rules are only historical.
  - vi: Nếu đạo hàm bằng 0 thì hàm không xác định.
    en: Only logarithms matter for ML; tangents and squared loss are separate topics.
  - vi: Có thể bỏ qua miền xác định khi lấy đạo hàm.
    en: Every loss is minimized by setting the parameter itself to zero.
  answer:
  - 0
- id: c2w1-conclusion-truefalse-02
  topic: optimization-losses
  type: true-false
  difficulty: 1
  tags:
  - misconception
  prompt:
    vi: Trong 'Kết luận', công thức $\text{slope}\to\text{derivative}\to\text{optimization}$ có thể được dùng sau khi kiểm tra điều kiện áp dụng.
    en: The week connects slope estimates, derivative rules, and optimization updates into one workflow.
  explanation:
    vi: Điểm mấu chốt là luôn kiểm tra giả thiết trước khi dùng công thức.
    en: The conclusion ties notation, rules, and optimization steps into one derivative workflow.
  hints: []
  answer: true
  reasons:
  - vi: Tuần này nối độ dốc cục bộ, quy tắc đạo hàm và cập nhật tối ưu hóa.
    en: This week connects local slope, derivative rules, and optimization updates.
  - vi: Bảng giá trị thay thế hoàn toàn cho đạo hàm trong huấn luyện ML.
    en: Tables of values completely replace derivatives in ML training.
  - vi: Log-loss không liên quan đến các ý tưởng về độ dốc.
    en: Log-loss is unrelated to the ideas about slope.
  reasonAnswer: 0
- id: c2w1-conclusion-matrix-03
  topic: optimization-losses
  type: matrix
  difficulty: 2
  tags:
  - gradient
  prompt:
    vi: Nhập vector cột gồm $f'(1)$ và $f'(2)$ cho $f(x)=x^2+1$.
    en: Enter the column vector for the final two-slope review.
  explanation:
    vi: Vì $f'(x)=2x$, vector là $(2,4)^T$.
    en: The concluding vector exercise reviews two quick slope evaluations as a compact derivative summary.
  hints:
  - vi: Hãy xác định đại lượng thay đổi trước, rồi chọn quy tắc đạo hàm phù hợp.
    en: Identify the changing quantity first, then choose the matching derivative rule.
  answer:
  - - 2
  - - 4
- id: c2w1-conclusion-parsons-04
  topic: optimization-losses
  type: parsons
  difficulty: 2
  tags:
  - procedure
  prompt:
    vi: Sắp xếp quy trình tối ưu hóa bằng đạo hàm.
    en: Order the final derivative-to-optimization workflow.
  explanation:
    vi: Ta lập loss, lấy đạo hàm, tìm điểm tới hạn, rồi kiểm tra cực trị.
    en: 'The closing ordering exercise connects the week: define the objective, differentiate, update, and interpret.'
  hints:
  - vi: Hãy xác định đại lượng thay đổi trước, rồi chọn quy tắc đạo hàm phù hợp.
    en: Identify the changing quantity first, then choose the matching derivative rule.
  steps:
  - vi: Viết hàm mục tiêu hoặc loss theo biến cần tối ưu.
    en: Write the objective or loss in terms of the variable to optimize.
  - vi: Tính đạo hàm của hàm mục tiêu.
    en: Compute the derivative of the objective.
  - vi: Giải phương trình đạo hàm bằng 0 hoặc xét dấu đạo hàm.
    en: Solve derivative equals zero or inspect derivative signs.
  - vi: Kiểm tra miền xác định, biên và ý nghĩa của nghiệm.
    en: Check the domain, boundaries, and meaning of the candidate.
