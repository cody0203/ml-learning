exercises:
- id: c2w1-derivative-log-mcq-01
  topic: inverse-trig-exp-log
  type: mcq
  difficulty: 1
  tags:
  - concept
  prompt:
    vi: Ý nào mô tả đúng nhất phần 'Đạo hàm của $\log(x)$'?
    en: The log slide uses the inverse of $e^x$. Which slope formula follows for positive $x$?
  explanation:
    vi: 'Ý đúng: log tự nhiên là hàm ngược của $e^x$ nên đạo hàm là nghịch đảo của đầu vào.'
    en: 'Correct: the natural log is the inverse of $e^x$, so its derivative is reciprocal in the input.'
  hints: []
  options:
  - vi: log tự nhiên là hàm ngược của $e^x$ nên đạo hàm là nghịch đảo của đầu vào
    en: the natural log is the inverse of $e^x$, so its derivative is reciprocal in the input
  - vi: Đạo hàm luôn bằng giá trị của hàm.
    en: The derivative is $\log x$ because inverse functions keep the same formula.
  - vi: Nếu đạo hàm bằng 0 thì hàm không xác định.
    en: The derivative is $e^x$ because log and exponential are inverse functions.
  - vi: Có thể bỏ qua miền xác định khi lấy đạo hàm.
    en: The same formula works for negative $x$ if absolute values are not drawn.
  answer:
  - 0
- id: c2w1-derivative-log-truefalse-02
  topic: inverse-trig-exp-log
  type: true-false
  difficulty: 1
  tags:
  - misconception
  prompt:
    vi: Trong 'Đạo hàm của $\log(x)$', công thức $\frac{d}{dx}\log x=\frac1x$ có thể được dùng sau khi kiểm tra điều kiện áp dụng.
    en: The derivative $(\log x)'=1/x$ is valid on the positive domain of the natural logarithm.
  explanation:
    vi: Điểm mấu chốt là luôn kiểm tra giả thiết trước khi dùng công thức.
    en: The logarithm derivative requires a positive input before the reciprocal slope is valid.
  hints: []
  answer: true
  reasons:
  - vi: Log tự nhiên chỉ xét $x>0$ và có độ dốc $1/x$.
    en: The natural log is considered for $x>0$ and has slope $1/x$.
  - vi: Log là hàm ngược nên đạo hàm của nó bằng $e^x$.
    en: Because log is an inverse, its derivative is $e^x$.
  - vi: Công thức $1/x$ dùng được cả khi $x$ âm trong log tự nhiên.
    en: The formula $1/x$ applies to negative inputs of the natural log.
  reasonAnswer: 0
