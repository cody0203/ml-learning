- id: c2w1-derivative-ex-numeric-04
  topic: inverse-trig-exp-log
  type: numeric
  difficulty: 2
  tags:
  - calculation
  prompt:
    vi: Tính $\frac{d}{dx}e^x$ tại $x=1$.
    en: Compute $\frac{d}{dx}e^x$ at $x=1$.
  explanation:
    vi: Tính đạo hàm rồi thay điểm cần xét; không dùng giá trị hàm thay cho độ dốc.
    en: Because $e^x$ is self-derivative, substituting the point happens after recognizing the same function reappears.
  hints:
  - vi: Hãy xác định đại lượng thay đổi trước, rồi chọn quy tắc đạo hàm phù hợp.
    en: Identify the changing quantity first, then choose the matching derivative rule.
  answers:
  - value: 2.718281828
  tolerance: 0.001
