exercises:
- id: c2w1-inverse-function-derivative-mcq-01
  topic: inverse-trig-exp-log
  type: mcq
  difficulty: 1
  tags:
  - concept
  prompt:
    vi: Ý nào mô tả đúng nhất phần 'Đạo hàm của hàm ngược'?
    en: If $f(2)=4$ and $f'(2)=4$, what should happen to the inverse slope at $y=4$?
  explanation:
    vi: 'Ý đúng: đồ thị hàm ngược phản chiếu qua $y=x$ nên độ dốc bị nghịch đảo.'
    en: 'Correct: an inverse graph reflects across $y=x$, so slopes reciprocate.'
  hints: []
  options:
  - vi: đồ thị hàm ngược phản chiếu qua $y=x$ nên độ dốc bị nghịch đảo
    en: an inverse graph reflects across $y=x$, so slopes reciprocate
  - vi: Đạo hàm luôn bằng giá trị của hàm.
    en: The inverse has the same slope $4$ because inverse functions keep all slopes unchanged.
  - vi: Nếu đạo hàm bằng 0 thì hàm không xác định.
    en: The inverse slope is $2$ because the original input was $2$.
  - vi: Có thể bỏ qua miền xác định khi lấy đạo hàm.
    en: The inverse rule applies even if several x-values give the same y-value nearby.
  answer:
  - 0
- id: c2w1-inverse-function-derivative-truefalse-02
  topic: inverse-trig-exp-log
  type: true-false
  difficulty: 1
  tags:
  - misconception
  prompt:
    vi: Trong 'Đạo hàm của hàm ngược', công thức $(f^{-1})'(y)=\frac{1}{f'(x)}$ where $y=f(x)$ có thể được dùng sau khi kiểm tra điều kiện áp dụng.
    en: The inverse derivative at $y=f(x)$ uses the reciprocal of the original slope at the matching $x$.
  explanation:
    vi: Điểm mấu chốt là luôn kiểm tra giả thiết trước khi dùng công thức.
    en: The inverse derivative rule needs matching inverse points and a nonzero original slope.
  hints: []
  answer: true
  reasons:
  - vi: Phải ghép đúng $y=f(x)$ rồi lấy nghịch đảo của độ dốc tại $x$.
    en: Match the point $y=f(x)$, then take the reciprocal of the slope at that $x$.
  - vi: Hàm ngược luôn giữ nguyên độ dốc của hàm ban đầu.
    en: An inverse function always keeps the original function's slope unchanged.
  - vi: Công thức hàm ngược không cần hàm ban đầu một-một quanh điểm xét.
    en: The inverse rule does not need the original function to be one-to-one locally.
  reasonAnswer: 0
- id: c2w1-inverse-function-derivative-matrix-03
  topic: inverse-trig-exp-log
  type: matrix
  difficulty: 2
  tags:
  - gradient
  prompt:
    vi: Nhập vector cột gồm $f'(1)$ và $f'(2)$ cho $f(x)=x^2+1$.
    en: Enter the column vector after pairing two inverse-function slope checks.
  explanation:
    vi: Vì $f'(x)=2x$, vector là $(2,4)^T$.
    en: The matrix-style answer records two reciprocal-slope evaluations associated with the inverse-function example.
  hints:
  - vi: Hãy xác định đại lượng thay đổi trước, rồi chọn quy tắc đạo hàm phù hợp.
    en: Identify the changing quantity first, then choose the matching derivative rule.
  answer:
  - - 2
  - - 4
- id: c2w1-inverse-function-derivative-parsons-04
  topic: inverse-trig-exp-log
  type: parsons
  difficulty: 2
  tags:
  - procedure
  prompt:
    vi: Sắp xếp quy trình tối ưu hóa bằng đạo hàm.
    en: Order the inverse-function derivative workflow.
  explanation:
    vi: Ta lập loss, lấy đạo hàm, tìm điểm tới hạn, rồi kiểm tra cực trị.
    en: The ordered inverse-function workflow starts by pairing $x$ with $y=f(x)$ before taking reciprocal slopes.
  hints:
  - vi: Hãy xác định đại lượng thay đổi trước, rồi chọn quy tắc đạo hàm phù hợp.
    en: Identify the changing quantity first, then choose the matching derivative rule.
  steps:
  - vi: Viết hàm mục tiêu hoặc loss theo biến cần tối ưu.
    en: Write the objective or loss in terms of the variable to optimize.
  - vi: Tính đạo hàm của hàm mục tiêu.
    en: Compute the derivative of the objective.
  - vi: Giải phương trình đạo hàm bằng 0 hoặc xét dấu đạo hàm.
    en: Solve derivative equals zero or inspect derivative signs.
  - vi: Kiểm tra miền xác định, biên và ý nghĩa của nghiệm.
    en: Check the domain, boundaries, and meaning of the candidate.
