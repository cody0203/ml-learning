- id: c2w2-gradients-code-58
  topic: gradients
  type: code
  difficulty: 3
  tags:
  - code
  - numpy
  prompt:
    vi: Cài đặt numerical gradient; không dùng shortcut tối ưu hóa.
    en: Implement numerical gradient; do not use optimization shortcuts.
  explanation:
    vi: Hàm cần dịch từng tọa độ một lượng $h$, tính sai phân trung tâm, rồi khôi phục tọa độ trước khi sang chiều tiếp theo.
    en: The function must perturb one coordinate by $h$, compute a centered difference, and then move to the next coordinate without mixing directions.
  hints: []
  starter: "import numpy as np\ndef numerical_grad(f,p,h=1e-5):\n    return np.zeros_like(p,dtype=float)\n"
  solution: "import numpy as np\ndef numerical_grad(f,p,h=1e-5):\n    p=np.array(p,dtype=float); g=np.zeros_like(p)\n    for\
    \ i in range(len(p)):\n        e=np.zeros_like(p); e[i]=h\n        g[i]=(f(p+e)-f(p-e))/(2*h)\n    return g\n"
  tests: "import numpy as np\ndef test_grad():\n    f=lambda p:(p[0]-1)**2+2*(p[1]+1)**2\n    assert np.allclose(numerical_grad(f,np.array([3.,1.])),\
    \ [4.,8.], atol=1e-3)\n"
