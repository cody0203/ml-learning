exercises:
- id: c2w2-gradients-mcq-09
  topic: gradients
  type: mcq
  difficulty: 1
  tags:
  - concept
  prompt:
    vi: Với $f(x,y)=x^2+y^2$ tại $(2,3)$, vector nào là gradient?
    en: For $f(x,y)=x^2+y^2$ at $(2,3)$, which vector is the gradient?
  explanation:
    vi: Gradient gom hai đạo hàm riêng $[2x,2y]$. Tại $(2,3)$ nó là $[4,6]$, không phải tọa độ điểm hay hướng âm.
    en: The gradient collects the two partial derivatives $[2x,2y]$. At $(2,3)$ it is $[4,6]$, not the point itself or the negative direction.
  hints: []
  options:
  - vi: $[4,6]$
    en: $[4,6]$
  - vi: $[2,3]$
    en: $[2,3]$
  - vi: $[-4,-6]$
    en: $[-4,-6]$
  - vi: $10$
    en: $10$
  answer:
  - 0
- id: c2w2-gradients-truefalse-10
  topic: gradients
  type: true-false
  difficulty: 1
  tags:
  - misconception
  prompt:
    vi: Đạo hàm theo hướng đơn vị $u$ có thể tính bằng $\nabla f\cdot u$.
    en: A directional derivative in a unit direction $u$ can be computed as $\nabla f\cdot u$.
  explanation:
    vi: Đúng. Dot product đo phần của gradient theo hướng $u$; giá trị lớn nhất xảy ra khi $u$ cùng hướng gradient.
    en: True. The dot product measures the component of the gradient in direction $u$; it is largest when $u$ aligns with the gradient.
  hints: []
  answer: true
  reasons:
  - vi: Dot product chiếu gradient lên hướng đang xét.
    en: The dot product projects the gradient onto the chosen direction.
  - vi: Dot product luôn bằng độ cao của surface.
    en: The dot product is always the height of the surface.
  reasonAnswer: 0
- id: c2w2-gradients-matching-11
  topic: gradients
  type: matching
  difficulty: 1
  tags:
  - connections
  prompt:
    vi: Ghép vector gradient với cách diễn giải hình học.
    en: Match gradient vectors to their geometric interpretation.
  explanation:
    vi: Vector gradient cho biết hướng tăng; đổi dấu nó cho hướng giảm; vector 0 là điểm dừng.
    en: A gradient vector gives ascent; negating it gives descent; the zero vector indicates stationarity.
  hints: []
  pairs:
  - left:
      vi: $[4,6]$ tại $(2,3)$
      en: $[4,6]$ at $(2,3)$
    right:
      vi: Hướng tăng nhanh nhất của $x^2+y^2$
      en: Steepest ascent for $x^2+y^2$
  - left:
      vi: $[-4,-6]$
      en: $[-4,-6]$
    right:
      vi: Hướng giảm nhanh nhất tại cùng điểm
      en: Steepest descent at the same point
  - left:
      vi: $[0,0]$
      en: $[0,0]$
    right:
      vi: Gradient ở một điểm dừng
      en: Gradient at a stationary point
- id: c2w2-gradients-numeric-12
  topic: gradients
  type: numeric
  difficulty: 1
  tags:
  - calculation
  prompt:
    vi: Cho $f(x,y)=x^2+3y^2$. Tính hai thành phần gradient tại $(2,-1)$.
    en: Let $f(x,y)=x^2+3y^2$. Compute the two gradient components at $(2,-1)$.
  explanation:
    vi: $f_x=2x$ nên bằng $4$; $f_y=6y$ nên bằng $-6$. Đây là cùng vector với bài nhập ma trận.
    en: $f_x=2x$ gives $4$; $f_y=6y$ gives $-6$. This is the same vector used in the matrix-entry exercise.
  hints: []
  answers:
  - label: f_x
    value: 4
  - label: f_y
    value: -6
