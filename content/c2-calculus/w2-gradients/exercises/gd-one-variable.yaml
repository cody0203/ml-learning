- id: c2w2-gd-one-variable-numeric-73
  topic: gd-one-variable
  type: numeric
  difficulty: 1
  tags:
  - derivative
  prompt:
    vi: Với $f(x)=e^x-\log x$, đạo hàm tại $x=1$ là bao nhiêu?
    en: For $f(x)=e^x-\log x$, what is the derivative at $x=1$?
  explanation:
    vi: $f'(x)=e^x-1/x$, nên $f'(1)=e-1$.
    en: $f'(x)=e^x-1/x$, so $f'(1)=e-1$.
  hints: []
  answers:
  - value: 1.718281828
  tolerance: 0.001
