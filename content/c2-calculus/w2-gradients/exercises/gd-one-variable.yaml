  explanation:
    vi: Công thức cập nhật tách điểm hiện tại, độ dốc tại điểm đó, và hệ số điều khiển độ dài bước.
    en: The update formula separates the current point, the slope at that point, and the factor controlling step length.
  hints: []
  pairs:
  - left:
      vi: $x_k$
      en: $x_k$
    right:
      vi: Điểm hiện tại
