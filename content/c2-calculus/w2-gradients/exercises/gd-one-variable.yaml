  - left:
      vi: $f'(x_k)$
      en: $f'(x_k)$
    right:
      vi: Độ dốc tại điểm hiện tại
      en: Slope at the current point
  - left:
      vi: $\alpha$
      en: $\alpha$
    right:
      vi: Learning rate
      en: Learning rate
- id: c2w2-gd-one-variable-numeric-28
  topic: gd-one-variable
  type: numeric
  difficulty: 1
  tags:
  - calculation
  prompt:
    vi: Với $f(x)=(x-3)^2$, $x_0=0$, $\alpha=0.1$, tính $x_1$.
    en: For $f(x)=(x-3)^2$, $x_0=0$, $\alpha=0.1$, compute $x_1$.
  explanation:
    vi: $f'(0)=2(0-3)=-6$. Do đó $x_1=0-0.1(-6)=0.6$.
    en: $f'(0)=2(0-3)=-6$. Therefore $x_1=0-0.1(-6)=0.6$.
  hints: []
  answers:
  - label: x_1
    value: 0.6
- id: c2w2-gd-one-variable-parsons-49
  topic: gd-one-variable
  type: parsons
  difficulty: 2
  tags:
  - algorithm
  prompt:
    vi: Sắp xếp thuật toán gradient descent một biến.
    en: Order the one-variable gradient descent algorithm.
  explanation:
    vi: Chọn điểm, chọn learning rate, tính gradient, cập nhật, lặp/kiểm tra.
    en: Choose point, choose learning rate, compute gradient, update, repeat/check.
  hints: []
  steps:
  - vi: Chọn điểm bắt đầu $x_0$.
    en: Choose a starting point $x_0$.
  - vi: Chọn learning rate $\alpha$.
    en: Choose learning rate $\alpha$.
  - vi: Tính $f'(x_k)$.
    en: Compute $f'(x_k)$.
  - vi: Cập nhật $x_{k+1}=x_k-\alpha f'(x_k)$.
    en: Update $x_{k+1}=x_k-\alpha f'(x_k)$.
  - vi: Lặp cho đến khi đủ gần hoặc cost không giảm thêm.
    en: Repeat until close enough or cost no longer improves.
