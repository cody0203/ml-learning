- id: c2w2-gd-one-variable-code-59
  topic: gd-one-variable
  type: code
  difficulty: 3
  tags:
  - code
  - numpy
  prompt:
    vi: Cài đặt gradient descent loop; không dùng shortcut tối ưu hóa.
    en: Implement gradient descent loop; do not use optimization shortcuts.
  explanation:
    vi: Vòng lặp phải cập nhật lại $x$ sau mỗi lần tính $2(x-3)$; nếu trả về $x_0$ thì không có bước học nào xảy ra.
    en: The loop must update $x$ after each evaluation of $2(x-3)$; returning $x_0$ means no learning step was applied.
  hints: []
  starter: "def gd1(x0, alpha, steps):\n    return x0\n"
  solution: "def gd1(x0, alpha, steps):\n    x=float(x0)\n    for _ in range(steps):\n        x -= alpha*2*(x-3)\n    return\
    \ x\n"
  tests: "def test_moves():\n    assert abs(gd1(0,0.1,1)-0.6)<1e-9\n    assert abs(gd1(0,0.1,3)-1.464)<1e-9\n"
- id: c2w2-gd-one-variable-predictoutput-63
  topic: gd-one-variable
  type: predict-output
  difficulty: 1
  tags:
  - numpy
  prompt:
    vi: Dự đoán giá trị $x$ sau một bước cho hàm $(x-1)^2$.
    en: Predict $x$ after one step for the function $(x-1)^2$.
  explanation:
    vi: Ban đầu $x=0$ và gradient $2(x-1)=-2$. Cập nhật với $\alpha=0.5$ cho $x=0-0.5(-2)=1.0$.
    en: Initially $x=0$ and the gradient $2(x-1)=-2$. With $\alpha=0.5$, the update gives $x=0-0.5(-2)=1.0$.
  hints: []
  code: 'x=0.0

    alpha=0.5

    x=x-alpha*2*(x-1)

    print(x)

    '
  options:
  - '1.0'
  - '0.0'
  - '-1.0'
  - '2.0'
  answer: 0
