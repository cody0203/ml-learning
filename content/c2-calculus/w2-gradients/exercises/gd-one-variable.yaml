exercises:
- id: c2w2-gd-one-variable-mcq-25
  topic: gd-one-variable
  type: mcq
  difficulty: 1
  tags:
  - concept
  prompt:
    vi: Với $f(x)=(x-4)^2$ và $x_0=1$, vì sao bước descent đầu tiên đi sang phải?
    en: For $f(x)=(x-4)^2$ and $x_0=1$, why does the first descent step move right?
  explanation:
    vi: Tại $x_0=1$, $f'(x)=2(x-4)$ bằng $-6$. Cập nhật $x-\alpha f'(x)$ trừ một số âm, nên $x$ tăng.
    en: At $x_0=1$, $f'(x)=2(x-4)$ equals $-6$. The update $x-\alpha f'(x)$ subtracts a negative number, so $x$ increases.
  hints: []
  options:
  - vi: Đạo hàm ở $x=1$ âm, nên trừ đạo hàm làm $x$ tăng.
    en: The derivative at $x=1$ is negative, so subtracting it increases $x$.
  - vi: Vì mọi bước gradient descent luôn đi sang phải.
    en: Because every gradient descent step always moves right.
  - vi: Vì learning rate âm.
    en: Because the learning rate is negative.
  - vi: Vì điểm minimum nằm tại $x=-4$.
    en: Because the minimum is at $x=-4$.
  answer:
  - 0
- id: c2w2-gd-one-variable-truefalse-26
  topic: gd-one-variable
  type: true-false
  difficulty: 1
  tags:
  - misconception
  prompt:
    vi: Nếu $f'(x_k)>0$ trong bài một biến, cập nhật descent làm $x_{k+1}<x_k$ khi $\alpha>0$.
    en: If $f'(x_k)>0$ in one variable, the descent update gives $x_{k+1}<x_k$ when $\alpha>0$.
  explanation:
    vi: Đúng. Công thức $x_{k+1}=x_k-\alpha f'(x_k)$ trừ một số dương, nên điểm mới nằm bên trái điểm cũ.
    en: True. The update $x_{k+1}=x_k-\alpha f'(x_k)$ subtracts a positive number, placing the new point to the left.
  hints: []
  answer: true
  reasons:
  - vi: Trừ một derivative dương làm giảm tọa độ $x$.
    en: Subtracting a positive derivative decreases the coordinate $x$.
  - vi: Vì $\alpha$ luôn lớn hơn 1.
    en: Because $\alpha$ is always larger than 1.
  reasonAnswer: 0
- id: c2w2-gd-one-variable-matching-27
  topic: gd-one-variable
  type: matching
  difficulty: 1
  tags:
  - connections
  prompt:
    vi: Ghép các ký hiệu trong cập nhật một biến.
