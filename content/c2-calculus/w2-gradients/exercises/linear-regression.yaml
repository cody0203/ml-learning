exercises:
- id: c2w2-linear-regression-mcq-21
  topic: linear-regression
  type: mcq
  difficulty: 1
  tags:
  - concept
  prompt:
    vi: Trong slide hồi quy với các điểm $(1,2),(2,5),(3,3)$, cost bình phương đo điều gì?
    en: In the regression slide with points $(1,2),(2,5),(3,3)$, what does the squared cost measure?
  explanation:
    vi: Cost cộng bình phương residual giữa dự đoán $mx_i+b$ và nhãn $y_i$. Nó không đo khoảng cách ngang hay số điểm dữ liệu.
    en: The cost sums squared residuals between predictions $mx_i+b$ and targets $y_i$. It is not horizontal distance or merely the data count.
  hints: []
  options:
  - vi: Tổng các $(mx_i+b-y_i)^2$.
    en: The sum of $(mx_i+b-y_i)^2$ terms.
  - vi: Tổng các khoảng cách ngang tới trục $y$.
    en: The sum of horizontal distances to the $y$-axis.
  - vi: Số điểm nằm trên đường thẳng.
    en: The number of points that lie on the line.
  - vi: Giá trị $x_1+x_2+x_3$.
    en: The value $x_1+x_2+x_3$.
  answer:
  - 0
- id: c2w2-linear-regression-truefalse-22
  topic: linear-regression
  type: true-false
  difficulty: 1
  tags:
  - misconception
  prompt:
    vi: Đổi residual từ dự đoán-trừ-nhãn sang nhãn-trừ-dự đoán không đổi squared loss.
    en: Changing residuals from prediction-minus-target to target-minus-prediction does not change squared loss.
  explanation:
    vi: 'Đúng vì bình phương làm mất dấu: $r^2=(-r)^2$. Tuy vậy khi đạo hàm, phải dùng một quy ước dấu nhất quán.'
    en: 'True because squaring removes the sign: $r^2=(-r)^2$. However, derivatives require a consistent sign convention.'
  hints: []
  answer: true
  reasons:
  - vi: Bình phương residual không phụ thuộc dấu của residual.
    en: Squared residuals do not depend on the residual sign.
  - vi: Vì residual luôn bằng 0 trong hồi quy.
    en: Because residuals are always zero in regression.
  reasonAnswer: 0
- id: c2w2-linear-regression-matching-23
  topic: linear-regression
  type: matching
  difficulty: 1
  tags:
  - connections
  prompt:
    vi: Ghép các phần của mô hình đường thẳng trong ví dụ power-line.
    en: Match parts of the line-fitting model in the power-line example.
  explanation:
    vi: Mỗi cặp tách rõ dữ liệu quan sát, dự đoán của đường thẳng, và residual được bình phương.
    en: Each pair separates observed data, line prediction, and the residual that is squared.
  hints: []
  pairs:
  - left:
      vi: $mx_i+b$
      en: $mx_i+b$
    right:
      vi: Dự đoán của đường thẳng
      en: Prediction made by the line
  - left:
      vi: $mx_i+b-y_i$
      en: $mx_i+b-y_i$
    right:
      vi: Residual theo quy ước prediction-target
      en: Residual using prediction-minus-target
  - left:
      vi: $(1,2),(2,5),(3,3)$
      en: $(1,2),(2,5),(3,3)$
    right:
      vi: Dữ liệu trong slide
      en: Data points in the slide
- id: c2w2-linear-regression-numeric-24
  topic: linear-regression
  type: numeric
  difficulty: 1
  tags:
  - calculation
  prompt:
    vi: Với đường $y=1x+1$, tính residual tại các điểm $(1,2)$ và $(2,5)$ theo prediction-target.
    en: For the line $y=1x+1$, compute residuals at $(1,2)$ and $(2,5)$ using prediction-minus-target.
  explanation:
    vi: Dự đoán tại $x=1$ là $2$, residual $0$; tại $x=2$ là $3$, residual $3-5=-2$.
    en: At $x=1$ the prediction is $2$, residual $0$; at $x=2$ the prediction is $3$, residual $3-5=-2$.
  hints: []
  answers:
  - label: r_1
    value: 0
  - label: r_2
    value: -2
- id: c2w2-linear-regression-multistep-47
  topic: linear-regression
  type: multi-step
  difficulty: 2
  tags:
  - least-squares
  prompt:
    vi: Với điểm $(1,2),(2,5),(3,3)$ và $y=mx+b$.
    en: For points $(1,2),(2,5),(3,3)$ and $y=mx+b$.
  explanation:
    vi: Residual và square loss tạo cost theo $m,b$.
    en: Residuals and squared loss create a cost in $m,b$.
  hints: []
  parts:
  - type: numeric
    prompt:
      vi: Tại $m=1,b=0$, tổng bình phương lỗi là?
      en: At $m=1,b=0$, what is the sum of squared errors?
    answers:
    - value: 10
    explanation:
      vi: Dự đoán 1,2,3; lỗi -1,-3,0; SSE = 1+9=10.
      en: Predictions 1,2,3; errors -1,-3,0; SSE = 1+9=10.
    tolerance: 0.001
  - type: numeric
    prompt:
      vi: 'Sửa: với $m=1,b=1$, SSE là?'
      en: Now with $m=1,b=1$, what is SSE?
    answers:
    - value: 5
    explanation:
      vi: Dự đoán 2,3,4; lỗi 0,-2,1; SSE=5.
      en: Predictions 2,3,4; errors 0,-2,1; SSE=5.
- id: c2w2-linear-regression-numeric-48
  topic: linear-regression
  type: numeric
  difficulty: 1
  tags:
  - least-squares
  prompt:
    vi: Với $E=14m^2+3b^2+38+12mb-42m-20b$, tính $E_m,E_b$ tại $m=0,b=0$.
    en: For $E=14m^2+3b^2+38+12mb-42m-20b$, compute $E_m,E_b$ at $m=0,b=0$.
  explanation:
    vi: $E_m=-42$, $E_b=-20$.
    en: $E_m=-42$, $E_b=-20$.
  hints: []
  answers:
  - label: E_m
    value: -42
  - label: E_b
    value: -20
