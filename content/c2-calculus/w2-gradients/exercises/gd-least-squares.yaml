    en: Match quantities in gradient descent for line fitting.
  explanation:
    vi: Các cặp phân biệt dự đoán, residual, và hai thành phần gradient theo $m,b$.
    en: The pairs distinguish prediction, residual, and the two gradient components for $m,b$.
