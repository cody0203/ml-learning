- id: c2w2-gd-least-squares-mcq-37
  topic: gd-least-squares
  type: mcq
  difficulty: 1
  tags:
  - concept
  prompt:
    vi: Trong least squares cho $y=mx+b$, đại lượng nào được lấy trung bình để cập nhật $b$?
    en: In least squares for $y=mx+b$, which quantity is averaged to update $b$?
  explanation:
    vi: Đạo hàm theo $b$ là trung bình residual $mx_i+b-y_i$. Đạo hàm theo $m$ mới nhân thêm $x_i$.
    en: The derivative with respect to $b$ is the mean residual $mx_i+b-y_i$. The derivative with respect to $m$ is the one that multiplies by $x_i$.
  hints: []
  options:
  - vi: Trung bình của residual $mx_i+b-y_i$.
    en: The mean of residuals $mx_i+b-y_i$.
  - vi: Chỉ trung bình của $x_i$.
    en: The mean of $x_i$ alone.
  - vi: Tổng bình phương của slope.
    en: The square of the slope summed over data.
  - vi: Định thức của ma trận dữ liệu.
    en: The determinant of the data matrix.
  answer:
  - 0
- id: c2w2-gd-least-squares-truefalse-38
  topic: gd-least-squares
  type: true-false
  difficulty: 1
  tags:
  - misconception
  prompt:
    vi: Với cost $J=\frac1{2n}\sum r_i^2$, đạo hàm theo $m$ là trung bình của $r_ix_i$.
    en: For $J=\frac1{2n}\sum r_i^2$, the derivative with respect to $m$ is the mean of $r_ix_i$.
  explanation:
    vi: Đúng. Chain rule cho $r_i=mx_i+b-y_i$ tạo hệ số $x_i$ khi đạo hàm residual theo $m$.
    en: True. The chain rule for $r_i=mx_i+b-y_i$ contributes a factor $x_i$ when differentiating residuals with respect to $m$.
  hints: []
  answer: true
  reasons:
  - vi: $dr_i/dm=x_i$, nên mỗi residual được nhân $x_i$.
    en: $dr_i/dm=x_i$, so each residual is multiplied by $x_i$.
  - vi: Vì $m$ luôn bằng trung bình của $y$.
    en: Because $m$ always equals the mean of $y$.
  reasonAnswer: 0
- id: c2w2-gd-least-squares-matching-39
  topic: gd-least-squares
  type: matching
  difficulty: 1
  tags:
