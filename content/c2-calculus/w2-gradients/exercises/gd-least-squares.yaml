- id: c2w2-gd-least-squares-code-61
  topic: gd-least-squares
  type: code
  difficulty: 3
  tags:
  - code
  - numpy
  prompt:
    vi: Cài đặt linear regression gradient descent; không dùng shortcut tối ưu hóa.
    en: Implement linear regression gradient descent; do not use optimization shortcuts.
  explanation:
    vi: Lời giải vector hóa residual, lấy `mean(err*x)` và `mean(err)`, rồi cập nhật cả slope và intercept ở mỗi vòng.
    en: The solution vectorizes residuals, uses `mean(err*x)` and `mean(err)`, then updates both slope and intercept each iteration.
  hints: []
  starter: "import numpy as np\ndef linreg_gd(x,y,alpha=0.1,steps=100):\n    return 0.0,0.0\n"
  solution: "import numpy as np\ndef linreg_gd(x,y,alpha=0.1,steps=100):\n    x=np.array(x,dtype=float); y=np.array(y,dtype=float);\
    \ m=0.; b=0.\n    for _ in range(steps):\n        err=m*x+b-y\n        m -= alpha*np.mean(err*x)\n        b -= alpha*np.mean(err)\n\
    \    return m,b\n"
  tests: "import numpy as np\ndef test_line():\n    m,b=linreg_gd(np.array([0.,1.,2.]),np.array([1.,3.,5.]),0.1,300)\n   \
    \ assert abs(m-2)<1e-2 and abs(b-1)<1e-2\n"
