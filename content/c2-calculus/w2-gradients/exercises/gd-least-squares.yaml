      en: $db$
    right:
      vi: $\mathrm{mean}(r)$
      en: $\mathrm{mean}(r)$
  - left:
      vi: $dm$
      en: $dm$
    right:
      vi: $\mathrm{mean}(r x)$
      en: $\mathrm{mean}(r x)$
- id: c2w2-gd-least-squares-numeric-40
  topic: gd-least-squares
  type: numeric
  difficulty: 1
  tags:
  - calculation
  prompt:
    vi: Với dữ liệu $(0,1),(1,3),(2,5)$ tại $m=0,b=0$, tính $dm$ và $db$ cho cost trung bình.
    en: For data $(0,1),(1,3),(2,5)$ at $m=0,b=0$, compute $dm$ and $db$ for the averaged cost.
  explanation:
    vi: Residual là $[-1,-3,-5]$. $db$ là mean residual $-3$; $dm$ là mean của $[0,-3,-10]$, tức $-13/3$.
    en: Residuals are $[-1,-3,-5]$. $db$ is the mean residual $-3$; $dm$ is the mean of $[0,-3,-10]$, which is $-13/3$.
  hints: []
  answers:
  - label: dm
    value: -4.333333333333333
  - label: db
    value: -3
- id: c2w2-gd-least-squares-parsons-55
  topic: gd-least-squares
  type: parsons
  difficulty: 2
  tags:
  - algorithm
  prompt:
    vi: Sắp xếp vòng lặp gradient descent cho least squares.
    en: Order the least-squares gradient descent loop.
  explanation:
    vi: Ta dự đoán, tính residual, lấy gradient trung bình, cập nhật tham số.
    en: Predict, compute residuals, average gradients, update parameters.
  hints: []
  steps:
  - vi: Tính $\hat y=m x+b$ cho mọi điểm.
    en: Compute $\hat y=m x+b$ for all points.
  - vi: Tính residual $r=\hat y-y$.
    en: Compute residuals $r=\hat y-y$.
  - vi: Tính $dm=\mathrm{mean}(r x)$ và $db=\mathrm{mean}(r)$.
    en: Compute $dm=\mathrm{mean}(r x)$ and $db=\mathrm{mean}(r)$.
  - vi: Cập nhật $m\leftarrow m-\alpha dm$, $b\leftarrow b-\alpha db$.
    en: Update $m\leftarrow m-\alpha dm$, $b\leftarrow b-\alpha db$.
- id: c2w2-gd-least-squares-predictoutput-56
  topic: gd-least-squares
  type: predict-output
  difficulty: 1
