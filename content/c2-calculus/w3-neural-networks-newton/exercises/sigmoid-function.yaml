exercises:
- id: c2w3-sigmoid-function-matching-03
  topic: sigmoid-function
  type: matching
  difficulty: 1
  tags:
  - vocabulary
  prompt:
    vi: Ghép ký hiệu trên đồ thị sigmoid.
    en: Match notation on the sigmoid curve.
  explanation:
    vi: $z$ là trục ngang, $\sigma(z)$ là xác suất, và $\sigma'(z)$ là slope cục bộ.
    en: $z$ is the horizontal score, $\sigma(z)$ is the probability, and $\sigma'(z)$ is the local slope.
  hints: []
  pairs:
  - left:
      vi: $\alpha$
      en: $\alpha$
    right:
      vi: learning rate
      en: learning rate
  - left:
      vi: $\nabla L$
      en: $\nabla L$
    right:
      vi: gradient của loss
      en: loss gradient
  - left:
      vi: $b$
      en: $b$
    right:
      vi: bias
      en: bias
- id: c2w3-sigmoid-function-find-error-04
  topic: sigmoid-function
  type: find-error
  difficulty: 2
  tags:
  - debugging
  prompt:
    vi: Tìm lỗi khi lấy đạo hàm sigmoid.
    en: Find the error when differentiating sigmoid.
  explanation:
    vi: Đạo hàm sigmoid không phải $\sigma(z)$; cần nhân thêm $1-\sigma(z)$.
    en: The sigmoid derivative is not just $\sigma(z)$; it must be multiplied by $1-\sigma(z)$.
  hints: []
  steps:
  - vi: Tính gradient hiện tại $g$.
    en: Compute the current gradient $g$.
  - vi: Cập nhật $\theta\leftarrow\theta+\alpha g$.
    en: Update $\theta\leftarrow\theta+\alpha g$.
  - vi: Lặp đến khi loss nhỏ.
    en: Repeat until the loss is small.
  answer: 1
- id: c2w3-sigmoid-function-numeric-05
  topic: sigmoid-function
  type: numeric
  difficulty: 1
  tags:
  - sigmoid
  prompt:
    vi: Tính $\sigma(0)$ và $\sigma'(0)$.
    en: Compute $\sigma(0)$ and $\sigma'(0)$.
  explanation:
    vi: $\sigma(0)=0.5$, đạo hàm $0.5(0.5)=0.25$.
    en: $\sigma(0)=0.5$, derivative $0.5(0.5)=0.25$.
  hints: []
  answers:
  - label: sigma0
    value: 0.5
  - label: derivative0
    value: 0.25
  tolerance: 1.0e-09
- id: c2w3-sigmoid-function-code-06
  topic: sigmoid-function
  type: code
  difficulty: 2
  tags:
  - code
  prompt:
    vi: Cài `sigmoid_and_grad(z)` trả sigmoid và đạo hàm.
    en: Implement `sigmoid_and_grad(z)` returning sigmoid and derivative.
  explanation:
    vi: Dùng $s(1-s)$ cho đạo hàm.
    en: Use $s(1-s)$ for derivative.
  hints: []
  starter: "import numpy as np\ndef sigmoid_and_grad(z):\n    return z, z\n"
  solution: "import numpy as np\ndef sigmoid_and_grad(z):\n    z=np.asarray(z,dtype=float)\n    s=1/(1+np.exp(-z))\n    return s, s*(1-s)\n"
  tests: "import numpy as np\ndef test_zero():\n    s,g=sigmoid_and_grad(0.0); assert abs(float(s)-0.5)<1e-9; assert abs(float(g)-0.25)<1e-9\ndef test_array():\n    s,g=sigmoid_and_grad(np.array([-1.,1.])); assert np.allclose(g, s*(1-s))\n"
- id: c2w3-sigmoid-function-predict-output-07
  topic: sigmoid-function
  type: predict-output
  difficulty: 1
  tags:
  - numpy
  prompt:
    vi: Đoán output đạo hàm sigmoid tại 0.
    en: Predict the sigmoid-derivative output at 0.
  explanation:
    vi: Sigmoid tại 0 là 0.5.
    en: Sigmoid at 0 is 0.5.
  hints: []
  code: 'import numpy as np

    z=0

    s=1/(1+np.exp(-z))

    print(s*(1-s))'
  options:
  - '0.25'
  - '0.5'
  - '1.0'
  answer: 0
